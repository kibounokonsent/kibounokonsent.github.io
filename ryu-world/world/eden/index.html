<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>悠久の楽園 ― 龍の世界</title>
    <link rel="icon" href="../../assets/images/favicon.svg" type="image/svg+xml">

    <link rel="stylesheet" href="../../assets/css/eden.css">
    <link rel="stylesheet" href="../../assets/css/eden-places.css">
    <!-- 調律（音・揺らぎ）：全ページ共通 -->
    <script src="../../assets/js/ryu-tuning.js" data-ambient="none" data-ui="none"></script>

</head>

<!--
    悠久の楽園の「枠」。
    音楽（歓喜の歌）はこのページが流し続け、楽園の中の場所（門・龍の間・
    天使たち・生命の木・知恵の木・龍の書）は中の枠に読み込んで切り替える。
    そのため、場所を移っても曲が途切れず、かけ直す必要もない。

    #angels のように # を付けると、その場所から開く（例：index.html#book）。
-->
<body class="eden-shell is-ready">

    <iframe id="eden-frame" title="悠久の楽園"></iframe>

    <button type="button" id="music-toggle" aria-pressed="false">
        <span class="music-icon" aria-hidden="true"></span>
        <span class="music-label">歓喜の歌</span>
    </button>

    <!-- 歓喜の歌（フリーBGMとして無料配布されている音源） -->
    <audio id="music" src="../../assets/eden/joy.mp3" loop preload="none"></audio>

    <script src="../../assets/js/eden-music.js"></script>
    <script src="../../assets/js/eden-shell.js"></script>

</body>

</html>
