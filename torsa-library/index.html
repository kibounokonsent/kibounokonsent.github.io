</section>

<div class="overlay" id="talk" hidden>
  <div class="talk-wrap" role="dialog" aria-modal="true" aria-labelledby="speaker">
    <div class="book-box">
      <div class="book-body" id="bookBody"><div class="cover" id="bigCover"></div></div>
      <div class="emote" id="emote"></div>
    </div>
    <div class="say-col">
      <span class="speaker" id="speaker"></span>
      <div class="say round" id="say">
        <svg class="shape" id="sayShape" aria-hidden="true"><path id="sayTail" class="sline"/><path id="sayPath" class="sline"/><path id="sayTailFill" class="sfill"/></svg>
        <p class="line" id="line" aria-live="polite"></p>
        <span class="next" id="next" hidden>▼</span>
      </div>
      <div class="actions" id="actions"></div>
    </div>
  </div>
</div>

<div class="overlay" id="catalog" hidden>
  <div class="panel catalog-panel" role="dialog" aria-modal="true" aria-labelledby="catTitle">
    <div class="cat-head" id="catHead">
      <div class="cat-titlebar">
        <h2 id="catTitle">蔵書目録</h2>
        <button type="button" class="cat-toggle" id="catToggle" aria-expanded="true" aria-controls="catFilters">検索を隠す</button>
      </div>
      <div id="catFilters">
        <p class="sub">題名やことば、カテゴリーから、どの本にもすぐ会えます。</p>
        <input type="search" class="cat-search" id="catSearch" placeholder="題名・作者・ことばで探す" aria-label="蔵書を探す" autocomplete="off">
        <div class="cat-row"><span class="lbl" id="catPlaceLbl">場所</span><div class="chips" id="catPlaces" role="group" aria-labelledby="catPlaceLbl"></div></div>
        <div class="cat-row"><span class="lbl" id="catCatLbl">カテゴリー</span><div class="chips" id="catCats" role="group" aria-labelledby="catCatLbl"></div></div>
      </div>
      <p class="cat-count" id="catCount" aria-live="polite"></p>
    </div>
    <ul class="cat-list" id="catList"></ul>
    <p class="cat-lock" id="catLock" hidden></p>
    <div class="panel-foot">
      <button class="btn small" id="resetBtn">来館記録をリセット</button>
      <button class="btn small primary" id="catClose">閉じる</button>
    </div>
  </div>
</div>

<section class="room" id="room" aria-labelledby="roomName" hidden>
  <div class="room-scroll" id="roomScroll"><div class="room-stage" id="roomStage"></div></div>
  <div class="room-ui"><button class="btn small" id="roomBack"><span aria-hidden="true">←</span> <span id="roomBackTo">もどる</span></button></div>
  <div class="room-plate"><span class="en" id="roomEn"></span><span class="nm" id="roomName"></span></div>
  <p class="room-hint" id="roomHint"></p>
</section>
<p class="room-whisper" id="roomWhisper" aria-live="polite"></p>

<div class="overlay" id="ageGate" hidden>
  <div class="gate-panel" role="dialog" aria-modal="true" aria-labelledby="ageTitle" aria-describedby="ageBody">
    <svg class="seal" viewBox="0 0 64 64" aria-hidden="true"><defs><radialGradient id="gSeal" cx=".4" cy=".35"><stop offset="0" stop-color="#d0565a"/><stop offset=".7" stop-color="#8e2f36"/><stop offset="1" stop-color="#5e1a22"/></radialGradient></defs><path d="M32 4c4 3 8 1 11 4s2 8 5 11 8 3 9 7-3 7-2 11 5 7 3 11-7 3-10 6-3 8-7 9-6-4-9-4-6 5-10 3-3-7-6-9-8-1-9-5 4-7 3-11-6-6-4-10 7-3 9-6 1-8 5-10 7 2 11-1 6-5 6-5Z" fill="url(#gSeal)"/><circle cx="32" cy="32" r="16" fill="none" stroke="#f0b9b2" stroke-width="1.2" opacity=".7"/><path d="M32 21v22M24 27l16 10M40 27 24 37" stroke="#f7e2a8" stroke-width="2" stroke-linecap="round" opacity=".85"/></svg>
    <h2 id="ageTitle">禁書庫</h2>
    <p class="g-lead" id="ageLead"></p>
    <div id="ageBody"></div>
    <p class="g-q" id="ageQ"></p>
    <div class="gate-actions">
      <button class="btn enter" id="ageYes"></button>
      <button class="btn back" id="ageNo"></button>
    </div>
  </div>
</div>
<div id="curtain" aria-hidden="true"><p class="loading-msg"><span class="ld-star">✦</span>Now Loading<span class="ld-dots"><i>.</i><i>.</i><i>.</i></span></p></div>

<section id="reader" aria-label="読書" hidden>
  <div class="r-head">
    <span class="where" id="rWhere"></span>
    <button class="btn small" id="sizeBtn">文字 中</button>

    s += `</g><path d="${arch}" fill="none" stroke="#fff3c4" stroke-opacity=".18" stroke-width="60"/><path d="${arch}" fill="none" stroke="url(#frameG)" stroke-width="26"/><path d="${arch}" fill="none" stroke="${C.gold}" stroke-width="4" opacity=".8"/>
      <path d="M1080 800 H1720 V830 H1080 Z" fill="#7b6450"/>
      <path d="${star4(cx, 70, 24)}" fill="${C.gold}"/><!--/win-->
      <!--floor--><rect x="${-E}" y="860" width="${2800 + 2 * E}" height="140" fill="#141a40"/>
      <ellipse cx="1300" cy="905" rx="190" ry="32" fill="#7d96ff" opacity=".1"/><ellipse cx="1500" cy="930" rx="170" ry="30" fill="#b48aff" opacity=".1"/><ellipse cx="1400" cy="965" rx="230" ry="26" fill="#ffe7a0" opacity=".08"/>
      <polygon points="1130,820 1670,820 1980,1000 820,1000" fill="url(#beam)"/><!--/floor-->`;

  // 先のとがった葉。rib=true で葉脈（中央の筋）を描く
  function leaf(x, y, len, w, ang, fill, rib = true) {
    const L = f1(len), Wd = f1(w);
    let g = `<path d="M0 0C${Wd} ${f1(-len * .28)} ${f1(w * .9)} ${f1(-len * .74)} 0 ${-L}C${f1(-w * .9)} ${f1(-len * .74)} ${-Wd} ${f1(-len * .28)} 0 0Z" fill="${fill}"/>`;
    if (rib) g += `<path d="M0 -2Q${f1(w * .12)} ${f1(-len * .5)} 0 ${f1(-len * .93)}" stroke="#d8f0c0" stroke-opacity=".38" stroke-width="${f1(Math.max(1, w * .1))}" fill="none"/>`;
    return `<g transform="translate(${f1(x)} ${f1(y)}) rotate(${f1(ang)})">${g}</g>`;
  }
  function pottedPlant(x, y, k, r, potColor = "#8b5d3e") {
    let s = "";

    for (let i = 0; i < 11; i++) { const a = -75 + i * 15 + (r() - .5) * 10; s += leaf(x, y - 4 * k, (60 + r() * 50) * k, (12 + r() * 6) * k, a, greens[i % 4]); }
    s += `<ellipse cx="${x}" cy="${f1(y + 46 * k)}" rx="${f1(30 * k)}" ry="${f1(5 * k)}" fill="#000" opacity=".3"/><path d="M${f1(x - 30 * k)} ${f1(y - 6 * k)} H${f1(x + 30 * k)} L${f1(x + 22 * k)} ${f1(y + 44 * k)} H${f1(x - 22 * k)} Z" fill="url(#potG)"/><rect x="${f1(x - 33 * k)}" y="${f1(y - 10 * k)}" width="${f1(66 * k)}" height="${f1(9 * k)}" rx="2" fill="url(#potRim)"/><path d="M${f1(x - 18 * k)} ${f1(y + 6 * k)} q${f1(18 * k)} ${f1(6 * k)} ${f1(36 * k)} 0" stroke="#e7c08f" stroke-opacity=".35" stroke-width="${f1(2 * k)}" fill="none"/>`;
    return s;
  }
  function ivy(x, y, len, r) {
    let s = `<path d="M${x} ${y} q${f1(-10 + r() * 20)} ${f1(len / 2)} ${f1(-6 + r() * 12)} ${len}" stroke="#4a6e42" stroke-width="2.5" fill="none"/>`;
    for (let t = 10; t < len; t += 16) s += leaf(x + (r() - .5) * 12, y + t, 14 + r() * 6, 6, r() < .5 ? -50 - r() * 30 : 50 + r() * 30, r() < .5 ? "url(#leafB)" : "url(#leafC)", false);
    return s;
  }
  function pillarBody(p) {

  }
  function archBody(a, span) {
    const b = a + span;
    return `<path d="M${a} 160 H${b}" stroke="${C.wood}" stroke-width="20"/><path d="M${a} 168 Q${(a + b) / 2} 40 ${b} 168" fill="none" stroke="${C.wood}" stroke-width="16"/><path d="M${a + 16} 166 Q${(a + b) / 2} 58 ${b - 16} 166" fill="none" stroke="${C.gold}" stroke-width="2.5" opacity=".7"/><path d="${star4((a + b) / 2, 84, 10)}" fill="${C.gold}"/>`;
  }
  function grandArchBody(a) {
    return `<path d="M${a} 180 C${a} -60 ${a + 680} -60 ${a + 680} 180" fill="none" stroke="${C.wood}" stroke-width="26"/><path d="M${a + 18} 180 C${a + 18} -30 ${a + 662} -30 ${a + 662} 180" fill="none" stroke="${C.gold}" stroke-width="3" opacity=".7"/>`;

  function lanternBody(x, y) {

      <path d="M${x - 14} ${y - 26} H${x + 14} L${x + 18} ${y + 18} H${x - 18} Z" fill="#ffe2a0" stroke="#7d5a38" stroke-width="3"/>
      <path d="M${x - 18} ${y - 30} H${x + 18} L${x + 12} ${y - 22} H${x - 12} Z M${x - 20} ${y + 18} H${x + 20} L${x + 14} ${y + 26} H${x - 14} Z" fill="#7d5a38"/>`;

  function candleBody(x, y) { return `<rect x="${x - 5}" y="${y - 4}" width="10" height="34" rx="2" fill="#f4ecd8"/><path d="M${x} ${y - 20} q6 10 0 16 q-6 -6 0 -16" fill="#ffcf6e"/>`; }
  function carpetTile() {

    return s + `<path d="M0 866 H720 M0 986 H720" stroke="${C.gold}" stroke-width="3" opacity=".75"/><path d="M0 874 H720 M0 978 H720" stroke="${C.gold}" stroke-width="1" opacity=".45"/>`;

  function frontCluster(x, r) { let s = ""; for (let i = 0; i < 14; i++) s += leaf(x + (r() - .5) * 60, 1060, 110 + r() * 150, 20 + r() * 10, -70 + i * 10 + (r() - .5) * 12, r() < .5 ? "#0f1d1c" : "#132522", false); return s; }

  const SPINES = ["#7c3b3f", "#3f5a7c", "#5a4a7a", "#8a6a3a", "#44694c", "#6a3f5c", "#2f4a68", "#9a7a4e", "#5c3a2c", "#3e3e62", "#7a5a8a", "#476a7a"];
  function bayBody(x, seed, liveBooks, spots) {
    const r = rng(seed), rows = 5, rowH = 116, top0 = 250; let s = "";
    s += `<ellipse cx="${x + 200}" cy="852" rx="240" ry="16" fill="#000" opacity=".35"/><rect x="${x}" y="220" width="400" height="620" fill="url(#woodV)"/><rect x="${x + 16}" y="244" width="368" height="586" fill="url(#shelfBackG)"/>

    for (let row = 0; row < rows; row++) {
      const y0 = top0 + row * rowH, base = y0 + 104;

      let bx = x + 24, i = 0;

        const lv = live.find((b) => b.place.slot === i);
        if (lv) { spots[lv.id] = { x: bx, y: base - 96, w: 30, h: 96 }; bx += 34; i++; continue; }
        const roll = r();
        if (roll < .05 && bx < x + 330) { s += pottedPlant(bx + 22, base - 40, .45, r); bx += 46; i++; continue; }
        if (roll < .08 && bx < x + 340) { s += `<circle cx="${f1(bx + 16)}" cy="${base - 18}" r="16" fill="#3d6fa0"/><path d="M${f1(bx + 2)} ${base - 22} q14 -8 28 0" stroke="#7fae66" stroke-width="5" fill="none"/><rect x="${f1(bx + 8)}" y="${base - 4}" width="16" height="4" fill="${C.gold}"/>`; bx += 36; i++; continue; }
        const w = 13 + r() * 11, h = 60 + r() * 34, col = SPINES[Math.floor(r() * SPINES.length)];
        const lean = r() < .07 ? -8 : 0;
        s += `<g${lean ? ` transform="rotate(${lean} ${f1(bx + w)} ${base})"` : ""}><rect x="${f1(bx)}" y="${f1(base - h)}" width="${f1(w)}" height="${f1(h)}" fill="${col}"/><rect x="${f1(bx + 2)}" y="${f1(base - h + 8)}" width="${f1(w - 4)}" height="3" fill="${C.gold}" opacity=".55"/><rect x="${f1(bx + 2)}" y="${f1(base - 14)}" width="${f1(w - 4)}" height="2" fill="${C.gold}" opacity=".4"/><rect x="${f1(bx)}" y="${f1(base - h)}" width="${f1(w)}" height="${f1(h)}" fill="url(#spineShade)"/></g>`;
        bx += w + 1.5 + (lean ? 6 : 0); i++;

      s += `<rect x="${x + 16}" y="${y0 - (row ? 0 : 6)}" width="368" height="26" fill="url(#shadowDown)"/><rect x="${x + 10}" y="${base}" width="380" height="12" fill="url(#boardG)"/><rect x="${x + 10}" y="${base + 12}" width="380" height="4" fill="#000" opacity=".3"/>`;
    }
    s += `<rect x="${x + 16}" y="244" width="368" height="586" fill="url(#caseSide)"/><rect x="${x}" y="200" width="400" height="640" fill="url(#caseLight)"/>`;
    // 上の植物とツタ
    s += pottedPlant(x + 60 + r() * 40, 200, .7, r);
    for (let k = 0; k < 3; k++) s += ivy(x + 40 + r() * 320, 212, 60 + r() * 120, r);
    return s;
  }

  // 本棚の絵と、手に取れる本の位置を作る
  function midSVG(lib, books) {

      <pattern id="carpetP" width="120" height="150" patternUnits="userSpaceOnUse"><path d="${star4(60, 74, 7)}" fill="${C.gold}" opacity=".45"/><path d="M0 74 L10 68 L20 74 L10 80 Z M100 74 L110 68 L120 74 L110 80 Z" fill="#2f3f80"/></pattern></defs>`;
    // 床とカーペット
    const R0 = L + W;
    s += `<rect x="${L}" y="836" width="${W}" height="20" fill="${C.woodD}"/><rect x="${L}" y="852" width="${W}" height="148" fill="url(#carpetG)"/>
      <rect x="${L}" y="852" width="${W}" height="148" fill="url(#carpetP)"/>

      <!--floorlight--><ellipse cx="1800" cy="935" rx="430" ry="70" fill="url(#moonPool)"/>
      <ellipse cx="1700" cy="915" rx="140" ry="22" fill="#7d96ff" opacity=".08"/><ellipse cx="1890" cy="945" rx="130" ry="22" fill="#b48aff" opacity=".08"/><ellipse cx="1800" cy="975" rx="170" ry="18" fill="#ffe7a0" opacity=".07"/>
      <polygon points="1700,0 1900,0 2080,1000 1520,1000" fill="url(#moonBeam)"/><!--/floorlight-->`;

      <!--desk--><g><rect x="1880" y="752" width="210" height="14" rx="3" fill="${C.woodL}"/><rect x="1895" y="766" width="12" height="72" fill="${C.woodD}"/><rect x="2063" y="766" width="12" height="72" fill="${C.woodD}"/>

  function frontSVG() {
    const r = rng(91); let s = "";

  /* ====================================================
     部品（パーツ）：分けて加工・差し替えできるように1つずつ描き、配置して組み立てる
     ==================================================== */
  const cut = (svg, name) => { const m = svg.match(new RegExp(`<!--${name}-->([\\s\\S]*?)<!--/${name}-->`)); return m ? m[1] : ""; };
  const defsOf = (svg) => (svg.match(/<defs>[\s\S]*?<\/defs>/) || [""])[0];
  const noGlow = (s) => s.replace(/<circle[^>]*lampGlow[^>]*\/>/g, "").replace(/<circle r="\d+" fill="[^"]*"><animateMotion[^>]*\/><\/circle>/g, "");
  function partsSrc(lib) {
    const mid = midSVG(lib, []).svg, back = backSVG(), md = defsOf(mid), bd = defsOf(back), P = {};
    const add = (name, defs, body, vb) => { P[name] = { svg: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${vb.join(" ")}">${defs}${body}</svg>`, box: vb }; };
    add("bookcase_a", md, bayBody(0, 11, [], {}), [-40, 110, 480, 760]);
    add("bookcase_b", md, bayBody(0, 42, [], {}), [-40, 110, 480, 760]);
    add("pillar", md, pillarBody(0), [-28, 148, 56, 690]);

  const at = (x, y, w, h) => `left:${f1(x / STAGE_W * 100)}%;top:${f1(y / 10)}%;width:${f1(w / STAGE_W * 100)}%;${h != null ? `height:${f1(h / 10)}%;` : ""}`;

  const partFile = (name) => (PART_THEME && (PART_THEME.recolored || []).includes(name) ? `${PART_THEME.dir}/${name}${PART_EXT(name)}` : `assets/parts/${name}${PART_EXT(name)}`);
  const part = (name, x, y, w, extra = "", cls = "") => `<img class="part ${cls}" src="${partFile(name)}" alt="" style="${at(x, y, w)}${extra}">`;
  const flipX = "transform:scaleX(-1);";
  // 鎖：(x1,y1)→(x2,y2) に輪をつなげる

  const pedestalSVG = () => `<svg viewBox="0 0 110 150" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="pdS" x1="0" x2="1"><stop offset="0" stop-color="#1d1622"/><stop offset=".45" stop-color="#3a2e3e"/><stop offset="1" stop-color="#151018"/></linearGradient></defs><rect x="8" y="0" width="94" height="16" rx="2" fill="#4a3a4e"/><rect x="22" y="16" width="66" height="112" fill="url(#pdS)"/><path d="M30 40h50M30 70h50M30 100h50" stroke="#000" stroke-opacity=".35"/><rect x="2" y="128" width="106" height="22" rx="2" fill="#2a2030"/><path d="M40 16v112" stroke="#b0463f" stroke-opacity=".25"/></svg>`;

  const tagOf = (b) => esc(((workOf(b) || {}).genre) || "本");
  // 展示台（段ごとに斜めの棚板）
  function standSVG(tiers) {

    s += `<rect x="6" y="40" width="14" height="${H - 40}" fill="#5b3d2b"/><rect x="${W - 20}" y="40" width="14" height="${H - 40}" fill="#5b3d2b"/><rect x="0" y="30" width="${W}" height="14" rx="3" fill="url(#stW)"/>`;

  // 目録の箱（カード目録の引き出し）

  /* ---------- 館の棟（本館・東の書館・西の書館）：棟を切りかえるたびに、館内を組み立て直す ---------- */
  let HALL_ID = "main", SCENE = null;
  function HALL() { const hs = (DATA && DATA.library.halls) || {}; return hs[HALL_ID] || hs.main || { name: "本館", doors: {} }; }
  function ZONES() { return HALL().zones || DATA.library.zones; }
  const RAY_BASE = RAYS.map((r) => r.c);
  // 棟のテーマの部品：recolored に書いた部品は dir のフォルダの色ちがい、swap に書いた部品は別の部品に差しかえる
  function themedParts(base, th) {
    const out = { ...base };
    (th.recolored || []).forEach((n) => { if (base[n]) out[n] = { ...base[n], file: `${th.dir}/${n}${/\.webp$/.test(base[n].file) ? ".webp" : ".svg"}` }; });
    Object.entries(th.swap || {}).forEach(([n, to]) => { if (base[to]) out[n] = { ...base[to] }; });
    return out;
  }
  // 禁書庫のしずく（天井から床へ）と水たまり
  function hallDrips() {
    const r = rng(77), P = WORLD.plan; let s = "";
    for (let x = P.L + 140; x < P.R - 100; x += 180 + r() * 260) {
      const dur = (4.5 + r() * 3.5).toFixed(1), dl = (-r() * 6).toFixed(1), top = 14 + r() * 4;
      s += `<div class="hdrip" style="left:${((x - P.L) / P.W * 100).toFixed(2)}%;top:${top.toFixed(1)}%;height:${(85.5 - top).toFixed(1)}%"><i style="animation-duration:${dur}s;animation-delay:${dl}s"></i></div>`;
      s += `<div class="hpuddle" style="left:${((x - 70 - P.L) / P.W * 100).toFixed(2)}%;width:${(140 / P.W * 100).toFixed(2)}%"><i style="animation-duration:${dur}s;animation-delay:${(+dl + dur * .82).toFixed(1)}s"></i></div>`;
    }
    return s;
  }
  function buildHall(id) {
    HALL_ID = id; WORLD.westEnd = WORLD.westDoor = undefined; WORLD.eastEnd = WORLD.eastDoor = undefined; // westEnd／westDoor：西の書館の奥にカネルの廊下があるとき（kaneru/kaneru.js）
    document.body.dataset.hall = id;
    document.body.classList.toggle("in-vault", !!(HALL().vault)); vaultView = null;
    const library = DATA.library, scene = SCENE, H = HALL();
    WORLD.plan = makePlan(library); cam.L = WORLD.plan.L; cam.W = WORLD.plan.W;
    // 扉の行き先と絵（禁書庫の扉は専用の絵）
    const HS = library.halls || {};
    WORLD.plan.doors.forEach((d) => { const t = (H.doors || {})[d.side]; d.to = t === undefined ? null : t; d.part = d.to && HS[d.to] && HS[d.to].ageGate ? "forbidden_door" : "end_door"; });
    const hallBooks = DATA.books.books.filter((b) => !b.room && (b.hall || "main") === id);
    // float を書いた本は棚に入れず、館内に浮かべる（若草の本など）
    const shelfBooks = hallBooks.filter((b) => !b.float);
    const art = library.art || {};
    const useArt = (el, path, fit, gen) => { $(el).innerHTML = path ? `<img src="${esc(path)}" alt="" style="width:100%;height:100%;display:block;object-fit:${fit};object-position:50% 100%">` : gen; };
    const useParts = scene && scene.useParts && scene.parts;
    const m = midSVG(library, shelfBooks);
    const TH = H.theme || {};
    const built = useParts ? buildFromParts(themedParts(scene.parts, TH), library, { ...(scene.decor || {}), ...(TH.decor || {}), window: H.window || "window" }) : { mid: m.svg, back: backSVG(), front: frontSVG() };
    useArt("sky", TH.sky || art.sky, "cover", skySVG()); useArt("back", art.back, "cover", built.back); useArt("front", art.front, "cover", built.front); useArt("mid", art.mid, "fill", built.mid);
    $("midTop").innerHTML = built.midTop || "";
    $("backTop").querySelectorAll(".dyn").forEach((el) => el.remove()); BACKDYN.length = 0;
    (built.backDyn || []).forEach((d) => { const el = document.createElement("div"); el.className = "dyn " + d.cls; if (d.id) el.id = d.id; if (d.html) el.innerHTML = d.html; $("backTop").appendChild(el); BACKDYN.push({ el, ...d }); });
    if (useParts) { SHADE.opt = { ...((scene.decor && scene.decor.shade) || {}), ...(H.shade || {}) }; SHADE.holes = shadeHoles(); }
    placeBooks({ ...(useParts ? partSpots(library, shelfBooks, (TH.decor || {}).ladder !== false) : m.spots), ...floatSpots(hallBooks) });
    if (H.drips) $("midTop").insertAdjacentHTML("beforeend", hallDrips());
    placeDoors(); setupSmoke(); FX.due = true; cam.lastPx = NaN;
    scheduleWhisper(6000);
    // 窓から差す光の色
    RAYS.forEach((r, i) => { r.c = (H.rayColors && H.rayColors[i]) || RAY_BASE[i]; });
    MOON.said = !!MOON.saidHalls[id]; MOON.shown = -1; lastZone = null; jumpWait = 0;
    $("ticks").innerHTML = "";
    ZONES().forEach((z) => { if (z.from != null && z.from > cam.L) { const t = document.createElement("div"); t.className = "tick"; t.style.left = ((z.from - cam.L) / cam.W) * 100 + "%"; $("ticks").appendChild(t); } });
    document.querySelector(".map .moon").style.left = ((WIN.cx - cam.L) / cam.W) * 100 + "%";
    window.__torsaArt = { skySVG, backSVG, frontSVG, mid: () => m.svg, fxSVG, bubbleShape, coverHTML, EMOTE, books: DATA.books.books, partsSrc: () => partsSrc(library) };
    resize();
    return filesIn([built.mid, built.back, built.front, built.midTop, $("sky").innerHTML].join(" "));
  }
  // となりの棟の絵を、あいている時間に先に読んでおく（移ったときに待たなくていいように）
  function prefetchHall(id) {
    const H2 = (DATA.library.halls || {})[id]; if (!H2 || !SCENE || !SCENE.parts) return;
    const TH2 = H2.theme || {}, parts = themedParts(SCENE.parts, TH2), L2 = sceneLayout(DATA.library, { ...(SCENE.decor || {}), ...(TH2.decor || {}), window: H2.window || "window" });
    const list = [TH2.sky || (DATA.library.art || {}).sky]; [...L2.mid, ...L2.back, ...L2.front].forEach((e) => { if (e.part && parts[e.part]) list.push(parts[e.part].file); });
    list.forEach((f) => preloadOne(f));
  }
  const idle = (fn) => (window.requestIdleCallback ? requestIdleCallback(fn, { timeout: 4000 }) : setTimeout(fn, 1500));
  function prefetchNeighbors() { idle(() => Object.values(HALL().doors || {}).forEach((to) => { if (to && (DATA.library.halls || {})[to]) prefetchHall(to); })); }
  // 別の棟へ：暗転して組み立て直し、来た扉の前に立つ（東の書館は右へ、西の書館は左へ進む）
  let VAULT_EVENT_SAID = false; // 禁書庫のできごとは、ページを開くたびに一度だけ
  // HALL_MOVING：棟や部屋を移っている最中（この時刻まで）。そのあいだはカネルのイベントを起こさない
  var HALL_MOVING = 0;
  function enterHall(id, atWindow) {
    HALL_MOVING = performance.now() + 3500;
    const from = HALL_ID;
    curtain(() => {
      const files = buildHall(id);
      const d = WORLD.plan.doors.find((x) => x.to === from) || WORLD.plan.doors[0];
      // 来た扉が画面の中に見えるように（西の扉は画面の左寄り、東の扉はトルサに隠れないよう、まんなか寄り）
      cam.x = cam.target = atWindow ? WIN.cx : d.x + (d.side === "west" ? .2 : .08) * cam.viewU; cam.dir = 0; clampCam(); cam.lastPx = NaN; render(); // 転送（atWindow）のときは、その棟の窓の前
      $("zone").style.opacity = 0;
      const fromVault = !!(((DATA.library.halls || {})[from] || {}).vault);
      // 絵が読み込まれるまで暗転したまま待つ。終わったら、となりの棟の絵を先に読んでおく
      return waitFiles(files).then(() => {
        prefetchNeighbors(); setTimeout(() => torsa(fromVault ? "backFromForbidden" : HALL().enterLine || (id === "main" ? "enterMain" : "enterLibrary")), 700);
        // イベント（event/events.json の trigger.hall がこの棟なら、少したってから起こる）
        if (EVENTS) EVENTS.onHall(id);
        // カネルのイベントのあと：本館の西のはしに、赤い月の間への廊下が出る
        if (KANERU) KANERU.onHall(id);
        if (SHEEP) SHEEP.onHall(id); // 本館の東のはし：羊の間への廊下
        // 好感度が高いと、禁書庫でできごとが起こる（セリフは torsa.json の vaultLines に、affinity.vaultEvent.key の名前で足す）
        const ev = AFF().vaultEvent;
        if (HALL().vault && ev && affinity() >= (ev.min ?? 100)) {
          dispatchEvent(new CustomEvent("torsa:vault-affinity", { detail: { affinity: affinity() } }));
          if (!VAULT_EVENT_SAID && (LINES()[ev.key] || []).length) { VAULT_EVENT_SAID = true; setTimeout(() => { if (HALL().vault && !overlayBusy()) torsa(ev.key); }, 4200); }
        }
      });
    });
  }
  window.__hall = (id) => enterHall(id);
  window.__face = (f) => setFace(f, 0); // 確認用：表情を切りかえる

  /* ---------- パレット（右上）：蔵書目録・設定・転送・思い出 ---------- */
  // 転送の行き先：library.json の halls と、rooms.json の部屋（図書館の間・羊の間）。並びは WARP_ORDER。色は点の色
  const WARP_ORDER = ["main", "sheep", "east", "annex", "donate", "west", "vault"];
  const WARP_DOT = { sheep: "#f0d9a8", main: "#8fb6ff", east: "#e0a26a", annex: "#7fd6a0", west: "#c7c9ff", vault: "#e0607a", redmoon: "#ff3a52", donate: "#f2c97a" };
  // 部屋の行き先の下に出る小さな文字（rooms.json の warpSub があれば、そちらを使う）
  const WARP_SUB = { annex: "東の書館の奥", sheep: "本館の東のはし", donate: "本をつくって寄贈する（別のタブで開きます）" };
  function openPalette(open) {
    $("palette").hidden = !open; $("paletteBtn").setAttribute("aria-expanded", String(open));
    if (!open) { $("warpList").hidden = true; $("memList").hidden = true; $("warpBtn").setAttribute("aria-expanded", "false"); $("memBtn").setAttribute("aria-expanded", "false"); }
  }
  const whereNow = () => (ROOM.cur ? ROOM.cur : HALL_ID);
  function buildWarp() {
    const halls = DATA.library.halls || {}, rooms = (DATA.rooms && DATA.rooms.rooms) || {};
    const donateOn = !(rooms.annex && rooms.annex.donateDoor && rooms.annex.donateDoor.enabled === false);
    const ids = [...WARP_ORDER.filter((id) => halls[id] || rooms[id] || (id === "donate" && donateOn)), ...Object.keys(halls).filter((id) => !WARP_ORDER.includes(id)), ...(KANERU ? KANERU.warpIds() : [])];
    $("warpItems").innerHTML = ids.map((id) => {
      const h = halls[id], here = whereNow() === id;
      const sub = h ? (h.vault ? (h.windowName || "") + "の前（地下・年齢確認あり）" : h.windowName ? h.windowName + "の前" : "") : (rooms[id] && rooms[id].warpSub) || WARP_SUB[id] || "";
      return `<button class="warp-item" data-to="${esc(id)}" style="--dot:${WARP_DOT[id] || "#d6b062"}" ${here ? "disabled" : ""}><i></i><span>${esc(id === "donate" ? "寄贈の間" : placeName(id))}<br><small>${esc(sub)}</small></span>${here ? '<span class="here">いまここ</span>' : ""}</button>`;
    }).join("");
  }
  function warp(to) {
    openPalette(false);
    if (to === "donate") { if (!overlayBusy()) openDonate($("paletteBtn")); return; } // 寄贈の間（donate.html）は別のタブで開く
    if (overlayBusy() || to === whereNow()) return;
    if (document.body.classList.contains("gazing") && window.__gaze) window.__gaze(false);
    cam.dir = 0;
    const halls = DATA.library.halls || {}, h = halls[to];
    const go = () => {
      if (!h) { enterRoom(to, $("paletteBtn")); return; }                       // 図書館の間・羊の間などの部屋
      if (h.ageGate && !ageOK()) { openAgeGate($("paletteBtn"), to, true); return; }   // 禁書庫は年齢確認から
      enterHall(to, true); // 窓の前に転送
    };
    HALL_MOVING = performance.now() + 4500;
    torsa("warp"); SFX.play("appear");
    if (ROOM.cur) {
      // 部屋の中からは、いったん部屋を出てから転送する
      if (h && to === HALL_ID) { leaveRoom(true, true); return; }
      leaveRoom(true); setTimeout(go, 1100); return;
    }
    setTimeout(go, 700);
  }
  // 思い出：一度見たイベントを、何度でも見返せる（event/events.json の events）
  function buildMem() {
    const seen = mem.events || {}, list = (EVENTS ? EVENTS.list() : []).concat(KANERU ? KANERU.list().map((e) => ({ ...e, kn: true })) : []);
    const items = list.filter((e) => seen[e.id]);
    $("memItems").innerHTML = items.length
      ? items.map((e) => `<button class="warp-item" data-ev="${esc(e.id)}"${e.kn ? " data-kn" : ""} style="--dot:${WARP_DOT[e.hall] || "#d6b062"}"><i></i><span>${esc(e.name)}<br><small>${esc(placeName(e.hall) || "")}</small></span><span class="here">もう一度</span></button>`).join("")
      : `<p class="warp-empty">まだ思い出はありません。館内を歩いていると、なにかが起こるかも……？</p>`;
  }
  $("paletteBtn").addEventListener("click", (e) => { e.stopPropagation(); if (!DATA) return; openSettings(false); openPalette($("palette").hidden); });
  $("catalogBtn").addEventListener("click", () => openPalette(false));
  $("setBtn").addEventListener("click", () => openPalette(false));
  $("warpBtn").addEventListener("click", () => {
    const open = $("warpList").hidden; $("memList").hidden = true; $("memBtn").setAttribute("aria-expanded", "false");
    if (open) buildWarp(); $("warpList").hidden = !open; $("warpBtn").setAttribute("aria-expanded", String(open));
    if (open) { const f = $("warpItems").querySelector("button:not(:disabled)"); if (f) f.focus(); }
  });
  $("memBtn").addEventListener("click", () => {
    const open = $("memList").hidden; $("warpList").hidden = true; $("warpBtn").setAttribute("aria-expanded", "false");
    if (open) buildMem(); $("memList").hidden = !open; $("memBtn").setAttribute("aria-expanded", String(open));
  });
  $("warpItems").addEventListener("click", (e) => { const b = e.target.closest(".warp-item"); if (b && !b.disabled) warp(b.dataset.to); });
  $("memItems").addEventListener("click", (e) => { const b = e.target.closest(".warp-item"); if (!b) return; if (b.hasAttribute("data-kn") && KANERU) { openPalette(false); cam.dir = 0; KANERU.play(b.dataset.ev, { replay: true }); return; } if (EVENTS) { openPalette(false); cam.dir = 0; EVENTS.play(b.dataset.ev, { replay: true }); } });
  addEventListener("pointerdown", (e) => { if (!$("palette").hidden && !e.target.closest("#palette, #paletteBtn")) openPalette(false); });
  addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("palette").hidden) { e.preventDefault(); openPalette(false); $("paletteBtn").focus(); } });

  /* ---------- データ読み込み ---------- */
  const optional = fetch("data/scene.json").then((r) => (r.ok ? r.json() : null)).catch(() => null);
  const roomsP = fetch("data/rooms.json").then((r) => (r.ok ? r.json() : null)).catch(() => null);
  fetch("data/sfx.json").then((r) => (r.ok ? r.json() : null)).then((c) => { SFX.config(c); setSfxButton(); }).catch(() => setSfxButton());
  // 寄贈された本（book_data フォルダ。js/book-gifts.js）。読めなくても図書館は開く
  const giftsP = window.TorsaGifts ? window.TorsaGifts.load(COVER_PARTS && COVER_PARTS.PARTS).catch((e) => { console.warn("寄贈本を読めませんでした", e); return []; }) : Promise.resolve([]);
  Promise.all(["library", "books", "works", "torsa", "bgm"].map((n) => fetch(`data/${n}.json`).then((r) => { if (!r.ok) throw new Error(n); return r.json(); })).concat(optional, roomsP, (window.TorsaTouchSpecial && window.TorsaTouchSpecial.ready) || null, giftsP))
    .then(([library, books, works, torsaD, bgm, scene, rooms, , gifts]) => {
      if (window.TorsaTouchSpecial && window.TorsaTouchSpecial.addLines) window.TorsaTouchSpecial.addLines(torsaD); // 胸・腰のセリフ（event/touch-specialness.json）
      DATA = { library, books, works, torsa: torsaD, rooms: rooms || { doors: {}, rooms: {} } };
      if (gifts && gifts.length) { try { window.TorsaGifts.merge(DATA, gifts); } catch (e) { console.warn("寄贈本を書架に入れられませんでした", e); } }
      BGM.setConfig(bgm);
      if (KANERU) KANERU.ready.then(() => Object.assign(DATA.rooms.rooms ||= {}, KANERU.rooms()));
      // 表情の画像（assets/torsa/*.png）は、部品で動かすトルサ（rig）が使えないときだけ読む（軽くするため）
      const useImages = () => {
        if (torsaD.faces) { Object.values(torsaD.faces).forEach((src) => { const im = new Image(); im.src = src; }); $("torsaImg").src = torsaD.faces.normal || torsaD.image; }
        else if (torsaD.image) $("torsaImg").src = torsaD.image;
      };
      // 部品で動かすトルサ（rig）。読めなければ、今までどおり画像を使う
      var rigReady = !torsaD.rig ? (useImages(), Promise.resolve()) : RIG.load(torsaD.rig, $("torsaCanvas")).then((rig) => {
        $("torsaImg").hidden = true; $("torsaCanvas").hidden = false;
        TORSA.placeZones(rig);
      }).catch((e) => { console.warn("トルサの部品データを読めなかったので、画像で表示します", e); useImages(); });
      SCENE = scene;
      const firstFiles = buildHall("main");
      if (KANERU) KANERU.onHall("main"); // カネルの廊下（本館の西のはし。イベントのあとだけ）
      if (SHEEP) SHEEP.onHall("main"); // 羊の間への廊下（本館の東のはし）
      cam.x = cam.target = (library.world && library.world.startX) ?? WIN.cx;
      setupRays(); MOON.ready = true; initFX(library);
      if (/[?&]covers\b/.test(location.search)) showCoverGallery();
      addEventListener("resize", resize);
      mem.visits++; save(); like("visit");
      $("visitNo").textContent = mem.visits === 1 ? "はじめて" : `${mem.visits} 回目`;
      $("bookCount").textContent = `${books.books.filter((b) => !gatedPlace(roomOf(b))).length} 冊（ほか眠っている本）`;
      Promise.all([waitFiles(firstFiles), Promise.race([rigReady, new Promise((r) => setTimeout(r, 8000))])]).then(() => { $("enterBtn").disabled = false; $("status").textContent = (window.__initErrors || []).length ? "入館はできますが、一部が動いていません。" + window.__initErrors.join(" / ") : ""; prefetchNeighbors(); });

      requestAnimationFrame(loop);
    })
    .catch((err) => {
      console.error(err);
      $("status").textContent = "data フォルダを読み込めませんでした。パソコンで直接開いた場合は、README の手順でローカルサーバーから開いてください。";
    });
})();
