<meta charset="utf-8">
<title>トルサ図書館</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kaisei+Decol:wght@500;700&family=Shippori+Mincho:wght@500;600&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
/* 横に歩ける魔法の図書館。星空の天井（遠景）→ 月のステンドグラスの壁 → 本棚と柱 → 手前の植物、の4層を視差で重ねる。トルサは右側に付き添う。 */
:root {
  --night: #0d1230;
  --night-2: #1a2152;
  --wall: #222859;
  --wood: #a27752;
  --wood-dark: #6c4a33;
  --wood-light: #c99c71;
  --carpet: #1d2b60;
  --gold: #d6b062;
  --lamp: #f3d08a;
  --leaf: #5f8f55;
  --ink: #f2ecdc;
  --ink-soft: #bdbbdc;
  --paper: #f5f0e3;
  --paper-ink: #2b2a3a;
  --paper-soft: #7a7486;
  --font-display: "Kaisei Decol", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --font-ui: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
  --font-read: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--night);
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: 15px;
  line-height: 1.7;
  overflow: hidden;
  -webkit-user-select: none; user-select: none;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--lamp); outline-offset: 3px; }

.btn {
  border: 1px solid rgba(214, 176, 98, .6);
  background: rgba(13, 18, 48, .55);
  border-radius: 999px;
  padding: .55em 1.3em;
  letter-spacing: .08em;
  transition: background .2s, transform .2s;
  
}
.btn:hover { background: rgba(214, 176, 98, .22); }
.btn.primary { background: var(--lamp); color: #2a2032; border-color: var(--lamp); font-weight: 700; }
.btn.primary:hover { transform: translateY(-1px); background: #f8dca2; }
.btn.small { padding: .3em .95em; font-size: 13px; }
.btn.quiet { border-color: rgba(189, 187, 220, .45); color: var(--ink-soft); }

/* ---------- 館内（シーン） ---------- */
#hall { position: fixed; inset: 0; overflow: hidden; touch-action: pan-y; cursor: grab; background: var(--night); }
#hall.dragging { cursor: grabbing; }
.layer { position: absolute; left: 0; top: 0; height: 100%; will-change: transform; }
.layer > svg { display: block; width: 100%; height: 100%; }
#sceneWrap { position: absolute; inset: 0; transform-origin: 50% 60%; transition: transform 2.2s cubic-bezier(.2,.7,.2,1); }
body.at-door #sceneWrap { transform: scale(1.07); }
#sceneWrap::after { content: ""; position: absolute; inset: 0; background: rgba(4, 5, 18, .45); opacity: 0; transition: opacity 1.4s ease; pointer-events: none; }
body.at-door #sceneWrap::after { opacity: 1; }
#handLight { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse 34% 46% at 46% 62%, rgba(255, 210, 140, .10), rgba(255, 210, 140, 0) 70%); animation: handFlick 3.4s ease-in-out infinite; will-change: opacity; }
#shadeWrap { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
@keyframes handFlick { 0%, 100% { opacity: .85; } 30% { opacity: 1; } 55% { opacity: .78; } 75% { opacity: .95; } }
#rays { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; mix-blend-mode: screen; opacity: 0; }
#rays .ray { animation: shimmer 6s ease-in-out infinite; }
@keyframes shimmer { 0%, 100% { opacity: .75; } 40% { opacity: 1; } 70% { opacity: .55; } }
.moon-halo { animation: halo 7s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes halo { 50% { opacity: .55; transform: scale(1.08); } }
.fbook { animation: fbook 7s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes fbook { 0%, 100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-16px) rotate(3deg); } }
.fb-page { animation: flip 5.5s ease-in-out infinite; transform-box: fill-box; transform-origin: 0% 50%; }
@keyframes flip { 0%, 55% { transform: scaleX(1); } 75%, 100% { transform: scaleX(-1); } }
#vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse 34% 46% at 46% 62%, rgba(255, 210, 140, .10), rgba(255, 210, 140, 0) 70%), linear-gradient(90deg, rgba(3, 4, 15, .62) 0%, rgba(3, 4, 15, 0) 24%, rgba(3, 4, 15, 0) 76%, rgba(3, 4, 15, .55) 100%), radial-gradient(ellipse 80% 75% at 50% 45%, transparent 55%, rgba(4, 5, 18, .6)); }
#front { opacity: .92; pointer-events: none; }

/* 手に取れる本 */
.live {
  position: absolute;
  border: 0; padding: 0;
  background: var(--c);
  border-radius: 2px 2px 0 0;
  box-shadow: inset -3px 0 0 rgba(0,0,0,.25), inset 2px 0 0 rgba(255,255,255,.12), 0 0 12px 2px rgba(243, 208, 138, .35);
  transition: transform .25s, box-shadow .25s;
  animation: glow 3.4s ease-in-out infinite;
}
.live::before, .live::after { content: ""; position: absolute; left: 3px; right: 3px; height: 3px; background: var(--a); opacity: .8; }
.live::before { top: 10%; } .live::after { bottom: 10%; }
.live { background-image: linear-gradient(90deg, rgba(0,0,0,.35), rgba(255,255,255,.14) 30%, rgba(255,255,255,0) 55%, rgba(0,0,0,.4)); }
.live[data-tpl="grimoire"]::before, .live[data-tpl="grimoire"]::after { height: 7%; left: 0; right: 0; opacity: 1; background: linear-gradient(90deg, #6a5030, var(--a) 40%, #6a5030); }
.live[data-tpl="starchart"]::before { height: 4px; border-radius: 50%; left: 35%; right: 35%; top: 30%; }
.live[data-tpl="botanical"]::before, .live[data-tpl="botanical"]::after { height: 2px; }
.live[data-tpl="simple"]::before { top: 16%; height: 8%; } .live[data-tpl="simple"]::after { bottom: 16%; height: 8%; }
.live:hover, .live:focus-visible { transform: translateY(-10%); box-shadow: inset -3px 0 0 rgba(0,0,0,.25), 0 0 18px 5px rgba(243, 208, 138, .7); animation: none; }
.live.restless { animation: glow 3.4s ease-in-out infinite, restless 2.2s ease-in-out infinite; }
.live.gone { visibility: hidden; }
@keyframes glow { 50% { box-shadow: inset -3px 0 0 rgba(0,0,0,.25), 0 0 16px 4px rgba(243, 208, 138, .6); } }
@keyframes restless { 0%, 68%, 100% { transform: none; } 74% { transform: translateY(-8%) rotate(-3deg); } 80% { transform: rotate(2deg); } 86% { transform: translateY(-4%); } }
.slot-back { position: absolute; background: linear-gradient(180deg, #1c130d, #33241b); pointer-events: none; }
.shelf-emote {
  position: absolute;
  transform: translate(-50%, -100%);
  background: var(--paper);
  color: var(--paper-ink);
  border-radius: 999px;
  padding: 0 .6em;
  font-size: clamp(10px, 1.5vh, 14px);
  font-weight: 700;
  line-height: 1.6;
  white-space: nowrap;
  pointer-events: none;
  animation: hover-bob 2.8s ease-in-out infinite;
  box-shadow: 0 2px 8px rgba(0,0,0,.35);
}
.shelf-emote::after { content: ""; position: absolute; left: 50%; bottom: -4px; width: 7px; height: 7px; background: var(--paper); transform: translateX(-50%) rotate(45deg); }
@keyframes hover-bob { 50% { transform: translate(-50%, calc(-100% - 5px)); } }

/* SVG内の動き */
.tw { animation: twinkle 3s ease-in-out infinite; }
@keyframes twinkle { 50% { opacity: .25; } }
.drift { animation: drift-y 9s ease-in-out infinite; }
.drift.slow { animation-duration: 14s; }
@keyframes drift-y { 50% { transform: translateY(-14px); } }
.float { animation: drift-y 5s ease-in-out infinite; }
.flick { animation: flick 2.6s ease-in-out infinite; }
@keyframes flick { 30% { opacity: .78; } 60% { opacity: 1; } 80% { opacity: .85; } }

/* 光の粒 */
#motes { position: absolute; inset: 0; pointer-events: none; }
#motes i { position: absolute; width: 3px; height: 3px; border-radius: 50%; background: var(--lamp); box-shadow: 0 0 6px 1px rgba(243, 208, 138, .7); opacity: 0; animation: rise linear infinite; }
#motes i.m { background: #cfe7b6; box-shadow: 0 0 6px 1px rgba(207, 231, 182, .6); }
@keyframes rise { 0% { transform: translate(0,0); opacity: 0; } 15% { opacity: .8; } 80% { opacity: .5; } 100% { transform: translate(24px,-220px); opacity: 0; } }

/* ---------- UI ---------- */
.topbar {
  position: fixed; left: 0; right: 0; top: 0;
  z-index: 12;
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: calc(12px + env(safe-area-inset-top, 0px)) clamp(16px, 3vw, 32px) 26px;
  background: linear-gradient(180deg, rgba(10, 13, 34, .75), transparent);
  transition: opacity .8s;
}
.topbar .name { font-family: var(--font-display); font-size: 20px; letter-spacing: .14em; margin-right: auto; text-shadow: 0 2px 10px rgba(0,0,0,.6); }
.zone {
  position: fixed; left: 50%; top: calc(64px + env(safe-area-inset-top, 0px));
  transform: translateX(-50%);
  z-index: 11;
  font-family: var(--font-display);
  letter-spacing: .4em;
  font-size: 15px;
  padding-left: .4em;
  color: var(--lamp);
  text-shadow: 0 2px 10px rgba(0,0,0,.8);
  white-space: nowrap;
  transition: opacity .6s;
  pointer-events: none;
}
.zone::before, .zone::after { content: "✦"; font-size: 10px; margin: 0 .8em; opacity: .7; vertical-align: middle; }
.walkbar {
  position: fixed; left: clamp(16px, 3vw, 32px); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  z-index: 15;
  display: flex; flex-direction: column; gap: 6px;
  transition: opacity .8s;
}
.walk-row { display: flex; align-items: center; gap: 10px; }
.walk-btn { width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(214, 176, 98, .6); background: rgba(13, 18, 48, .6); font-size: 16px; display: grid; place-items: center;  }
.walk-btn:active { background: rgba(214, 176, 98, .3); }
.map { position: relative; width: clamp(110px, 18vw, 180px); height: 18px; }
.map .track { position: absolute; left: 0; right: 0; top: 8px; height: 2px; background: rgba(189, 187, 220, .35); border-radius: 2px; }
.map .tick { position: absolute; top: 4px; width: 1px; height: 10px; background: rgba(189, 187, 220, .5); }
.map .moon { position: absolute; top: 2px; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; box-shadow: inset -4px -2px 0 0 #e9d9a0; left: 50%; opacity: .7; }
.map .me { position: absolute; top: 3px; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; background: var(--lamp); box-shadow: 0 0 8px 2px rgba(243, 208, 138, .6); }
.walk-hint { font-size: 11px; color: var(--ink-soft); letter-spacing: .06em; text-shadow: 0 1px 6px rgba(0,0,0,.8); }
body.at-door .topbar, body.at-door .walkbar, body.at-door .zone { opacity: 0; pointer-events: none; }

/* トルサ（右側） */
.torsa {
  position: fixed;
  right: clamp(0px, 2vw, 32px);
  bottom: 0;
  z-index: 14;
  height: min(64vh, 580px);
  display: flex; align-items: flex-end;
  pointer-events: none;
}
.torsa button { pointer-events: auto; border: 0; background: none; padding: 0; height: 100%; display: flex; align-items: flex-end; }
.torsa img { height: 100%; width: auto; filter: drop-shadow(0 10px 26px rgba(0,0,0,.55)); animation: breathe 5s ease-in-out infinite; transform-origin: 50% 100%; }
@keyframes breathe { 50% { transform: scaleY(1.008); } }
.bubble {
  position: absolute;
  right: 62%;
  top: 6%;
  width: max-content;
  max-width: min(17em, 60vw);
  background: var(--paper);
  color: var(--paper-ink);
  border-radius: 16px;
  padding: 10px 14px;
  font-size: 14px;
  line-height: 1.6;
  box-shadow: 0 6px 20px rgba(0,0,0,.35);
  opacity: 0;
  transform: translateY(6px);
  transition: opacity .35s, transform .35s;
}
.bubble.show { opacity: 1; transform: none; }
.bubble::after { content: ""; position: absolute; right: -6px; top: 22px; width: 13px; height: 13px; background: var(--paper); transform: rotate(45deg); }
.bubble .who { display: block; font-size: 11px; letter-spacing: .14em; color: #5c7a4c; font-weight: 700; }

/* 入口 */
#entrance {
  position: fixed; inset: 0;
  z-index: 13;
  display: flex; align-items: center;
  padding-inline: clamp(16px, 6vw, 88px);
  background: linear-gradient(90deg, rgba(9, 12, 32, .82) 0%, rgba(9, 12, 32, .5) 45%, transparent 70%);
  transition: opacity 1.2s ease;
}
#entrance.leaving { opacity: 0; pointer-events: none; }
.door { display: flex; gap: clamp(20px, 4vw, 48px); align-items: flex-start; max-width: 100%; }
.door h1 {
  writing-mode: vertical-rl;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(46px, 7.4vw, 92px);
  letter-spacing: .18em;
  line-height: 1.1;
  margin: 0;
  text-shadow: 0 0 30px rgba(243, 208, 138, .35), 0 4px 18px rgba(0,0,0,.6);
}
.door-body { display: flex; flex-direction: column; gap: 18px; padding-top: .6em; min-width: 0; }
.door-body .lead { margin: 0; color: var(--ink); max-width: 21em; text-shadow: 0 2px 10px rgba(0,0,0,.7); }
.card {
  border: 1px solid rgba(242, 236, 220, .28);
  background: rgba(13, 18, 48, .55);
  border-radius: 4px;
  padding: 10px 14px;
  font-size: 13px;
  color: var(--ink-soft);
  max-width: 19em;
  display: grid; grid-template-columns: auto 1fr; column-gap: 14px; row-gap: 2px;
  font-variant-numeric: tabular-nums;
}
.card .k { letter-spacing: .12em; }
.card .v { color: var(--ink); }
.door-actions { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.toggle { display: inline-flex; align-items: center; gap: 8px; color: var(--ink-soft); font-size: 13px; cursor: pointer; }
.toggle input { accent-color: var(--lamp); width: 16px; height: 16px; }
.status { font-size: 13px; color: var(--ink-soft); min-height: 1.6em; margin: 0; max-width: 24em; }

/* ---------- 本との対話 ---------- */
.overlay {
  position: fixed; inset: 0;
  z-index: 20;
  background: radial-gradient(ellipse at 40% 50%, rgba(13, 18, 48, .55), rgba(6, 8, 22, .82));
  
  display: grid; place-items: center;
  padding: 16px;
  padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  animation: fadein .25s ease;
}
@keyframes fadein { from { opacity: 0; } }
.talk-wrap {
  width: min(100%, 860px);
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  gap: clamp(28px, 5vw, 64px);
  align-items: center;
}
.book-box { position: relative; width: clamp(150px, 22vw, 230px); aspect-ratio: 3 / 4; }
.book-body { position: absolute; inset: 0; transform-origin: 50% 90%; }
.cover { position: absolute; inset: 0; border-radius: 4px 8px 8px 4px; overflow: hidden; box-shadow: 0 18px 40px rgba(0,0,0,.55), -6px 0 0 rgba(0,0,0,.25) inset; transition: box-shadow .3s; }
.cover img, .cover svg { width: 100%; height: 100%; object-fit: cover; display: block; }
.book-body.is-shy .cover { box-shadow: 0 0 30px 8px rgba(255, 143, 171, .45), 0 18px 40px rgba(0,0,0,.5); }
.book-body.is-angry .cover { box-shadow: 0 0 30px 8px rgba(224, 71, 76, .4), 0 18px 40px rgba(0,0,0,.5); }
.book-body.is-sad .cover, .book-body.is-sleepy .cover { filter: brightness(.8) saturate(.8); }
.emote { position: absolute; inset: -17.5% -23.3%; pointer-events: none; overflow: visible; }
.emote svg { width: 100%; height: 100%; overflow: visible; }

.m-hop { animation: hop .6s ease; }
.m-bounce { animation: bounce .7s ease-in-out infinite; }
.m-shake { animation: shake .45s ease; }
.m-tilt { animation: tilt .5s ease forwards; }
.m-shy { animation: shy .6s ease forwards; }
.m-droop { animation: droop .8s ease forwards; }
.m-sway { animation: sway 2.4s ease-in-out infinite; }
.m-wobble { animation: wobble .9s ease-in-out infinite; }
.m-float { animation: drift-y 3.2s ease-in-out infinite; }
@keyframes hop { 40% { transform: translateY(-26px) rotate(-4deg); } 70% { transform: translateY(2px); } }
@keyframes bounce { 50% { transform: translateY(-16px) rotate(2deg); } }
@keyframes shake { 20% { transform: translateX(-10px) rotate(-3deg); } 40% { transform: translateX(9px) rotate(2deg); } 60% { transform: translateX(-6px); } 80% { transform: translateX(3px); } }
@keyframes tilt { to { transform: rotate(-6deg) translateY(-4px); } }
@keyframes shy { 30% { transform: rotate(5deg) translateX(6px); } to { transform: rotate(7deg) translateX(10px) scale(.96); } }
@keyframes droop { to { transform: rotate(4deg) translateY(10px); } }
@keyframes sway { 25% { transform: rotate(-3deg); } 75% { transform: rotate(3deg); } }
@keyframes wobble { 25% { transform: rotate(-1.5deg) translateX(-2px); } 75% { transform: rotate(1.5deg) translateX(2px); } }

.fx-rise > * { animation: fx-rise 2.4s ease-out infinite; }
.fx-rise > *:nth-child(2) { animation-delay: .8s; } .fx-rise > *:nth-child(3) { animation-delay: 1.6s; }
@keyframes fx-rise { 0% { transform: translateY(14px); opacity: 0; } 25% { opacity: 1; } 100% { transform: translateY(-34px); opacity: 0; } }
.fx-drip { animation: fx-drip 1.8s ease-in infinite; }
@keyframes fx-drip { 0% { transform: translateY(-6px); opacity: 0; } 20% { opacity: 1; } 100% { transform: translateY(18px); opacity: 0; } }
.fx-pulse { animation: fx-pulse .9s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes fx-pulse { 50% { transform: scale(1.18); } }
.fx-pop { animation: fx-pop .5s cubic-bezier(.3,1.6,.5,1) both; transform-box: fill-box; transform-origin: center; }
@keyframes fx-pop { from { transform: scale(0); opacity: 0; } }
.fx-twinkle > * { animation: twinkle 1.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
.fx-twinkle > *:nth-child(2) { animation-delay: .5s; } .fx-twinkle > *:nth-child(3) { animation-delay: 1s; }

.say-col { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.speaker { font-size: 12px; letter-spacing: .18em; color: var(--lamp); font-weight: 700; padding-left: 8px; }
.say {
  --say-bg: #f7f2e5; --say-line: #c9a35a;
  position: relative;
  color: var(--paper-ink);
  min-height: 7.5em;
  display: flex; flex-direction: column; justify-content: center;
  cursor: pointer;
  filter: drop-shadow(0 10px 22px rgba(0,0,0,.4));
}
.say .shape { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.say .shape path { fill: var(--say-bg); stroke: var(--say-line); stroke-width: 2.5; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
.say .line { position: relative; margin: 0; font-size: 18px; line-height: 1.75; }
.say .next { position: absolute; right: 9%; bottom: 10%; font-size: 12px; color: var(--paper-soft); animation: blink 1.2s steps(2) infinite; }
@keyframes blink { 50% { opacity: .2; } }
.say .tail { position: absolute; left: 2px; top: 50%; width: 22px; height: 22px; margin: -11px 0 0 -18px; overflow: visible; }
.say .tail path, .say .tail circle { fill: var(--say-bg); stroke: var(--say-line); stroke-width: 2.5; }
.say:not(.round) .tail { left: 6%; }
.say.round { padding: 22px 30px; }
.say.spiky { padding: 40px 56px; }
.say.cloud { padding: 36px 50px; }
.say.wavy { padding: 30px 42px; }
.say.angry { --say-bg: #fff0ea; --say-line: #d0504e; }
.say.angry .line { font-weight: 700; }
.say.shy { --say-bg: #fff1f4; --say-line: #e897ae; }
.say.shy .line { font-size: 16px; }
.say.sad { --say-bg: #e8ebf5; --say-line: #7482b4; }
.say.cloud { --say-bg: #f2efe8; --say-line: #aaa7c4; }
.say.cloud .line { color: #57536b; }
.say.surprise .line, .say.excited .line { font-size: 20px; font-weight: 700; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-end; min-height: 40px; }

/* ---------- 目録 ---------- */
.panel {
  width: min(100%, 560px);
  max-height: 100%;
  overflow: auto;
  background: var(--paper);
  color: var(--paper-ink);
  border-radius: 6px;
  padding: 22px clamp(16px, 4vw, 30px);
  box-shadow: 0 20px 50px rgba(0,0,0,.5);
  -webkit-user-select: text; user-select: text;
}
.panel h2 { font-family: var(--font-display); font-size: 22px; letter-spacing: .14em; margin: 0 0 4px; }
.panel .sub { margin: 0 0 16px; font-size: 13px; color: var(--paper-soft); }
.cat-list { list-style: none; margin: 0; padding: 0; }
.cat-list .thumb { width: 42px; aspect-ratio: 3 / 4; border-radius: 2px 4px 4px 2px; overflow: hidden; box-shadow: 0 3px 8px rgba(0,0,0,.3); display: block; }
.cat-list .thumb svg, .cat-list .thumb img { width: 100%; height: 100%; display: block; object-fit: cover; }
.cat-list li { display: grid; grid-template-columns: 42px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px dashed rgba(43, 42, 58, .25); }
.cat-list .no { font-family: var(--font-display); color: var(--paper-soft); font-variant-numeric: tabular-nums; font-size: 13px; }
.cat-list .t { font-family: var(--font-read); font-weight: 600; font-size: 16px; }
.cat-list .m { font-size: 12px; color: var(--paper-soft); }

</section>

<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const rng = (seed) => () => { seed |= 0; seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  const f1 = (n) => Math.round(n * 10) / 10;

  /* ---------- 来館記録 ---------- */
  const KEY = "torsa-library-v1";
  let mem = { visits: 0, books: {} };
  try { const raw = localStorage.getItem(KEY); if (raw) mem = Object.assign(mem, JSON.parse(raw)); } catch (e) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(mem)); } catch (e) {} };
  const bookMem = (id) => (mem.books[id] ||= { met: 0, refused: 0, accepted: false, read: 0 });
  let DATA = null;

  /* ====================================================
     描画：星空・奥の壁・本棚・手前の植物
     ==================================================== */
  const C = { wood: "#a27752", woodD: "#6c4a33", woodL: "#c99c71", shelfBack: "#3b2a21", gold: "#d6b062", carpet: "#1d2b60", lead: "#151633" };
  const star4 = (x, y, r) => `M${f1(x)} ${f1(y - r)}Q${f1(x)} ${f1(y)} ${f1(x + r)} ${f1(y)}Q${f1(x)} ${f1(y)} ${f1(x)} ${f1(y + r)}Q${f1(x)} ${f1(y)} ${f1(x - r)} ${f1(y)}Q${f1(x)} ${f1(y)} ${f1(x)} ${f1(y - r)}Z`;

  function skySVG() {
    const r = rng(7); let s = "";
    s += `<defs><linearGradient id="skyG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#090d26"/><stop offset=".6" stop-color="#18205a"/><stop offset="1" stop-color="#2a2b6e"/></linearGradient>
      <radialGradient id="neb1"><stop offset="0" stop-color="#7a5bc0" stop-opacity=".35"/><stop offset="1" stop-color="#7a5bc0" stop-opacity="0"/></radialGradient>
      <radialGradient id="neb2"><stop offset="0" stop-color="#3f8fb0" stop-opacity=".28"/><stop offset="1" stop-color="#3f8fb0" stop-opacity="0"/></radialGradient>
      <radialGradient id="planetA" cx=".35" cy=".35"><stop offset="0" stop-color="#e6c9f0"/><stop offset="1" stop-color="#6e4f9e"/></radialGradient>
      <radialGradient id="planetB" cx=".35" cy=".35"><stop offset="0" stop-color="#bff0e4"/><stop offset="1" stop-color="#2f7c86"/></radialGradient>
      <linearGradient id="comet" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff6d8" stop-opacity=".9"/></linearGradient></defs>
      <rect width="2400" height="1000" fill="url(#skyG)"/>
      <ellipse cx="700" cy="260" rx="520" ry="200" fill="url(#neb1)"/><ellipse cx="1750" cy="200" rx="480" ry="180" fill="url(#neb2)"/>`;
    for (let i = 0; i < 260; i++) {
      const x = r() * 2400, y = r() * 700, rad = r() < .9 ? .8 + r() * 1.4 : 2.2 + r() * 1.2;
      s += `<circle cx="${f1(x)}" cy="${f1(y)}" r="${f1(rad)}" fill="#fff8e6"${r() < .35 ? ` class="tw" style="animation-delay:${f1(-r() * 3)}s"` : ` opacity="${f1(.4 + r() * .6)}"`}/>`;
    }
    for (let i = 0; i < 9; i++) { const x = r() * 2400, y = r() * 520; s += `<path d="${star4(x, y, 7 + r() * 6)}" fill="#fff3c8" class="tw" style="animation-delay:${f1(-r() * 3)}s"/>`; }
    // 星座の線
    const cons = [[[260, 110], [330, 160], [410, 140], [470, 210], [540, 190]], [[1960, 420], [2030, 360], [2110, 380], [2150, 300]], [[1260, 60], [1320, 120], [1390, 100]]];
    cons.forEach((pts) => { s += `<polyline points="${pts.map((p) => p.join(",")).join(" ")}" fill="none" stroke="#c9d4ff" stroke-opacity=".35" stroke-width="1.2" stroke-dasharray="3 4"/>`; pts.forEach((p) => s += `<circle cx="${p[0]}" cy="${p[1]}" r="2.6" fill="#fff"/>`); });
    // 浮かぶ天体
    s += `<g class="drift"><ellipse cx="560" cy="250" rx="102" ry="22" fill="none" stroke="#e8cf8e" stroke-width="5" opacity=".5" transform="rotate(-16 560 250)"/>
      <circle cx="560" cy="250" r="54" fill="url(#planetA)"/>
      <path d="M458 270 A102 22 -16 0 0 662 230" fill="none" stroke="#e8cf8e" stroke-width="5" transform="rotate(0)" opacity=".9"/></g>
      <g class="drift slow"><circle cx="1690" cy="150" r="28" fill="url(#planetB)"/><circle cx="1682" cy="142" r="5" fill="#2f7c86" opacity=".4"/><circle cx="1698" cy="160" r="3.5" fill="#2f7c86" opacity=".4"/></g>
      <g class="drift"><circle cx="2140" cy="300" r="13" fill="#f0b7c8"/></g>
      <g class="drift slow"><circle cx="300" cy="420" r="9" fill="#cfe7b6" opacity=".9"/></g>
      <path d="M980 160 L1120 110" stroke="url(#comet)" stroke-width="3" stroke-linecap="round"/><circle cx="1120" cy="110" r="4" fill="#fff6d8"/>`;
    return `<svg viewBox="0 0 2400 1000" preserveAspectRatio="xMidYMax slice">${s}</svg>`;
  }

  const FAR_SHELVES = [[90, 520], [320, 540], [2030, 540], [2260, 520], [2490, 540]];
  function wallPanel(x) { return `<path d="M${x} 330 V880 M${x + 220} 330" stroke="#283065" stroke-width="14"/><path d="M${x + 20} 470 Q${x + 110} 380 ${x + 200} 470" fill="none" stroke="#283065" stroke-width="8"/>`; }
  function farShelf(x, y, r) {
    let s = `<rect x="${x}" y="${y}" width="200" height="${860 - y}" fill="#2a2349"/>`;
    for (let yy = y + 20; yy < 850; yy += 64) { s += `<rect x="${x + 10}" y="${yy}" width="180" height="46" fill="#1f1a3a"/><path d="M${x + 10} ${yy + 52} H${x + 190}" stroke="#3b2f55" stroke-width="6"/>`; for (let bx = x + 14; bx < x + 186; bx += 9 + r() * 8) s += `<rect x="${f1(bx)}" y="${yy + 14 + f1(r() * 12)}" width="6" height="${f1(32 - r() * 12)}" fill="${pick(["#3a335e", "#43395f", "#33405e", "#4a3a52"])}"/>`; }
    return s;
  }
  function backSVG() {
    const cx = 1400, cy = 390, r = rng(19); let s = "";
    const arch = "M1110 800 V400 Q1110 160 1400 112 Q1690 160 1690 400 V800 Z";
    s += `<defs><clipPath id="win"><path d="${arch}"/></clipPath>
      <radialGradient id="winGlow"><stop offset="0" stop-color="#bcd2ff" stop-opacity=".45"/><stop offset="1" stop-color="#bcd2ff" stop-opacity="0"/></radialGradient>
      <radialGradient id="moonGlow"><stop offset="0" stop-color="#fff3c4" stop-opacity=".9"/><stop offset="1" stop-color="#fff3c4" stop-opacity="0"/></radialGradient>
      <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c8d8ff" stop-opacity=".22"/><stop offset="1" stop-color="#c8d8ff" stop-opacity="0"/></linearGradient>
      <radialGradient id="winLight" cx="1400" cy="390" r="560" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fff7da"/><stop offset=".4" stop-color="#cfdcff"/><stop offset="1" stop-color="#6f80cc"/></radialGradient>
      <radialGradient id="glassSheen" cx="1400" cy="390" r="440" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fff" stop-opacity=".32"/><stop offset=".55" stop-color="#fff" stop-opacity=".07"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
      <linearGradient id="wallG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#272d64"/><stop offset="1" stop-color="#141943"/></linearGradient>
      <linearGradient id="towerG" x1="0" x2="1"><stop offset="0" stop-color="#1a2050"/><stop offset=".5" stop-color="#2c3472"/><stop offset="1" stop-color="#1a2050"/></linearGradient>
      <linearGradient id="frameG" x1="0" x2="1"><stop offset="0" stop-color="#5e4a3a"/><stop offset=".5" stop-color="#9a7e62"/><stop offset="1" stop-color="#5e4a3a"/></linearGradient>
      <radialGradient id="spill"><stop offset="0" stop-color="#fff" stop-opacity="1"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs>`;
    // 奥の壁と中央の塔
    s += `<!--wall--><rect x="0" y="330" width="2800" height="670" fill="url(#wallG)"/>
      <path d="M0 330 H2800" stroke="#2c3370" stroke-width="10"/><!--/wall-->`;
    for (let x = 60; x < 2800; x += 220) { if (x > 700 && x < 2050) continue; s += wallPanel(x); }
    // 遠くの本棚のシルエット
    FAR_SHELVES.forEach(([x, y]) => { s += farShelf(x, y, r); });
    s += `<!--tower--><path d="M820 1000 V210 Q1400 30 1980 210 V1000 Z" fill="url(#towerG)"/>
      <path d="M820 210 Q1400 30 1980 210" fill="none" stroke="#3a4384" stroke-width="10"/><!--/tower-->
      <!--winglow--><ellipse cx="${cx}" cy="420" rx="560" ry="460" fill="url(#winGlow)"/><!--/winglow-->`;
    // ステンドグラス
    const cols = ["#2c3f8f", "#3b2f7a", "#1f5f7a", "#4b3a8c", "#24497f", "#5a3f86", "#2e6a8a", "#3a2f6a"];
    s += `<!--win--><g clip-path="url(#win)"><rect x="1100" y="100" width="600" height="720" fill="url(#winLight)"/>`;
    const N = 24;
    for (let i = 0; i < N; i++) {
      const a1 = (i / N) * Math.PI * 2, a2 = ((i + 1) / N) * Math.PI * 2, R = 800;
      s += `<path d="M${cx} ${cy}L${f1(cx + R * Math.cos(a1))} ${f1(cy + R * Math.sin(a1))}L${f1(cx + R * Math.cos(a2))} ${f1(cy + R * Math.sin(a2))}Z" fill="${cols[i % cols.length]}" opacity="${i % 3 ? .74 : .66}"/>`;
    }
    [175, 255, 345].forEach((rr, k) => { if (k === 1) for (let i = 0; i < 12; i++) { const a = (i / 12) * Math.PI * 2 + .13; s += `<circle cx="${f1(cx + rr * Math.cos(a))}" cy="${f1(cy + rr * Math.sin(a))}" r="15" fill="${i % 2 ? "#e8c86e" : "#8fc0e8"}" fill-opacity=".9" stroke="${C.lead}" stroke-width="5"/>`; } });
    for (let i = 0; i < N; i++) { const a = (i / N) * Math.PI * 2; s += `<path d="M${f1(cx + 150 * Math.cos(a))} ${f1(cy + 150 * Math.sin(a))}L${f1(cx + 800 * Math.cos(a))} ${f1(cy + 800 * Math.sin(a))}" stroke="${C.lead}" stroke-width="5"/>`; }
    [175, 255, 345, 440].forEach((rr) => s += `<circle cx="${cx}" cy="${cy}" r="${rr}" fill="none" stroke="${C.lead}" stroke-width="6"/>`);
    // 月
    s += `<circle cx="${cx}" cy="${cy}" r="230" fill="url(#moonGlow)" opacity=".55"/>
      <circle cx="${cx}" cy="${cy}" r="150" fill="#1d2766" fill-opacity=".78" stroke="${C.lead}" stroke-width="7"/>
      <path d="M${cx - 30} ${cy - 128} A130 130 0 1 0 ${cx + 118} ${cy + 55} A112 112 0 1 1 ${cx - 30} ${cy - 128} Z" fill="#f4e2a0" stroke="${C.lead}" stroke-width="6"/>
      <path d="M${cx - 92} ${cy - 40} L${cx - 60} ${cy + 10} M${cx - 70} ${cy + 70} L${cx - 20} ${cy + 80} M${cx - 112} ${cy + 30} L${cx - 72} ${cy + 40}" stroke="#c9b26e" stroke-width="5"/>
      <path d="${star4(cx + 50, cy - 50, 22)}" fill="#f6e3a3" stroke="${C.lead}" stroke-width="4"/>
      <path d="${star4(cx + 70, cy + 40, 13)}" fill="#f6e3a3" stroke="${C.lead}" stroke-width="3"/>
      <path d="M1100 620 H1700" stroke="${C.lead}" stroke-width="12"/><rect x="1100" y="626" width="600" height="190" fill="#1f2a66" opacity=".55"/>`;
    for (let x = 1130; x < 1700; x += 74) { s += `<path d="M${x} 626 V820" stroke="${C.lead}" stroke-width="5"/><path d="${star4(x + 37, 700 + (x % 3) * 12, 9)}" fill="#e6cf86"/><rect x="${x + 6}" y="740" width="62" height="70" fill="${cols[(x / 74 | 0) % cols.length]}" opacity=".7"/>`; }
    s += `<rect x="1100" y="100" width="600" height="720" fill="url(#glassSheen)"/><path d="M1180 300 L1260 220 M1200 330 L1300 230 M1520 560 L1600 480 M1540 590 L1620 510" stroke="#fff" stroke-opacity=".12" stroke-width="6" stroke-linecap="round"/>`;
    s += `</g><path d="${arch}" fill="none" stroke="#fff3c4" stroke-opacity=".18" stroke-width="60"/><path d="${arch}" fill="none" stroke="url(#frameG)" stroke-width="26"/><path d="${arch}" fill="none" stroke="${C.gold}" stroke-width="4" opacity=".8"/>
      <path d="M1080 800 H1720 V830 H1080 Z" fill="#7b6450"/>
      <path d="${star4(cx, 70, 24)}" fill="${C.gold}"/><!--/win-->
      <!--floor--><rect x="0" y="860" width="2800" height="140" fill="#141a40"/>
      <ellipse cx="1300" cy="905" rx="190" ry="32" fill="#7d96ff" opacity=".1"/><ellipse cx="1500" cy="930" rx="170" ry="30" fill="#b48aff" opacity=".1"/><ellipse cx="1400" cy="965" rx="230" ry="26" fill="#ffe7a0" opacity=".08"/>
      <polygon points="1130,820 1670,820 1980,1000 820,1000" fill="url(#beam)"/><!--/floor-->`;
    return `<svg viewBox="0 0 2800 1000" preserveAspectRatio="xMidYMax slice">${s}</svg>`;
  }

  // 先のとがった葉。rib=true で葉脈（中央の筋）を描く
  function leaf(x, y, len, w, ang, fill, rib = true) {
    const L = f1(len), Wd = f1(w);
    let g = `<path d="M0 0C${Wd} ${f1(-len * .28)} ${f1(w * .9)} ${f1(-len * .74)} 0 ${-L}C${f1(-w * .9)} ${f1(-len * .74)} ${-Wd} ${f1(-len * .28)} 0 0Z" fill="${fill}"/>`;
    if (rib) g += `<path d="M0 -2Q${f1(w * .12)} ${f1(-len * .5)} 0 ${f1(-len * .93)}" stroke="#d8f0c0" stroke-opacity=".38" stroke-width="${f1(Math.max(1, w * .1))}" fill="none"/>`;
    return `<g transform="translate(${f1(x)} ${f1(y)}) rotate(${f1(ang)})">${g}</g>`;
  }
  function pottedPlant(x, y, k, r, potColor = "#8b5d3e") {
    let s = "";
    const greens = ["url(#leafA)", "url(#leafB)", "url(#leafC)", "url(#leafA)"];
    for (let i = 0; i < 11; i++) { const a = -75 + i * 15 + (r() - .5) * 10; s += leaf(x, y - 4 * k, (60 + r() * 50) * k, (12 + r() * 6) * k, a, greens[i % 4]); }
    s += `<ellipse cx="${x}" cy="${f1(y + 46 * k)}" rx="${f1(30 * k)}" ry="${f1(5 * k)}" fill="#000" opacity=".3"/><path d="M${f1(x - 30 * k)} ${f1(y - 6 * k)} H${f1(x + 30 * k)} L${f1(x + 22 * k)} ${f1(y + 44 * k)} H${f1(x - 22 * k)} Z" fill="url(#potG)"/><rect x="${f1(x - 33 * k)}" y="${f1(y - 10 * k)}" width="${f1(66 * k)}" height="${f1(9 * k)}" rx="2" fill="url(#potRim)"/><path d="M${f1(x - 18 * k)} ${f1(y + 6 * k)} q${f1(18 * k)} ${f1(6 * k)} ${f1(36 * k)} 0" stroke="#e7c08f" stroke-opacity=".35" stroke-width="${f1(2 * k)}" fill="none"/>`;
    return s;
  }
  function ivy(x, y, len, r) {
    let s = `<path d="M${x} ${y} q${f1(-10 + r() * 20)} ${f1(len / 2)} ${f1(-6 + r() * 12)} ${len}" stroke="#4a6e42" stroke-width="2.5" fill="none"/>`;
    for (let t = 10; t < len; t += 16) s += leaf(x + (r() - .5) * 12, y + t, 14 + r() * 6, 6, r() < .5 ? -50 - r() * 30 : 50 + r() * 30, r() < .5 ? "url(#leafB)" : "url(#leafC)", false);
    return s;
  }
  function pillarBody(p) {
    return `<rect x="${p - 20}" y="150" width="40" height="690" fill="url(#woodV)"/><rect x="${p - 28}" y="148" width="56" height="20" rx="3" fill="${C.woodL}"/><rect x="${p - 28}" y="812" width="56" height="26" rx="3" fill="${C.woodL}"/><path d="M${p} 260 V780" stroke="${C.gold}" stroke-width="2" opacity=".45"/>`;
  }
  function archBody(a, span) {
    const b = a + span;
    return `<path d="M${a} 160 H${b}" stroke="${C.wood}" stroke-width="20"/><path d="M${a} 168 Q${(a + b) / 2} 40 ${b} 168" fill="none" stroke="${C.wood}" stroke-width="16"/><path d="M${a + 16} 166 Q${(a + b) / 2} 58 ${b - 16} 166" fill="none" stroke="${C.gold}" stroke-width="2.5" opacity=".7"/><path d="${star4((a + b) / 2, 84, 10)}" fill="${C.gold}"/>`;
  }
  function grandArchBody(a) {
    return `<path d="M${a} 180 C${a} -60 ${a + 680} -60 ${a + 680} 180" fill="none" stroke="${C.wood}" stroke-width="26"/><path d="M${a + 18} 180 C${a + 18} -30 ${a + 662} -30 ${a + 662} 180" fill="none" stroke="${C.gold}" stroke-width="3" opacity=".7"/>`;
  }
  function lanternBody(x, y) {
    return `<path d="M${x} ${y - 70} V${y - 26}" stroke="#7d6648" stroke-width="2"/>
      <path d="M${x - 14} ${y - 26} H${x + 14} L${x + 18} ${y + 18} H${x - 18} Z" fill="#ffe2a0" stroke="#7d5a38" stroke-width="3"/>
      <path d="M${x - 18} ${y - 30} H${x + 18} L${x + 12} ${y - 22} H${x - 12} Z M${x - 20} ${y + 18} H${x + 20} L${x + 14} ${y + 26} H${x - 14} Z" fill="#7d5a38"/>`;
  }
  function candleBody(x, y) { return `<rect x="${x - 5}" y="${y - 4}" width="10" height="34" rx="2" fill="#f4ecd8"/><path d="M${x} ${y - 20} q6 10 0 16 q-6 -6 0 -16" fill="#ffcf6e"/>`; }
  function carpetTile() {
    let s = `<rect x="0" y="836" width="720" height="20" fill="${C.woodD}"/><rect x="0" y="852" width="720" height="148" fill="url(#carpetG)"/>`;
    for (let x = 0; x < 720; x += 120) s += `<path d="${star4(x + 60, 974, 7)}" fill="${C.gold}" opacity=".45"/><path d="M${x} 974 L${x + 10} 968 L${x + 20} 974 L${x + 10} 980 Z M${x + 100} 974 L${x + 110} 968 L${x + 120} 974 L${x + 110} 980 Z" fill="#2f3f80"/>`;
    return s + `<path d="M0 866 H720 M0 986 H720" stroke="${C.gold}" stroke-width="3" opacity=".75"/><path d="M0 874 H720 M0 978 H720" stroke="${C.gold}" stroke-width="1" opacity=".45"/>`;
  }
  function frontCluster(x, r) { let s = ""; for (let i = 0; i < 14; i++) s += leaf(x + (r() - .5) * 60, 1060, 110 + r() * 150, 20 + r() * 10, -70 + i * 10 + (r() - .5) * 12, r() < .5 ? "#0f1d1c" : "#132522", false); return s; }
  function lantern(x, y, id) {
    return `<g class="float" style="animation-delay:${f1(-(x % 5))}s"><circle cx="${x}" cy="${y}" r="90" fill="url(#lampGlow)" class="flick"/>${lanternBody(x, y)}</g>`;
  }
  function candle(x, y, d) {
    return `<g class="float" style="animation-delay:${d}s;animation-duration:${4 + (x % 3)}s"><circle cx="${x}" cy="${y - 12}" r="28" fill="url(#lampGlow)" class="flick"/>
      ${candleBody(x, y)}</g>`;
  }

  const SPINES = ["#7c3b3f", "#3f5a7c", "#5a4a7a", "#8a6a3a", "#44694c", "#6a3f5c", "#2f4a68", "#9a7a4e", "#5c3a2c", "#3e3e62", "#7a5a8a", "#476a7a"];
  function bayBody(x, seed, liveBooks, spots) {
    const r = rng(seed), rows = 5, rowH = 116, top0 = 250; let s = "";

    const triTail = `M${P(...base[0])}L${P(...tip)}L${P(...base[1])}Z`;
    if (kind === "spiky") {
      const { pts, total } = perimeterPoints(W, H, 3.4, 2 * Math.max(8, Math.round(perimeterPoints(W, H, 3.4, 8).total / 52)));
      let best = 0, bd = 1e9; pts.forEach((q, i) => { if (i % 2) return; const d = Math.hypot(q.x - tip[0], q.y - tip[1]); if (d < bd) { bd = d; best = i; } });
      const d = pts.map((q, i) => { const out = i % 2 === 0, k = out ? (i === best ? 30 : 15) : -4; return (i ? "L" : "M") + P(q.x + q.nx * k, q.y + q.ny * k); }).join("") + "Z";
      return { d, tail: "", fill: "" };
    }
    if (kind === "cloud") {
      const per = perimeterPoints(W, H, 3, 8, 4).total, N = Math.max(8, Math.round(per / 46));
      const { pts } = perimeterPoints(W, H, 3, N, 4);
      let d = "M" + P(pts[0].x, pts[0].y);
      pts.forEach((q, i) => { const n = pts[(i + 1) % N], ch = Math.hypot(n.x - q.x, n.y - q.y); d += `A${f1(ch * .58)} ${f1(ch * .58)} 0 0 1 ${P(n.x, n.y)}`; });
      const dots = side === "top" ? [[cx - 4, -10, 6], [cx - 12, -24, 3.5]] : [[-10, cy + 4, 6], [-24, cy + 12, 3.5]];
      return { d: d + "Z", tail: dots.map(([x, y, r]) => `M${f1(x - r)} ${f1(y)}a${r} ${r} 0 1 0 ${r * 2} 0a${r} ${r} 0 1 0 ${-r * 2} 0Z`).join(""), fill: "" };
    }
    if (kind === "wavy") {
      const { pts, total } = perimeterPoints(W, H, 3.6, 260);
      const d = pts.map((q, i) => { const w = 3.2 * Math.sin((i / pts.length) * total / 24 * Math.PI * 2); return (i ? "L" : "M") + P(q.x + q.nx * w, q.y + q.ny * w); }).join("") + "Z";
      return { d, tail: triTail, fill: triTail };
    }
    const r = Math.min(22, H / 2);
    return { d: `M${r} 0H${W - r}A${r} ${r} 0 0 1 ${W} ${r}V${H - r}A${r} ${r} 0 0 1 ${W - r} ${H}H${r}A${r} ${r} 0 0 1 0 ${H - r}V${r}A${r} ${r} 0 0 1 ${r} 0Z`, tail: triTail, fill: triTail };
  }
  let sayKind = "round";
  function drawBubble() {
    const say = $("say"), W = say.offsetWidth, H = say.offsetHeight; if (!W || !H) return;
    const side = matchMedia("(max-width: 720px)").matches ? "top" : "left", m = 48;
    const sh = bubbleShape(sayKind, W, H, side), svg = $("sayShape");
    svg.setAttribute("viewBox", `${-m} ${-m} ${W + 2 * m} ${H + 2 * m}`);
    svg.style.cssText = `left:${-m}px;top:${-m}px;width:${W + 2 * m}px;height:${H + 2 * m}px`;
    $("sayPath").setAttribute("d", sh.d); $("sayTail").setAttribute("d", sh.tail); $("sayTailFill").setAttribute("d", sh.fill);
  }
  addEventListener("resize", () => { if (!$("talk").hidden) drawBubble(); });
  function setEmote(key) {
    const e = getEmote(key), say = $("say");
    sayKind = e.shape; say.className = `say ${e.shape} ${e.tint || ""}`;
    const body = $("bookBody"); body.className = "book-body " + (e.body || ""); void body.offsetWidth; if (e.move) body.classList.add(e.move);
    $("emote").innerHTML = fxSVG(e.fx);
    const snd = { notes: "happy", hearts: "heart", sparkle: "sparkle", blush: "shy", sweat: "sweat", surprise: "surprise", excited: "excited", anger: "angry", gloom: "sad", zzz: "sleepy", dots: "silent", question: "question" }[e.fx];
    if (snd) SFX.play(snd, .05);
  }

  /* ---------- 本との対話 ---------- */
  let typing = null, queue = [], currentBook = null, onDone = null, fullText = "";
  // 文章は最初から全部並べて大きさを決め、1文字ずつ見えるようにする（途中で吹き出しの大きさが変わらない）
  function showLine(l) {
    setEmote(l.emote || l.face || "normal");
    fullText = l.text; clearInterval(typing); $("next").hidden = true;
    const el = $("line"), chars = Array.from(fullText);
    el.setAttribute("aria-label", fullText);
    el.innerHTML = chars.map((c) => `<span class="ch" aria-hidden="true">${esc(c)}</span>`).join("");
    drawBubble();
    const spans = el.querySelectorAll(".ch");
    if (reduced) { spans.forEach((sp) => sp.classList.add("on")); afterType(); return; }
    let i = 0;
    const seed = [...(currentBook ? currentBook.id : "x")].reduce((a, c) => a + c.charCodeAt(0), 0);
    typing = setInterval(() => { if (spans[i]) { spans[i].classList.add("on"); if (i % 2 === 0 && /[^\s…。、・（）「」]/.test(spans[i].textContent)) SFX.blip(seed); } i++; if (i >= spans.length) { clearInterval(typing); typing = null; afterType(); } }, 34);
  }
  function afterType() { if (queue.length) $("next").hidden = false; else { const f = onDone; onDone = null; f && f(); } }
  function advance() {
    if (typing) { clearInterval(typing); typing = null; $("line").querySelectorAll(".ch").forEach((sp) => sp.classList.add("on")); afterType(); return; }
    if (queue.length) showLine(queue.shift());
  }
  $("say").addEventListener("click", advance);
  $("talk").addEventListener("click", (e) => { if (e.target === $("talk") || e.target.closest(".book-box")) advance(); });
  addEventListener("keydown", (e) => {
    if (!$("talk").hidden && (e.key === "Enter" || e.key === " ") && !e.target.closest("button")) { e.preventDefault(); advance(); }
    if (e.key === "Escape" && !$("catalog").hidden) closeCatalog();
  });
  function talk(book, lines, actions) {
    SFX.play("bookOpen");
    currentBook = book; cam.dir = 0;
    $("speaker").textContent = book.title;
    $("bigCover").innerHTML = coverHTML(book);
    $("actions").innerHTML = "";
    $("talk").hidden = false;
    queue = lines.slice();
    onDone = () => actions.forEach((a, i) => {
      const b = document.createElement("button"); b.className = "btn" + (a.primary ? " primary" : " quiet"); b.textContent = a.label; b.addEventListener("click", a.run);
      $("actions").appendChild(b); if (i === 0) b.focus();
    });
    showLine(queue.shift());
  }
  function closeTalk() {
    clearInterval(typing); typing = null; $("talk").hidden = true;
    const b = currentBook; if (!b) return;
    const el = document.querySelector(`.live[data-id="${b.id}"]`);
    if (el) { el.classList.remove("gone"); el.focus({ preventScroll: true }); }
  }
  function openBook(book, source) {
    const L = book.lines, m = bookMem(book.id);
    const read = { label: "読む", primary: true, run: () => { closeTalk(); openReader(book); } };
    const back = { label: source === "catalog" ? "目録に戻る" : "棚に戻す", run: () => { closeTalk(); if (source === "catalog") openCatalog(); } };
    let lines, actions = [read, back];
    if (source === "catalog") lines = [L.catalog || { emote: "normal", text: "……" }];
    else if (source === "jump") { lines = L.jump; m.met++; setTimeout(() => torsa("jumper"), 500); }
    else if (book.type === "refuser") {
      if (m.accepted) lines = L.revisit;
      else if (m.refused < (book.refuseCount ?? 2)) {
        lines = L.refuse[Math.min(m.refused, L.refuse.length - 1)];
        torsa(m.refused === 0 ? "refused" : "refusedAgain");
        m.refused++;
        actions = [{ label: "もう一度たのむ", primary: true, run: () => openBook(book, "shelf") }, back];
      } else { lines = L.accept; m.accepted = true; setTimeout(() => torsa("accepted"), 400); }
      m.met++;
    } else if (book.type === "revisit") {
      lines = m.met === 0 ? L.first : (L.frequent && m.met + 1 >= (L.frequentFrom || 4)) ? L.frequent : L.revisit; m.met++;
    } else { lines = m.met === 0 ? L.first : L.revisit; m.met++; }
    save();
    talk(book, lines, actions);
  }

  /* ---------- 本棚の本を置く ---------- */
  function placeBooks(spots) {
    const mid = $("midTop"), W = DATA.library.world.width;
    DATA.books.books.forEach((b) => {
      const sp = spots[b.id]; if (!sp) return;
      const el = document.createElement("button");
      el.className = "live" + (b.type === "jumper" ? " restless" : "");
      el.dataset.id = b.id;
      el.dataset.tpl = b.cover.template || "classic";
      el.style.cssText = `--c:${b.cover.color};--a:${b.cover.accent};left:${(sp.x / W) * 100}%;top:${sp.y / 10}%;width:${(sp.w / W) * 100}%;height:${sp.h / 10}%`;
      el.setAttribute("aria-label", `${b.title}を手に取る`);
      el.addEventListener("click", () => { burstAt(el, 26, 1.6); SFX.play("pickup"); openBook(b, "shelf"); });
      el.addEventListener("pointerenter", () => { burstAt(el, 8, .6); SFX.play("hover"); });
      el.innerHTML = '<span class="shine"></span>';
      if (sp.slot) { const bk = document.createElement("span"); bk.className = "slot-back"; bk.style.cssText = `left:${((sp.x - 5) / W) * 100}%;top:${(sp.y - 4) / 10}%;width:${((sp.w + 10) / W) * 100}%;height:${(sp.h + 4) / 10}%`; mid.appendChild(bk); }
      mid.appendChild(el);
      b._x = sp.x + sp.w / 2;
      if (b.shelfEmote) {
        const em = document.createElement("span"); em.className = "shelf-emote"; em.textContent = b.shelfEmote; em.dataset.for = b.id;
        em.style.cssText = `left:${((sp.x + sp.w / 2) / W) * 100}%;top:${(sp.y - 8) / 10}%`;
        mid.appendChild(em);
      }
    });
  }

  // 飛び出す本：近くまで歩いて少し待つと飛び出す
  let jumped = false;
  function checkJumper(dt) {
    const j = DATA.books.books.find((b) => b.type === "jumper"); if (!j || jumped || uiBusy()) return;
    if (Math.abs(cam.x - j._x) < cam.viewU * .35 && Math.abs(cam.vel) < .5) { jumpWait += dt; if (jumpWait > (j.jumpDelayMs || 1500)) jump(j); }
    else jumpWait = 0;
  }
  function jump(book) {
    SFX.play("jump");
    jumped = true;
    const el = document.querySelector(`.live[data-id="${book.id}"]`), em = document.querySelector(`.shelf-emote[data-for="${book.id}"]`);
    const r = el.getBoundingClientRect(); el.classList.add("gone"); if (em) em.hidden = true;
    if (reduced) { openBook(book, "jump"); return; }
    const fly = document.createElement("div"); fly.className = "flyer";
    const w = r.height * .75; fly.style.cssText = `left:${r.left}px;top:${r.top}px;width:${w}px;height:${r.height}px`;
    fly.innerHTML = coverHTML(book); document.body.appendChild(fly);
    const tx = innerWidth * .32 - r.left, ty = innerHeight * .3 - r.top;
    fly.animate([
      { transform: "translate(0,0) scale(.4) rotate(0)" },
      { transform: `translate(${tx * .5}px, ${ty - 160}px) scale(1.2) rotate(-220deg)`, offset: .55 },
      { transform: `translate(${tx}px, ${ty}px) scale(2) rotate(-360deg)` }
    ], { duration: 950, easing: "cubic-bezier(.3,.7,.3,1)" }).onfinish = () => { fly.remove(); openBook(book, "jump"); };
  }

  /* ---------- 読書画面 ---------- */
  const sizes = [["size-s", "小"], ["size-m", "中"], ["size-l", "大"]];
  let sizeIdx = 1; try { const v = localStorage.getItem(KEY + "-size"); if (v !== null && sizes[+v]) sizeIdx = +v; } catch (e) {}
  const applySize = () => { $("rBody").className = "r-body " + sizes[sizeIdx][0]; $("sizeBtn").textContent = "文字 " + sizes[sizeIdx][1]; };
  $("sizeBtn").addEventListener("click", () => { sizeIdx = (sizeIdx + 1) % 3; applySize(); try { localStorage.setItem(KEY + "-size", sizeIdx); } catch (e) {} });
  applySize();
  let readingBook = null;
  function openReader(book) {
    SFX.play("page");
    const w = DATA.works.works.find((x) => x.id === book.workId); readingBook = book;
    $("rWhere").textContent = `${book.title} ／ ${w ? w.title : "（作品が見つかりません）"}`;
    $("rArticle").innerHTML = w
      ? `<h2>${esc(w.title)}</h2><p class="meta">${esc(w.author || "")}${w.genre ? "　・　" + esc(w.genre) : ""}</p>` + w.paragraphs.map((p) => p === "" ? '<p class="blank"></p>' : `<p>${esc(p)}</p>`).join("") + '<p class="fin">おしまい</p>'
      : `<p>works.json に「${esc(book.workId)}」が見つかりませんでした。</p>`;
    $("reader").hidden = false; $("rBody").scrollTop = 0; updateProgress(); $("closeReader").focus({ preventScroll: true });
  }
  function updateProgress() { const b = $("rBody"), max = b.scrollHeight - b.clientHeight; $("progress").style.width = (max > 0 ? (b.scrollTop / max) * 100 : 100) + "%"; }
  $("rBody").addEventListener("scroll", updateProgress, { passive: true });
  $("closeReader").addEventListener("click", () => {
    $("reader").hidden = true; const b = readingBook; if (!b) return;
    bookMem(b.id).read++; save();
    if (b.lines.afterRead) talk(b, [b.lines.afterRead], [{ label: "棚に戻す", primary: true, run: () => { closeTalk(); torsa("afterRead"); } }]);
    else torsa("afterRead");
  });

  /* ---------- 目録 ---------- */
  let resetArmed = false;
  function openCatalog() {
    SFX.play("page");
    const list = $("catList"); list.innerHTML = "";
    DATA.books.books.forEach((b, i) => {
      const w = DATA.works.works.find((x) => x.id === b.workId);
      const li = document.createElement("li");
      li.innerHTML = `<span class="thumb">${coverHTML(b)}</span><span style="min-width:0"><span class="no">No.${String(i + 1).padStart(3, "0")}</span><br><span class="t">${esc(w ? w.title : b.workId)}</span><br><span class="m">${esc(b.title)}${w && w.genre ? "　・　" + esc(w.genre) : ""}</span></span>`;
      const btn = document.createElement("button"); btn.className = "btn small primary"; btn.textContent = "読む";
      btn.addEventListener("click", () => { closeCatalog(true); openBook(b, "catalog"); });
      li.appendChild(btn); list.appendChild(li);
    });
    resetArmed = false; $("resetBtn").textContent = "来館記録をリセット";
    cam.dir = 0; $("catalog").hidden = false; $("catClose").focus();
  }
  function closeCatalog(silent) { $("catalog").hidden = true; if (!silent) $("catalogBtn").focus(); }
  $("catalogBtn").addEventListener("click", () => { openCatalog(); torsa("catalog"); });
  $("catClose").addEventListener("click", () => closeCatalog());
  $("catalog").addEventListener("click", (e) => { if (e.target === $("catalog")) closeCatalog(); });
  $("resetBtn").addEventListener("click", () => {
    if (!resetArmed) { resetArmed = true; $("resetBtn").textContent = "本当にリセットする"; return; }
    mem = { visits: 1, books: {} }; save(); jumped = false; jumpWait = 0;
    document.querySelectorAll(".live.gone").forEach((el) => el.classList.remove("gone"));
    document.querySelectorAll(".shelf-emote").forEach((el) => el.hidden = false);
    $("resetBtn").textContent = "リセットしました"; resetArmed = false;
  });

  function motes() {
    if (reduced) return; const box = $("motes");
    for (let i = 0; i < 26; i++) {
      const m = document.createElement("i"); if (i % 3 === 0) m.className = "m";
      m.style.left = Math.random() * 100 + "%"; m.style.top = (25 + Math.random() * 70) + "%";
      m.style.animationDuration = (10 + Math.random() * 12) + "s"; m.style.animationDelay = (-Math.random() * 20) + "s";
      box.appendChild(m);
    }
  }

  /* ---------- 入館 ---------- */
  document.body.classList.add("at-door", "torsa-away");
  $("enterBtn").addEventListener("click", () => {
    if ($("bgmOnEnter").checked) BGM.start(); setBgmButton();
    document.body.classList.remove("at-door");
    SFX.play("sparkle");
    const eb = $("enterBtn").getBoundingClientRect(); burst(eb.left + eb.width / 2, eb.top + eb.height / 2, 40, 2.2, 80);
    $("entrance").classList.add("leaving");
    setTimeout(() => { $("entrance").hidden = true; }, 1200);
    seqTimers.forEach(clearTimeout);
    // 入館して少ししてから、トルサがきらめきと一緒に現れて、あいさつする
    const greet = DATA.torsa.lines[mem.visits === 1 ? "entranceFirst" : "entranceReturn"] || [];
    setTimeout(() => {
      document.body.classList.remove("torsa-away"); SFX.play("appear");
      const r = $("torsaImg").getBoundingClientRect();
      for (let i = 0; i < 3; i++) setTimeout(() => burst(r.left + r.width * (.3 + Math.random() * .4), r.top + r.height * (.15 + Math.random() * .5), 18, 1.6, 70), i * 180);
      setTimeout(() => {
        torsaSeq(mem.visits === 1 ? "entranceFirst" : "entranceReturn");
        setTimeout(() => torsa("enterLibrary"), greet.length * 3400 + 600);
      }, 700);
    }, 1300);
    MOON.allowAt = performance.now() + 1300 + 700 + greet.length * 3400 + 7000;
    resetIdle();
  });

  /* ---------- データ読み込み ---------- */
  const optional = fetch("data/scene.json").then((r) => (r.ok ? r.json() : null)).catch(() => null);
  fetch("data/sfx.json").then((r) => (r.ok ? r.json() : null)).then((c) => { SFX.config(c); setSfxButton(); }).catch(() => setSfxButton());
  Promise.all(["library", "books", "works", "torsa", "bgm"].map((n) => fetch(`data/${n}.json`).then((r) => { if (!r.ok) throw new Error(n); return r.json(); })).concat(optional))
    .then(([library, books, works, torsaD, bgm, scene]) => {
      DATA = { library, books, works, torsa: torsaD };
      BGM.setConfig(bgm);
      if (torsaD.faces) { Object.values(torsaD.faces).forEach((src) => { const im = new Image(); im.src = src; }); $("torsaImg").src = torsaD.faces.normal || torsaD.image; }
      else if (torsaD.image) $("torsaImg").src = torsaD.image;
      cam.W = library.world.width; cam.x = cam.target = library.world.startX || cam.W / 2;
      // 背景の絵：library.json の art にファイルが指定されていればそれを使い、空なら自動で描く
      const art = library.art || {};
      const useArt = (id, path, fit, gen) => { $(id).innerHTML = path ? `<img src="${esc(path)}" alt="" style="width:100%;height:100%;display:block;object-fit:${fit};object-position:50% 100%">` : gen; };
      // 部品モード：data/scene.json の parts に並んだSVGファイルを配置して組み立てる
      const useParts = scene && scene.useParts && scene.parts;
      const m = midSVG(library, books.books);
      const built = useParts ? buildFromParts(scene.parts, library, scene.decor || {}) : { mid: m.svg, back: backSVG(), front: frontSVG() };
      useArt("sky", art.sky, "cover", skySVG()); useArt("back", art.back, "cover", built.back); useArt("front", art.front, "cover", built.front); useArt("mid", art.mid, "fill", built.mid);
      $("midTop").innerHTML = built.midTop || ""; $("backTop").innerHTML = built.backTop || ""; $("shade").innerHTML = built.shade || "";
      if (useParts) setHandLight((scene.decor && scene.decor.shade) || {});
      placeBooks(useParts ? partSpots(library, books.books) : m.spots);
      setupRays(); MOON.ready = true; initFX(library);
      window.__torsaArt = { skySVG, backSVG, frontSVG, mid: () => m.svg, fxSVG, bubbleShape, coverHTML, EMOTE, books: books.books, partsSrc: () => partsSrc(library) };
      library.zones.forEach((z) => { if (z.from > 0) { const t = document.createElement("div"); t.className = "tick"; t.style.left = (z.from / cam.W) * 100 + "%"; $("ticks").appendChild(t); } });
      resize(); addEventListener("resize", resize);
      mem.visits++; save();
      $("visitNo").textContent = mem.visits === 1 ? "はじめて" : `${mem.visits} 回目`;
      $("bookCount").textContent = `${books.books.length} 冊（ほか眠っている本）`;
      $("enterBtn").disabled = false; $("status").textContent = "";

      requestAnimationFrame(loop);
    })
    .catch((err) => {
      console.error(err);
      $("status").textContent = "data フォルダを読み込めませんでした。パソコンで直接開いた場合は、README の手順でローカルサーバーから開いてください。";
    });
})();
</script>
