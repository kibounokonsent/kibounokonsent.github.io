<svg xmlns="http://www.w3.org/2000/svg" viewBox="-70 -70 440 540" width="440" height="540"><style>
 .tw{animation:twinkle 3s ease-in-out infinite}@keyframes twinkle{50%{opacity:.25}}
 .drift{animation:dy 9s ease-in-out infinite}.drift.slow{animation-duration:14s}.float{animation:dy 5s ease-in-out infinite}@keyframes dy{50%{transform:translateY(-14px)}}
 .flick{animation:flick 2.6s ease-in-out infinite}@keyframes flick{30%{opacity:.78}60%{opacity:1}80%{opacity:.85}}
 .fx-rise>*{animation:rise 2.4s ease-out infinite}.fx-rise>*:nth-child(2){animation-delay:.8s}.fx-rise>*:nth-child(3){animation-delay:1.6s}@keyframes rise{0%{transform:translateY(14px);opacity:0}25%{opacity:1}100%{transform:translateY(-34px);opacity:0}}
 .fx-drip{animation:drip 1.8s ease-in infinite}@keyframes drip{0%{transform:translateY(-6px);opacity:0}20%{opacity:1}100%{transform:translateY(18px);opacity:0}}
