  </div>`;
}

function catHead(cat){return `<div class="ahead plain"><a class="back" href="#top">← 目次へ</a><span class="cat-ic" data-k="${cat.key}" style="--cc:${cat.c}">${ICON[cat.key]}</span><h2>${cat.name}</h2><p class="lede">${cat.desc}</p></div>`;}
const dot = a => a.ch ? `<span class="dot ch" style="--chc:${a.ch}" aria-hidden="true"></span>` : `<span class="dot ${a.side||'none'}" aria-hidden="true"></span>`;

function renderCategory(key){
  const cat = CATS.find(c=>c.key===key);
  if(!cat) return renderHome();
  let inner;
  if(key==='calendar') inner = `<div class="rowlist">${CALENDAR.map(c=>`<div class="row"><span>${c.n}</span><span class="k">${c.d}</span></div>`).join('')}</div><p class="lede" style="margin-top:14px">判明している分から順次追加します。</p>`;
  else if(key==='glossary') inner = `<dl class="gloss">${GLOSSARY.filter(g=>!g.spoiler||full()).map(g=>`<div><dt>${g.t}${g.spoiler?'<span class="badge sp">ネタバレ</span>':''}</dt><dd>${g.d}${full()&&g.sp?` <strong>${g.sp}</strong>`:''}</dd></div>`).join('')}</dl>`;
  else if(key==='novel') inner = `<ul class="alist">${NOVEL.map(n=>`<li><a href="#novel-${n.id}"><span class="dot ch" style="--chc:${n.ch}" aria-hidden="true"></span><span><span class="t">第${n.id}話　${n.title}</span><div class="l">${n.date}</div></span></a></li>`).join('')}</ul>`;
  else {
    const arts = ARTICLES.filter(a=>a.cat===key && visible(a));
    inner = `<ul class="alist">${arts.map(a=>`<li><a href="#a-${a.id}">${dot(a)}<span><span class="t">${a.title}</span>${a.spoiler?'<span class="badge sp">ネタバレ</span>':''}<div class="l">${a.lede}</div></span></a></li>`).join('')}</ul>`;
  }
  return `<div class="wrap page">${catHead(cat)}${inner}</div>`;
}

function renderSections(secs){
  return (secs||[]).map(([h,rows])=>`<h3>${h}</h3><dl class="gloss">${rows.map(([t,d])=>`<div><dt>${t}</dt><dd>${d}</dd></div>`).join('')}</dl>`).join('');
}

function notFound(back,label){ return `<div class="wrap page"><a class="back" href="${back}">← ${label}</a><h2>この記録は見つからない</h2><p class="lede">目次からたどるか、上の検索欄で探してください。</p></div>`; }


function orgChart(key){
  const o = ORGS[key], cls = o.side==='light'?'f-light':'f-dark';
  return `<h3>所属</h3><div class="orgchart ${cls}">${o.depts.map(d=>`<div class="dept"><div class="dept-h"><div class="n">${d.n}</div><div class="d">${d.d}</div></div>
    <ul>${d.subs.map(([n,t])=>`<li><b>${n}</b><span>${t}</span></li>`).join('')}</ul></div>`).join('')}</div>`;
}
function pyramids(keys){
  return `<h3>階級</h3><div class="pyrs" style="--n:${keys.length}">${keys.map(k=>{const o=ORGS[k];
    return `<div class="pyr f-${o.side}"><div class="ph"><b>${o.name}</b><span class="latin">${o.side==='light'?'Light':'Dark'}</span></div>
     <div class="tiers">${o.ranks.map((r,i)=>`<div class="tier${i===0?' top':''}" style="--i:${i}">${r}</div>`).join('')}</div>
     <div class="foot">上ほど高位</div></div>`;}).join('')}</div>`;
}
function stages(){
  const col = me ? GEMS[me.el].c : '#d01a32';
  return `<div class="stages" style="--stc:${col}">${STAGES.map(s=>`<figure class="stg"><svg viewBox="${s.c-42} 138 84 84" aria-hidden="true">${s.svg}</svg>
    <figcaption><b>${s.n}</b>${s.p?`<span class="pc">${s.p}の力</span>`:'<span class="pc">―</span>'}<span>${s.t}</span></figcaption></figure>`).join('')}</div>
    ${me?`<p class="stnote">竜の部分は、あなたのアクセサリーの色で描いています。</p>`:''}`;
}
function speciesCards(a){
  const forms = a.sections.find(s=>s[0]==='形態'), kinds = a.sections.find(s=>s[0]==='種');
  const cards = kinds[1].filter(([n])=>n!=='龍' || full()).map(([n,d])=>{
    const g = dragonByName(n); const mine = me && me.sp===n;
    return `<div class="spc${mine?' mine':''}${g&&g.special?' special':''}">${g?`<svg viewBox="0 0 ${g.w} ${g.h}" aria-hidden="true"><use href="#dg-${g.k}"/></svg>`:''}<b>${n}${g&&g.special?'<span class="badge sp">ネタバレ</span>':''}</b><p>${d}</p></div>`;}).join('');
  return `<h3>種</h3><div class="spgrid">${cards}</div>${renderSections([forms])}`;
}
function elements(a){
  const rows = a.sections[0][1];
  return `<div class="elgrid">${rows.map(([k,d])=>{const s=k==='光'?'light':k==='闇'?'dark':'';
    return `<div class="elc ${s}${me&&me.el===k?' mine':''}" style="--ec:${ELCOLOR[k]||'var(--line)'}">${s&&!(me&&me.el===k)?`<span class="tag latin">${s==='light'?'Light':'Dark'}</span>`:''}<span class="k">${k}</span><p>${d}</p></div>`;}).join('')}</div>`;
}

function renderArticle(id){
  const a = ARTICLES.find(x=>x.id===id);
  if(!a || !visible(a)) return notFound('#top','目次へ');
  const cat = CATS.find(c=>c.key===a.cat);
  const s = SIDE[a.side];
  const head = `<div class="ahead ${s?s.c:(a.ch?'plain chap':'plain')}"${a.ch?` style="--chc:${a.ch}"`:''}><div class="wrap">
     <a class="back" href="#cat-${a.cat}">← ${cat.name}へ</a>
     <h2>${a.title}${a.spoiler?'<span class="badge sp">ネタバレ</span>':''}</h2>
     <p class="lede">${a.lede}</p>
     ${s?`<span class="sidechip ${s.c}"><i></i>${s.t}</span>`:''}${a.ch?`<span class="chtag"><i></i>物語の展開</span>`:''}
   </div></div>`;
  return `${head}<div class="wrap article">
  ${a.media ? a.media() : ''}
  ${pWrap(paras(a.body))}
  ${a.stages ? stages() : ''}
  ${a.elements ? elements(a) : ''}
  ${(a.figs||[]).map(([k,c])=>fig(k,c)).join('')}
  ${a.speciesCards ? speciesCards(a) : a.chart ? orgChart(a.chart) : (a.elements||a.hideSections ? '' : renderSections(a.sections))}
  ${a.pyramid ? pyramids(a.pyramid) : ''}
  ${a.spx && full() ? `<div class="core"><span class="tag">ネタバレ ／ 物語の核心</span>${pWrap(a.spx)}</div>` : ''}
  </div>`;
}

function renderNovel(id){
  id = Number(id);
  const idx = NOVEL.findIndex(n=>n.id===id), n = NOVEL[idx];
  if(!n) return notFound('#cat-novel','話一覧へ');
  const prev = NOVEL[idx-1], next = NOVEL[idx+1];
  return `<div class="wrap page article">
  <a class="back" href="#cat-novel">← 話一覧へ</a>
  <div class="novel-head" style="--chc:${n.ch||'transparent'}"><div class="num">EPISODE ${String(n.id).padStart(2,'0')}</div><h2>${n.title}</h2><div class="lede" style="margin:0">${n.date}</div>${n.chName?`<span class="chtag" style="--chc:${n.ch}"><i></i>${n.chName}</span>`:''}</div>
  <div class="novel-text">${n.text.split('\n').map(l=> l.trim()===''? '<div class="gap"></div>' : `<p>${l}</p>`).join('')}</div>
  <nav class="novelnav"><span>${prev?`<a href="#novel-${prev.id}">← 第${prev.id}話</a>`:''}</span><span>${next?`<a href="#novel-${next.id}">第${next.id}話 →</a>`:'続きは準備中'}</span></nav>
  </div>`;
}

function renderSearch(){
  const q = lastQuery, res = search(q);
  return `<div class="wrap page"><div class="ahead plain"><a class="back" href="#top">← 目次へ</a><h2>検索結果</h2>
  <p class="lede">${q ? `「${esc(q)}」に一致する項目 ${res.length}件` : '上の検索欄に言葉を入れてください。'}</p></div>
  ${res.length ? `<ul class="alist">${res.map(r=>`<li><a href="${r.href}"><span><span class="ty">${r.ty}</span><span class="t">${esc(r.title)}</span><div class="l">${snippet(r.text,q)}</div></span></a></li>`).join('')}</ul>`
   : (q ? '<p>別の言葉で検索するか、目次から探してください。</p>' : '')}</div>`;
}

const app = document.getElementById('app');

function router(){
  const h = (location.hash||'').replace('#','');
  let out, active='';
  if(h.startsWith('cat-')){ active=h.slice(4); out = renderCategory(active); }
  else if(h.startsWith('novel-')){ active='novel'; out = renderNovel(h.slice(6)); }
  else if(h.startsWith('a-')){ const a=ARTICLES.find(x=>x.id===h.slice(2)); active=a?a.cat:''; out = renderArticle(h.slice(2)); }
  else if(h==='search') out = renderSearch();
  else { active='all'; out = renderHome(); }
  app.innerHTML = out;
  app.querySelectorAll('.catcard,.spc,.elc,.stg,.dept,.alist li').forEach((e,i)=>e.style.setProperty('--i', Math.min(i,14)));
  app.querySelectorAll('.novel-text p').forEach((e,i)=>e.style.setProperty('--n', Math.min(i,24)));
  paintNav(active); paintSpoil();
  window.scrollTo(0,0);
}
document.querySelector('[data-logo]').innerHTML = LOGO;
document.body.insertAdjacentHTML('afterbegin', DRAGON_SYMBOLS);
/* =========================================================
   ページ切り替えの演出：行き先によって変える
   light  … 光の側（PHS）の記録：左上から光が差し、その光の中から現れる
   dark   … 闇の側（デイテッド）の記録：右から闇が満ち、赤い縁を残して開く
   chapter… 物語の章：章の色の帯が横切る
   novel  … 小説：灯りが落ち、一行ずつ浮かび上がる
   wing   … それ以外：あなたの種族の翼（翼のない種族はしっぽ）が属性の色でふぁさっと横切り、その後ろから次のページ
   ========================================================= */
function transitionFor(h){
  if(h.startsWith('a-')){ const a = ARTICLES.find(x=>x.id===h.slice(2));
    if(a && visible(a)){ if(a.side) return {t:a.side}; if(a.ch) return {t:'chapter', c:a.ch}; } }
  if(h.startsWith('novel-')){ const n = NOVEL.find(x=>String(x.id)===h.slice(6)); return {t:'novel', c:n&&n.ch}; }
  return {t:'wing'};
}
const fx = document.getElementById('fx');
function wingFx(){
  // 画面の外にある肩から、翼が弧を描いて閉じてくる。翼の下に影が落ち、二度はばたいて、また外へ開いていく
  const d = (me && dragonByName(me.sp)) || DRAGONS[0];
  const g = me ? GEMS[me.el] : null;
  const style = g ? `--wc:${g.c};--wg:${g.g}` : `--wc:var(--ink);--wg:transparent`;
  const hasWing = d.parts.includes('wr');
  const R = hasWing ? `<svg viewBox="${d.x+d.w/2} ${d.y} ${d.w/2} ${d.h*0.8}"><g fill="currentColor"><use href="#dgp-${d.k}-wr"/></g></svg>`
                    : `<svg class="tl" viewBox="${d.x} ${d.y} ${d.w} ${d.h}"><g fill="currentColor"><use href="#dgp-${d.k}-body"/></g></svg>`;
  const L = hasWing ? `<svg viewBox="${d.x} ${d.y} ${d.w/2} ${d.h*0.8}"><g fill="currentColor"><use href="#dgp-${d.k}-wl"/></g></svg>`
                    : `<svg class="tr" viewBox="${d.x} ${d.y} ${d.w} ${d.h}"><g fill="currentColor"><use href="#dgp-${d.k}-body"/></g></svg>`;
  return `<div class="wingfx${hasWing?'':' tail'}" style="${style}"><i class="shade"></i>
    <div class="arm l">${R}</div><div class="arm r">${L}</div></div>`;
}
function playFx(v){
  fx.className = 'fx'; fx.style.removeProperty('--fxc');
  if(v.c) fx.style.setProperty('--fxc', v.c);
  fx.innerHTML = v.t==='wing' ? wingFx() : v.t==='chapter' ? '<i></i>' : '';
  void fx.offsetWidth; fx.classList.add('fx-'+v.t, 'go');
  clearTimeout(playFx.tm); playFx.tm = setTimeout(()=>{ fx.className = 'fx'; fx.innerHTML = ''; }, 1250);
}
function navigate(){
  const h = (location.hash||'').replace('#','');
  if(reduce() || !intro.hidden){ router(); return; }
  const v = transitionFor(h);
  root.dataset.vt = v.t;
  if(v.c) root.style.setProperty('--vtc', v.c); else root.style.removeProperty('--vtc');
  playFx(v);
  if(document.startViewTransition){
    const tr = document.startViewTransition(router);
    tr.finished.finally(()=>{ delete root.dataset.vt; });
  } else {
    router(); app.classList.remove('enter'); void app.offsetWidth; app.classList.add('enter');
    setTimeout(()=>{ delete root.dataset.vt; }, 1000);
  }
}
window.addEventListener('hashchange', navigate);
paintTheme();
applyMe();
router();
if(!spoilMode){ afterSpoiler = (!me && store.get('eikou-skip')!=='1') ? 'who' : null; openIntro('spoiler'); }
else if(!me && store.get('eikou-skip')!=='1') openIntro('who');
</script>
