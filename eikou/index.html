<title>エイコウ 設定資料集</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700;800&family=Noto+Sans+JP:wght@400;500;700&family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
<style>
/* 人の世界から竜の世界へ。
   紙面は一続きの面（光＝やわらかな紙、闇＝墨色）。白黒の塊で区切らず、光と闇は線と印で示す。
   選んだ属性の色（--acc）が、背景・線・操作部分をうっすら染める。 */
@property --acc{syntax:'<color>';inherits:true;initial-value:#8a8984}
:root{
  --acc:#8a8984;
  --paper0:#f3f2ee; --panel0:#fbfbf8; --line0:#dbdad3; --ink:#1c1c1e; --mute:#686761; --soft0:#e9e8e2; --text2:#36352f;
  --c-far:#dcdbd5; --c-near:#c6c5be; --c-win:#ecebe5; --drg:#2a2a2c;
  --logo-filter:invert(1); --logo-filter-rev:none;
  --G:#e2a90b; --Gt:#8a5e00; --R:#cc1a31; --Rt:#b3112b;
  --accmix:#000; --accamt:24%; --mixw:0%;
  --f-display:'Shippori Mincho B1','Hiragino Mincho ProN','Yu Mincho',serif;
  --f-body:'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif;
  --f-latin:'Cinzel','Times New Roman',serif;
  color-scheme:light;
  transition:--acc 1.4s ease;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper0:#18181b; --panel0:#1f1f23; --line0:#323238; --ink:#e7e6e1; --mute:#9c9b95; --soft0:#26262b; --text2:#cfcec8;
  --c-far:#222227; --c-near:#2b2b31; --c-win:#36363d; --drg:#d6d5cf;
  --logo-filter:none; --logo-filter-rev:invert(1);
  --Gt:#f0c24a; --Rt:#ff6a78; --accmix:#fff; --accamt:32%; --mixw:38%;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper0:#18181b; --panel0:#1f1f23; --line0:#323238; --ink:#e7e6e1; --mute:#9c9b95; --soft0:#26262b; --text2:#cfcec8;
  --c-far:#222227; --c-near:#2b2b31; --c-win:#36363d; --drg:#d6d5cf;
  --logo-filter:none; --logo-filter-rev:invert(1);
  --Gt:#f0c24a; --Rt:#ff6a78; --accmix:#fff; --accamt:32%; --mixw:38%;
  color-scheme:dark}
:root{
  --paper:color-mix(in oklab,var(--paper0),var(--acc) 6%);
  --panel:color-mix(in oklab,var(--panel0),var(--acc) 3%);
  --line:color-mix(in oklab,var(--line0),var(--acc) 18%);
  --soft:color-mix(in oklab,var(--soft0),var(--acc) 8%);
  --acc-t:color-mix(in oklab,var(--acc),var(--accmix) var(--accamt));
  --acc-soft:color-mix(in oklab,var(--acc) 16%,transparent);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);line-height:1.9;font-size:15px}
::selection{background:var(--acc-soft)}
a{color:inherit}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--acc-t);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:880px;margin:0 auto;padding-inline:20px}
.latin{font-family:var(--f-latin);letter-spacing:.24em;text-transform:uppercase}

/* ---------- header ---------- */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in oklab,var(--paper) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hbar{max-width:880px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;flex:none}
.brand-logo svg{width:88px;height:37px;display:block;filter:var(--logo-filter)}
.brand-sub{font-family:var(--f-display);font-weight:700;font-size:12px;letter-spacing:.16em;color:var(--mute);white-space:nowrap}
.search{position:relative;flex:1 1 auto;min-width:0;max-width:300px;margin-left:auto}
.search input{width:100%;font:inherit;font-size:14px;padding:7px 12px 7px 32px;border:1px solid var(--line);border-radius:0;background:var(--panel);color:var(--ink)}
.search input:focus{border-color:var(--acc-t);outline:none}
.search .ico{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--mute);pointer-events:none}
.suggest{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--panel);border:1px solid var(--line);list-style:none;margin:0;padding:4px 0;max-height:60vh;overflow:auto;box-shadow:0 10px 28px rgba(0,0,0,.14)}
.suggest li a{display:flex;gap:10px;align-items:baseline;padding:7px 12px;text-decoration:none;font-size:14px;line-height:1.5}
.suggest li a:hover,.suggest li a.act{background:var(--soft)}
.ty{flex:none;font-size:10px;letter-spacing:.1em;border:1px solid var(--line);color:var(--mute);padding:0 5px;font-weight:400}
.suggest .tt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.suggest .empty{padding:8px 12px;font-size:13px;color:var(--mute)}
mark{background:var(--acc-soft);color:var(--ink);font-weight:700}
.hbtn{flex:none;height:36px;display:flex;align-items:center;gap:6px;padding:0 10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;font:inherit;font-size:12px;white-space:nowrap}
.hbtn:hover{border-color:var(--acc-t)}
.hbtn svg{width:16px;height:16px;flex:none}
.spoil-pill i{width:7px;height:7px;border-radius:50%;border:1px solid currentColor;display:block}
.spoil-pill.on i{background:currentColor}
.who-pill .gem-ic{width:14px;height:17px}
.catnav{max-width:880px;margin:0 auto;padding:0 20px;display:flex;gap:22px;overflow-x:auto;scrollbar-width:none}
.catnav::-webkit-scrollbar{display:none}
.catnav a{flex:none;font-size:13px;text-decoration:none;color:var(--mute);padding:6px 0 9px;border-bottom:2px solid transparent;white-space:nowrap}
.catnav a:hover{color:var(--ink)}
.catnav a.on{color:var(--ink);border-bottom-color:var(--acc-t)}
.spoilbar{background:var(--soft);color:var(--ink);font-size:12px;text-align:center;padding:5px 16px;letter-spacing:.06em;border-top:1px solid var(--line)}
.spoilbar b{color:var(--Rt)}
.spoilbar button{background:none;border:0;color:var(--mute);font:inherit;text-decoration:underline;text-underline-offset:3px;cursor:pointer;margin-left:10px;padding:0}
@media (max-width:640px){
  .hbar{flex-wrap:wrap;gap:8px}
  .search{order:3;flex-basis:100%;max-width:none}
  .who-pill{margin-left:auto}
  .brand-sub{display:none}
  .hbtn .lbl-long{display:none}
  .bar-long{display:none}
}

/* ---------- 街（人の世界／竜の世界で同じ景色） ---------- */
.city{display:block;width:100%;height:100%}
.city .far{fill:var(--c-far)} .city .near{fill:var(--c-near)} .city .win{fill:var(--c-win)}
.city .drg{color:var(--drg);opacity:0;transition:opacity 1.8s ease var(--d,0s)}
:root[data-awake] .city .drg{opacity:var(--o,.5)}
.city .fly{animation:fly var(--t,9s) ease-in-out infinite alternate}
@keyframes fly{from{transform:translate(0,0)}to{transform:translate(var(--dx,14px),var(--dy,-8px))}}

/* ---------- hero ---------- */
.hero{position:relative;text-align:center;padding:52px 20px 0;border-bottom:1px solid var(--line);overflow:hidden}
.hero-logo svg{width:min(100%,440px);height:auto;aspect-ratio:54.98/22.83;display:block;margin:0 auto;filter:var(--logo-filter);position:relative;z-index:1}
.epic{margin:22px 0 0;font-family:var(--f-display);font-weight:800;font-size:clamp(21px,4.6vw,32px);letter-spacing:.42em;padding-left:.42em;position:relative;z-index:1}
.hero .kicker{margin:8px 0 0;font-size:12px;letter-spacing:.5em;padding-left:.5em;color:var(--mute);position:relative;z-index:1}
.hero .scene{height:clamp(150px,24vw,230px);margin:14px -20px 0}
.hero .note{position:absolute;left:0;right:0;bottom:12px;font-size:11px;color:var(--mute);letter-spacing:.1em}
.hero .note button{all:unset;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* ---------- 光と闇の陣営 ---------- */
.factions{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:880px;margin:28px auto 0;padding-inline:20px}
.fac{display:flex;flex-direction:column;gap:8px;padding:26px 24px 22px;text-decoration:none;min-width:0;position:relative;background:var(--panel);border:1px solid var(--line)}
.fac.light{border-top:3px solid var(--G);background:radial-gradient(ellipse 70% 80% at 0% 0%,color-mix(in oklab,var(--G) 12%,transparent),transparent 70%),var(--panel)}
.fac.dark{border-top:3px solid var(--R);text-align:right;align-items:flex-end;background:radial-gradient(ellipse 70% 80% at 100% 0%,color-mix(in oklab,var(--R) 10%,transparent),transparent 70%),var(--panel)}
.fac .el{font-size:11px}
.fac.light .el,.fac.light .lead b{color:var(--Gt)}
.fac.dark .el,.fac.dark .lead b{color:var(--Rt)}
.fac .logo svg{display:block;height:58px;width:auto}
.fac.light .logo svg{filter:var(--logo-filter)}
.fac.dark .logo svg{filter:var(--logo-filter-rev)}
.fac .nm{font-family:var(--f-display);font-weight:800;font-size:23px;line-height:1.3}
.fac .ds{font-size:13px;line-height:1.75;max-width:22em;color:var(--text2)}
.fac .lead{font-size:12px;border-top:1px solid var(--line);padding-top:10px;margin-top:4px;width:100%;color:var(--mute)}
.fac .lead b{font-weight:700}
.fac:hover .nm{text-decoration:underline;text-underline-offset:6px;text-decoration-thickness:1px}
@media (max-width:600px){.factions{grid-template-columns:1fr}.fac.dark{text-align:left;align-items:flex-start}}

/* ---------- section headings ---------- */
.sec-h{display:flex;align-items:center;gap:14px;margin:46px 0 18px}
.sec-h h2{margin:0;font-size:20px}
.sec-h .rule{flex:1;height:1px;background:linear-gradient(90deg,var(--acc-t),var(--line) 50%)}
.yy{width:18px;height:18px;flex:none;color:var(--ink)}

/* ---------- category catalog ---------- */
.cgroup{margin-top:26px}
.cgroup:first-of-type{margin-top:0}
.cg-h{display:flex;align-items:baseline;gap:12px;margin:0 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.cg-h .jp{font-family:var(--f-display);font-weight:800;font-size:15px}
.cg-h .en{font-size:10px;color:var(--mute)}
.catgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.catcard{display:flex;flex-direction:column;gap:4px;padding:18px 16px;text-decoration:none;min-width:0;background:var(--panel);border:1px solid var(--line);position:relative;transition:border-color .2s,transform .2s,box-shadow .2s}
.catcard .ic{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;margin-bottom:8px;position:relative;overflow:hidden;box-shadow:inset 0 0 0 1px var(--line);transition:transform .5s}
.catcard .ic::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 50%,var(--soft) 50%)}
.catcard .ic svg{width:30px;height:30px;position:relative;color:color-mix(in srgb,var(--cc,var(--ink)),#fff var(--mixw));transition:transform .5s}
.catcard[data-k="org"] .ic svg{color:var(--ink)}
.catcard .name{font-family:var(--f-display);font-weight:800;font-size:17px;line-height:1.45;display:block}
.catcard .desc{font-size:13px;color:var(--mute);line-height:1.65;display:block}
.catcard:hover,.catcard:focus-visible{border-color:var(--acc-t);transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.08)}
.catcard:hover .ic{transform:rotate(180deg)}
.catcard:hover .ic svg{transform:rotate(-180deg)}
@media (max-width:760px){.catgrid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:420px){
  .catgrid{grid-template-columns:1fr;gap:8px}
  .catcard{flex-direction:row;align-items:center;gap:14px;padding:12px 14px}
  .catcard .ic{margin:0;flex:none;width:42px;height:42px}
  .catcard .txt{min-width:0}
}
.teaser{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:start;border:1px solid var(--line);border-left:3px solid var(--chc,var(--line));background:var(--panel);padding:24px;text-decoration:none}
.teaser .num{font-family:var(--f-latin);font-size:46px;line-height:1}
.teaser .ttl{font-family:var(--f-display);font-weight:800;font-size:20px}
.teaser .ex{font-family:var(--f-display);color:var(--text2);font-size:15px;line-height:2;margin:8px 0 6px;display:block}
.teaser .go{font-size:12px;color:var(--mute)}
.teaser:hover .ttl{text-decoration:underline;text-underline-offset:5px}
@media (max-width:480px){.teaser{grid-template-columns:1fr;gap:8px}}

/* ---------- pages ---------- */
main{padding-block:0 40px}
.page{padding-top:26px}
h2{font-family:var(--f-display);font-size:26px;font-weight:800;line-height:1.45;margin:10px 0 4px;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:800;font-size:17px;margin:30px 0 8px;display:flex;align-items:center;gap:10px}
h3::before{content:"";width:10px;height:10px;border-radius:50%;flex:none;background:linear-gradient(90deg,var(--ink) 50%,transparent 50%);border:1px solid var(--ink)}
.lede{color:var(--mute);font-size:14px;margin:0 0 20px}
.back{font-size:13px;color:var(--mute);text-decoration:none}
.back:hover{color:var(--ink)}
.ahead{padding:28px 0 22px;margin-bottom:26px;border-bottom:1px solid var(--line)}
.ahead .lede{margin-bottom:0}
.ahead.light{border-top:2px solid var(--G);background:linear-gradient(180deg,color-mix(in oklab,var(--G) 7%,transparent),transparent 80%)}
.ahead.dark{border-top:2px solid var(--R);background:linear-gradient(180deg,color-mix(in oklab,var(--R) 7%,transparent),transparent 80%)}
.ahead.chap{border-top:2px solid var(--chc)}
.ahead .cat-ic{width:30px;height:30px;display:block;margin:14px 0 -4px;color:color-mix(in srgb,var(--cc,var(--ink)),#fff var(--mixw))}
.ahead .cat-ic[data-k="org"]{color:var(--ink)}
.ahead .cat-ic svg{width:100%;height:100%;display:block}
.sidechip{display:inline-flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.12em;margin-top:12px;padding:3px 10px;border:1px solid}
.sidechip i{width:9px;height:9px;border-radius:50%;border:1px solid currentColor;display:block}
.sidechip.dark i{background:currentColor}
.sidechip.light{color:var(--Gt);border-color:var(--G)}
.sidechip.dark{color:var(--Rt);border-color:var(--R)}
.chtag{display:inline-flex;align-items:center;gap:7px;font-size:11px;letter-spacing:.1em;margin-top:12px;color:var(--mute)}
.chtag i{width:18px;height:3px;background:var(--chc);display:block}

.alist{list-style:none;padding:0;margin:0;border-top:1px solid var(--ink)}
.alist li{border-bottom:1px solid var(--line)}
.alist a{display:flex;gap:12px;align-items:flex-start;padding:14px 2px;text-decoration:none}
.alist .dot{width:9px;height:9px;border-radius:50%;border:1px solid var(--ink);flex:none;margin-top:9px}
.alist .dot.light{border-color:var(--G)}
.alist .dot.dark{border-color:var(--R);background:var(--R)}
.alist .dot.none{border-style:dotted;border-color:var(--mute)}
.alist .dot.ch{border:0;background:var(--chc);width:10px;height:10px}
.alist .t{font-weight:700}
.alist a:hover .t{text-decoration:underline;text-underline-offset:4px;text-decoration-color:var(--acc-t)}
.alist .l{font-size:12px;color:var(--mute);margin-top:2px;line-height:1.6}
.alist .ty{margin-right:8px;vertical-align:2px}
.badge{display:inline-block;font-size:10px;letter-spacing:.14em;background:var(--ink);color:var(--paper);padding:1px 6px;margin-left:8px;vertical-align:2px;font-weight:500}
.badge.sp{background:none;color:var(--ink);border:1px solid var(--ink)}

.article p{margin:0 0 14px;max-width:40em}
.spoilp{border-left:3px solid var(--ink);padding-left:14px}
.spoilp::before{content:"ネタバレ";display:block;font-size:10px;letter-spacing:.16em;color:var(--mute)}
figure{margin:24px 0;border:1px solid var(--line);background:var(--panel)}
figure img{display:block;width:100%;height:auto;background:#fff}
figcaption{font-size:12px;color:var(--mute);padding:8px 12px;border-top:1px solid var(--line)}
.org-logo{display:inline-block;padding:16px 22px;margin:4px 0 18px;border:1px solid var(--line);background:var(--panel)}
.org-logo svg{display:block;height:68px;width:auto}
.org-logo.light svg{filter:var(--logo-filter)}
.org-logo.dark svg{filter:var(--logo-filter-rev)}

dl.gloss{margin:0;border-top:1px solid var(--ink)}
dl.gloss div{display:grid;grid-template-columns:9em 1fr;gap:14px;padding:12px 2px;border-bottom:1px solid var(--line)}
dl.gloss dt{font-family:var(--f-display);font-weight:800}
dl.gloss dd{margin:0;font-size:14px;color:var(--text2);min-width:0}
@media (max-width:520px){dl.gloss div{grid-template-columns:1fr;gap:2px}}

.core{background:var(--soft);padding:18px 20px;margin:26px 0;border:1px solid var(--line);border-left:3px solid var(--Rt)}
.core .tag{display:block;font-size:11px;letter-spacing:.2em;color:var(--Rt);margin-bottom:10px}
.core p{font-size:14px}
.core p:last-child{margin-bottom:0}

/* 竜化の五段階 */
.stages{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:22px 0 6px}
.stg{margin:0;border:1px solid var(--line);background:var(--panel);padding:12px 8px 12px;text-align:center;min-width:0}
.stg svg{width:100%;max-width:120px;aspect-ratio:1;display:block;margin:0 auto;color:var(--ink)}
.stg figcaption{border:0;padding:6px 0 0;display:flex;flex-direction:column;gap:1px;line-height:1.5}
.stg b{font-family:var(--f-display);font-size:17px;color:var(--ink)}
.stg .pc{font-family:var(--f-latin);font-size:13px;color:var(--ink);letter-spacing:.06em}
.stg span{font-size:11px;color:var(--mute)}
.stnote{font-size:12px;color:var(--mute);margin:0 0 18px}
@media (max-width:600px){.stages{grid-template-columns:repeat(3,1fr)}}
@media (max-width:380px){.stages{grid-template-columns:repeat(2,1fr)}}

.rowlist{border-top:1px solid var(--ink)}
.rowlist .row{display:flex;justify-content:space-between;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line);font-size:14px}
.rowlist .k{color:var(--mute);font-variant-numeric:tabular-nums}

.novel-text{font-family:var(--f-display);font-size:16.5px;line-height:2.2;max-width:34em;margin-inline:auto}
.novel-text p{margin:0}
.novel-text .gap{height:1.1em}
.novel-head{text-align:center;padding:40px 0 30px;margin-bottom:30px;border-bottom:1px solid var(--line);border-top:2px solid var(--chc,transparent)}
.novel-head .num{font-family:var(--f-latin);font-size:13px;letter-spacing:.3em;color:var(--mute)}
.novel-head h2{font-family:var(--f-latin);font-size:30px;letter-spacing:.2em;margin:6px 0}
.novelnav{display:flex;justify-content:space-between;gap:12px;margin:40px auto 0;max-width:34em;padding-top:16px;border-top:1px solid var(--line);font-size:13px}

.login{display:flex;gap:8px;flex-wrap:wrap;max-width:360px;margin-top:8px}
.login input{font:inherit;font-size:14px;padding:7px 10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);min-width:0;flex:1 1 180px}
.login button,.btn{font:inherit;font-size:13px;padding:7px 16px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);cursor:pointer}
.login .msg{font-size:12px;color:var(--mute);width:100%}

footer{max-width:880px;margin:0 auto;padding:30px 20px 56px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--mute);font-size:11px}
footer a,footer button{color:var(--mute);text-decoration:none;background:none;border:0;font:inherit;cursor:pointer;padding:0}
footer a:hover,footer button:hover{color:var(--ink)}
footer .links{display:flex;gap:16px}

/* ---------- 所属図 ---------- */
.orgchart{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:24px 0}
.dept{border:1px solid var(--line);background:var(--panel);border-top:2px solid var(--fc);min-width:0}
.dept-h{padding:14px 16px 12px;border-bottom:1px solid var(--line)}
.dept-h .n{font-family:var(--f-display);font-weight:800;font-size:19px;line-height:1.4}
.dept-h .d{font-size:12px;color:var(--mute);line-height:1.6;margin-top:2px}
.dept ul{list-style:none;margin:0;padding:6px 16px 12px}
.dept li{padding:8px 0 8px 14px;border-bottom:1px dashed var(--line);position:relative}
.dept li:last-child{border-bottom:0}
.dept li::before{content:"";position:absolute;left:0;top:15px;width:6px;height:6px;transform:rotate(45deg);background:var(--ink)}
.dept li b{display:block;font-size:14px}
.dept li span{display:block;font-size:12px;color:var(--mute);line-height:1.6}
.f-light{--fc:var(--G)} .f-dark{--fc:var(--R)}
@media (max-width:720px){.orgchart{grid-template-columns:1fr}}

/* ---------- 階級ピラミッド ---------- */
.pyrs{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:12px;margin:24px 0}
.pyr{padding:20px 16px 16px;min-width:0;background:var(--panel);border:1px solid var(--line);border-top:2px solid var(--fc)}
.pyr .ph{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px;font-size:12px}
.pyr .ph b{font-family:var(--f-display);font-size:17px}
.pyr.f-light .ph span{color:var(--Gt)} .pyr.f-dark .ph span{color:var(--Rt)}
.tiers{display:flex;flex-direction:column;align-items:center;gap:5px}
.tier{width:calc(30% + var(--i) * 14%);min-height:40px;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:clamp(13px,2.4vw,16px);
  clip-path:polygon(12px 0,calc(100% - 12px) 0,100% 100%,0 100%);padding:6px 14px;text-align:center;line-height:1.3;
  background:color-mix(in oklab,var(--ink) calc(70% - var(--i) * 11%),var(--panel));color:var(--paper)}
.tier:nth-child(n+4){color:var(--ink)}
.tier.top{clip-path:polygon(50% 0,100% 100%,0 100%);width:30%;min-height:46px;padding-top:16px;background:var(--fc);color:#fff}
.pyr.f-light .tier.top{color:#2a1d00}
.pyr .foot{font-size:11px;text-align:center;margin-top:10px;color:var(--mute)}
@media (max-width:600px){.pyrs{grid-template-columns:1fr}}

/* ---------- 属性 ---------- */
.elgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:24px 0}
.elc{border:1px solid var(--line);border-top:2px solid var(--ec);background:var(--panel);padding:16px 14px 14px;min-width:0;position:relative}
.elc .k{font-family:var(--f-display);font-weight:800;font-size:34px;line-height:1.1;display:block;margin-bottom:8px;color:color-mix(in srgb,var(--ec),#fff var(--mixw))}
.elc.light .k{color:var(--Gt)}
.elc p{margin:0;font-size:13px;line-height:1.7;color:var(--text2)}
.elc .tag{position:absolute;top:12px;right:12px;font-size:10px;letter-spacing:.12em;color:var(--mute)}
.elc.mine{box-shadow:0 0 0 1px var(--acc-t)}
.elc.mine::after{content:"あなた";position:absolute;top:12px;right:12px;font-size:10px;color:var(--acc-t);letter-spacing:.1em}
@media (max-width:720px){.elgrid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:380px){.elgrid{grid-template-columns:1fr}}

/* ---------- 種族カード ---------- */
.spgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin:16px 0 24px}
.spc{border:1px solid var(--line);background:var(--panel);padding:14px;min-width:0;position:relative;display:flex;flex-direction:column;gap:6px}
.spc svg{width:100%;height:88px;color:var(--ink);display:block}
.spc b{font-family:var(--f-display);font-size:17px}
.spc p{margin:0;font-size:12.5px;line-height:1.7;color:var(--text2)}
.spc.mine{box-shadow:0 0 0 1px var(--acc-t)}
.spc.mine svg{color:var(--acc-t)}
.spc.mine::after{content:"あなた";position:absolute;top:10px;right:12px;font-size:10px;color:var(--acc-t);letter-spacing:.1em}
.spc.special{border-style:dashed}

/* =========================================================
   入口：ネタバレ選択 → あなたは何者？ → アクセサリー → 竜化 → 見えるようになる
   ========================================================= */
.intro{position:fixed;inset:0;z-index:50;background:var(--paper);display:flex;flex-direction:column;overflow:auto;
  padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px))}
.intro .scene{position:fixed;left:0;right:0;bottom:0;height:min(42vh,320px);pointer-events:none;z-index:0}
.intro .stage{position:relative;z-index:1;margin:auto;width:100%;max-width:760px;text-align:center;padding-bottom:min(22vh,160px)}
.intro .skip{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:16px;z-index:2;font:inherit;font-size:12px;color:var(--mute);background:none;border:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.intro .q{font-family:var(--f-display);font-weight:800;font-size:clamp(26px,6vw,40px);letter-spacing:.12em;margin:0}
.intro .sub{color:var(--mute);font-size:13px;margin:6px 0 24px}
.fade-in{animation:fadeIn .7s ease both}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ネタバレ選択（人の世界：普通のWebサイトの顔） */
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px;text-align:left}
.modes.three{grid-template-columns:repeat(3,1fr)}
.qopts{display:grid;gap:10px;max-width:520px;margin:0 auto;text-align:left}
.qprog{font-size:12px;color:var(--mute);letter-spacing:.2em;margin-bottom:10px}
.qbar{height:2px;background:var(--line);max-width:520px;margin:0 auto 22px}
.qbar i{display:block;height:100%;background:var(--ac,var(--ink));transition:width .35s}
.rline{font-family:var(--f-display);font-weight:800;font-size:clamp(22px,5.4vw,34px);letter-spacing:.2em;margin:10px 0;min-height:1.4em}
.rline.sm{font-size:13px;font-weight:400;letter-spacing:.1em;color:var(--mute)}
.mode{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:6px;padding:22px 20px;background:var(--panel);border:1px solid var(--line);transition:border-color .2s,transform .2s}
.mode:hover,.mode:focus-visible{border-color:var(--ink);transform:translateY(-2px)}
.mode .big{font-family:var(--f-display);font-weight:800;font-size:24px}
.mode .who{font-size:13px;font-weight:700}
.mode .txt{font-size:13px;color:var(--mute);line-height:1.7}
.mode .warn{align-self:flex-start;font-size:11px;border:1px solid var(--Rt);color:var(--Rt);padding:1px 8px;margin-top:4px}
@media (max-width:560px){.modes{grid-template-columns:1fr}
  .modes.three{grid-template-columns:1fr}}

/* あなたは何者？ */
.attrs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;text-align:left}
.attr{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:6px;padding:16px 14px;background:var(--panel);border:1px solid var(--line);transition:border-color .25s,transform .25s,background .25s}
.attr svg{width:28px;height:28px;color:var(--ink);transition:color .25s}
.attr b{font-family:var(--f-display);font-size:20px;line-height:1.2}
.attr span{font-size:12px;color:var(--mute);line-height:1.6}
.attr:hover,.attr:focus-visible{border-color:var(--ac);transform:translateY(-2px)}
.attr:hover svg,.attr:focus-visible svg{color:var(--ac)}
.attr.chosen{border-color:var(--ac);background:color-mix(in oklab,var(--panel),var(--ac) 10%)}
.attr.chosen svg{color:var(--ac)}
.attrs.locked .attr:not(.chosen){opacity:.35;pointer-events:none}
@media (max-width:640px){.attrs{grid-template-columns:repeat(2,1fr)}.attr b{font-size:18px}}

/* アクセサリー（宝石） */
.gemwrap{position:relative;width:180px;height:220px;margin:0 auto}
.gemwrap .rays{position:absolute;inset:-90px;border-radius:50%;opacity:0;
  background:repeating-conic-gradient(from 0deg,color-mix(in oklab,var(--gemg) 55%,transparent) 0 4deg,transparent 4deg 18deg);
  -webkit-mask:radial-gradient(circle,#000 18%,transparent 62%);mask:radial-gradient(circle,#000 18%,transparent 62%)}
.gemwrap .halo{position:absolute;inset:-40px;border-radius:50%;opacity:0;background:radial-gradient(circle,color-mix(in oklab,var(--gemg) 60%,transparent),transparent 65%)}
.gemwrap svg{position:relative;width:100%;height:100%;overflow:visible}
.gem-in{animation:gemIn 1s cubic-bezier(.2,.8,.2,1) both}
@keyframes gemIn{from{opacity:0;transform:translateY(-40px) scale(.7)}to{opacity:1;transform:none}}
.glow .rays{animation:rays 2.2s ease forwards, spin 14s linear infinite}
.glow .halo{animation:halo 2.2s ease forwards}
.glow svg{animation:gemGlow 2.2s ease forwards}
@keyframes rays{to{opacity:.9}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes halo{0%{opacity:0}60%{opacity:1}100%{opacity:.85}}
@keyframes gemGlow{0%{filter:none}100%{filter:drop-shadow(0 0 18px var(--gemg)) drop-shadow(0 0 40px var(--gemg)) brightness(1.15)}}
.gemwrap svg.iri{animation:iri 6s linear infinite}
.glow svg.iri{animation:gemGlow 2.2s ease forwards, iri 6s linear infinite}
@keyframes iri{to{filter:hue-rotate(360deg)}}
.line1{font-family:var(--f-display);font-weight:800;font-size:clamp(20px,4.6vw,28px);letter-spacing:.2em;margin:26px 0 4px;min-height:1.5em}
.line2{color:var(--mute);font-size:13px;min-height:1.6em}

/* 竜化 */
.dragon-stage{position:relative;width:min(78vw,340px);aspect-ratio:1;margin:0 auto}
.dragon-stage .halo{position:absolute;inset:-10%;border-radius:50%;background:radial-gradient(circle,color-mix(in oklab,var(--gemg) 45%,transparent),transparent 62%)}
.dragon-stage svg{position:absolute;inset:8%;width:84%;height:84%;color:var(--gem);overflow:visible}
.dragon-stage svg.roll{opacity:.4}
.dragon-stage svg.build{filter:drop-shadow(0 0 1px color-mix(in oklab,var(--ink) 55%,transparent))}
.dragon-stage.done svg.build{filter:drop-shadow(0 0 1px color-mix(in oklab,var(--ink) 55%,transparent)) drop-shadow(0 0 14px color-mix(in oklab,var(--gemg) 80%,transparent))}
/* パーツの組み上げ：胴としっぽが伸び → 手足 → 頭 → 翼が肩から開いて二度はばたく */
.build .pt{transform-box:fill-box}
.build .pt-body{transform-origin:50% 100%;animation:ptBody .7s cubic-bezier(.2,.8,.2,1) both}
.build .pt-other{transform-origin:50% 50%;animation:ptPop .4s ease .45s both}
.build .pt-head{transform-origin:50% 100%;animation:ptHead .5s cubic-bezier(.2,.9,.3,1.3) .65s both}
.build .pt-wl{transform-origin:100% 20%;animation:ptWing 1s cubic-bezier(.2,.9,.25,1.15) .9s both, flapL .5s ease-in-out 1.95s 2}
.build .pt-wr{transform-origin:0% 20%;animation:ptWingR 1s cubic-bezier(.2,.9,.25,1.15) .9s both, flapR .5s ease-in-out 1.95s 2}
@keyframes ptBody{from{transform:scaleY(0);opacity:0}to{transform:none;opacity:1}}
@keyframes ptPop{from{transform:scale(0);opacity:0}to{transform:none;opacity:1}}
@keyframes ptHead{from{transform:translateY(-30%) scale(.6);opacity:0}to{transform:none;opacity:1}}
@keyframes ptWing{from{transform:scaleX(0) rotate(40deg);opacity:0}to{transform:none;opacity:1}}
@keyframes ptWingR{from{transform:scaleX(0) rotate(-40deg);opacity:0}to{transform:none;opacity:1}}
@keyframes flapL{50%{transform:scaleX(.82) rotate(8deg)}}
@keyframes flapR{50%{transform:scaleX(.82) rotate(-8deg)}}
.flash{position:fixed;inset:0;z-index:60;pointer-events:none;background:radial-gradient(circle,#fff,color-mix(in oklab,var(--acc) 60%,#fff) 40%,transparent 75%);opacity:0}
.flash.on{animation:flash 1s ease}
@keyframes flash{0%{opacity:0}20%{opacity:.95}100%{opacity:0}}
.idcard{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--acc-t);background:var(--panel);padding:6px 14px;font-size:13px;margin-top:6px}
.idcard .gem-ic{width:14px;height:17px}
.cta{font:inherit;font-size:14px;padding:10px 26px;border:1px solid var(--acc-t);background:var(--acc-t);color:var(--paper0);cursor:pointer;margin-top:18px;letter-spacing:.1em}
.cta:hover{filter:brightness(1.08)}
.reveal .q{font-size:clamp(22px,5vw,32px)}
/* トップ：あなたの竜の翼がロゴの後ろで開く */
.hero-wings{position:absolute;left:50%;top:18px;width:min(120%,980px);transform:translateX(-50%);color:var(--ink);opacity:.07;pointer-events:none}
.hero-wings svg{display:block;width:100%;height:auto;overflow:visible}
.hero-wings g g{transform-box:fill-box}
.hero-wings .pt-wl{transform-origin:100% 20%;animation:ptWing 1.6s cubic-bezier(.2,.8,.2,1) both}
.hero-wings .pt-wr{transform-origin:0% 20%;animation:ptWingR 1.6s cubic-bezier(.2,.8,.2,1) both}
/* 光と闇の世界を行き来する：横切る翼 */
.sweep{position:fixed;inset:0;z-index:70;pointer-events:none;display:none}
.sweep svg{position:absolute;top:-30vh;height:160vh;width:auto;left:0}
.sweep.to-dark{color:#141417} .sweep.to-light{color:#f3f2ee}
.sweep.go{display:block}
.sweep.go svg{animation:sweep 1.15s cubic-bezier(.55,.05,.45,.95) both}
@keyframes sweep{from{transform:translateX(-110%) rotate(-8deg)}to{transform:translateX(110vw) rotate(6deg)}}
@media (max-width:640px){.intro .stage{padding-top:34px}}

/* =========================================================
   ページ切り替え
   ========================================================= */
main{view-transition-name:page}
header{view-transition-name:hdr}
.fx{view-transition-name:fx}
::view-transition-group(fx){animation:none}
::view-transition-old(fx){display:none}
::view-transition-new(fx){animation:none}
::view-transition-group(hdr){animation:none}
::view-transition-old(page),::view-transition-new(page){animation-duration:.5s;animation-timing-function:cubic-bezier(.3,.7,.2,1)}
/* 翼（通常）：翼が横切ったあとに次のページ */
:root[data-vt="wing"]::view-transition-old(page){animation:vtHide .12s linear .34s both}
:root[data-vt="wing"]::view-transition-new(page){animation:vtShow .15s linear .46s both}
@keyframes vtHide{to{opacity:0}}
@keyframes vtShow{from{opacity:0}to{opacity:1}}
@keyframes vtOut{to{opacity:0;transform:translateY(-6px)}}
@keyframes vtWing{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* 光の側：左上から光が広がる */
:root[data-vt="light"]::view-transition-old(page){animation:vtLightOut .32s ease both}
:root[data-vt="light"]::view-transition-new(page){animation:vtLight .8s cubic-bezier(.25,.8,.25,1) both}
@keyframes vtLightOut{to{opacity:0;filter:brightness(1.8) blur(3px)}}
@keyframes vtLight{from{clip-path:circle(0% at 0% 0%);filter:brightness(1.8)}60%{filter:brightness(1.15)}to{clip-path:circle(150% at 0% 0%);filter:none}}
/* 闇の側：右から闇が満ちる */
:root[data-vt="dark"]::view-transition-old(page){animation:vtDarkOut .4s ease both}
:root[data-vt="dark"]::view-transition-new(page){animation:vtDark .85s cubic-bezier(.6,.05,.25,1) .1s both}
@keyframes vtDarkOut{to{filter:brightness(.2);opacity:0}}
@keyframes vtDark{from{clip-path:inset(0 0 0 100%);filter:brightness(.3)}to{clip-path:inset(0 0 0 0);filter:none}}
/* 章：帯が横切る */
:root[data-vt="chapter"]::view-transition-old(page){animation:vtOut .3s ease both}
:root[data-vt="chapter"]::view-transition-new(page){animation:vtChap .75s cubic-bezier(.5,0,.2,1) .15s both}
@keyframes vtChap{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
/* 小説：灯りを落とす */
:root[data-vt="novel"]::view-transition-old(page){animation:vtNovelOut .45s ease both}
:root[data-vt="novel"]::view-transition-new(page){animation:vtNovelIn .6s ease .35s both}
@keyframes vtNovelOut{to{opacity:0;filter:blur(3px)}}
@keyframes vtNovelIn{from{opacity:0}to{opacity:1}}
:root[data-vt="novel"] .novel-text p{animation:line .7s ease both;animation-delay:calc(.45s + var(--n,0) * 70ms)}
@keyframes line{from{opacity:0;transform:translateY(6px);filter:blur(2px)}to{opacity:1;transform:none;filter:none}}

/* 重ねて流す効果 */
.fx{position:fixed;inset:0;z-index:40;pointer-events:none;display:none}
.fx.go{display:block}
.fx svg{width:100%;height:100%}
/* 翼：静かに閉じて画面を覆い、ひと呼吸だけ揺れて、静かに開く */
.wingfx{position:absolute;inset:0;overflow:hidden;color:var(--wc);--T:1.05s}
.wingfx .shade{position:absolute;inset:0;background:color-mix(in oklab,var(--wc),#000 45%);animation:shade var(--T) ease-in-out both}
@keyframes shade{0%,18%{opacity:0}40%,62%{opacity:1}84%,100%{opacity:0}}
.wingfx .arm{position:absolute;top:30vh;width:0;height:0}
.wingfx .arm.l{left:-14vw;animation:armL var(--T) both}
.wingfx .arm.r{right:-14vw;animation:armR var(--T) both}
.wingfx .arm svg{position:absolute;top:-60vh;height:200vh;width:auto;display:block;overflow:visible;color:var(--wc);
  filter:drop-shadow(0 10px 30px rgba(0,0,0,.25))}
.wingfx .arm.l svg{left:0;transform-origin:0 30%;animation:foldL var(--T) both}
.wingfx .arm.r svg{right:0;transform-origin:100% 30%;animation:foldR var(--T) both}
/* 外 → 閉じる → ひと呼吸 → 開く。どの区間もゆっくり入ってゆっくり止まる */
@keyframes armL{0%{transform:rotate(-22deg);opacity:0;animation-timing-function:cubic-bezier(.4,0,.2,1)}12%{opacity:1}40%{transform:rotate(0);animation-timing-function:ease-in-out}51%{transform:rotate(-3deg);animation-timing-function:ease-in-out}62%{transform:rotate(0);animation-timing-function:cubic-bezier(.4,0,.2,1)}88%{opacity:1}100%{transform:rotate(-22deg);opacity:0}}
@keyframes armR{0%{transform:rotate(22deg);opacity:0;animation-timing-function:cubic-bezier(.4,0,.2,1)}12%{opacity:1}40%{transform:rotate(0);animation-timing-function:ease-in-out}51%{transform:rotate(3deg);animation-timing-function:ease-in-out}62%{transform:rotate(0);animation-timing-function:cubic-bezier(.4,0,.2,1)}88%{opacity:1}100%{transform:rotate(22deg);opacity:0}}
@keyframes foldL{0%{transform:translateX(-105%);animation-timing-function:cubic-bezier(.4,0,.2,1)}40%{transform:none;animation-timing-function:ease-in-out}51%{transform:scaleX(.95)}62%{transform:none;animation-timing-function:cubic-bezier(.4,0,.2,1)}100%{transform:translateX(-105%)}}
@keyframes foldR{0%{transform:translateX(105%);animation-timing-function:cubic-bezier(.4,0,.2,1)}40%{transform:none;animation-timing-function:ease-in-out}51%{transform:scaleX(.95)}62%{transform:none;animation-timing-function:cubic-bezier(.4,0,.2,1)}100%{transform:translateX(105%)}}
.wingfx.tail .arm svg{height:150vh;top:-75vh}
.wingfx.tail .arm.l svg{transform-origin:50% 50%;animation:none;transform:rotate(-90deg)}
.wingfx.tail .arm.r svg{transform-origin:50% 50%;animation:none;transform:rotate(90deg)}
.fx-light{background:radial-gradient(ellipse 90% 80% at 0% 0%,color-mix(in oklab,var(--G) 70%,#fff) 0%,color-mix(in oklab,var(--G) 40%,transparent) 30%,color-mix(in oklab,var(--G) 12%,transparent) 60%,transparent 80%);mix-blend-mode:multiply;animation:flare .95s ease forwards}
:root[data-theme="dark"] .fx-light{mix-blend-mode:screen}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .fx-light{mix-blend-mode:screen}}
@keyframes flare{0%{opacity:0}25%{opacity:1}100%{opacity:0}}
.fx-dark{background:linear-gradient(270deg,rgba(8,8,10,.9),rgba(8,8,10,.6) 40%,transparent 70%);animation:shade 1s cubic-bezier(.6,.05,.25,1) forwards}
.fx-dark::after{content:"";position:absolute;top:0;bottom:0;width:3px;background:var(--R);box-shadow:0 0 18px var(--R);right:0;animation:edge .85s cubic-bezier(.6,.05,.25,1) .1s forwards}
@keyframes shade{0%{opacity:0;transform:translateX(30%)}35%{opacity:1;transform:none}100%{opacity:0}}
@keyframes edge{from{right:0;opacity:1}90%{opacity:1}to{right:100%;opacity:0}}
.fx-chapter i{position:absolute;top:0;bottom:0;left:0;width:6px;background:var(--fxc,var(--acc-t));box-shadow:0 0 24px var(--fxc,var(--acc-t));animation:band .8s cubic-bezier(.5,0,.2,1) .12s both}
@keyframes band{from{left:0;opacity:0}10%{opacity:1}90%{opacity:1}to{left:100%;opacity:0}}
.fx-novel{background:radial-gradient(circle at 50% 40%,transparent 20%,color-mix(in oklab,var(--paper) 70%,#000) 90%);animation:dim 1.1s ease forwards}
@keyframes dim{0%{opacity:0}40%{opacity:.8}100%{opacity:0}}
/* View Transitions 非対応のブラウザ向け */
main.enter{animation:fade .45s ease both}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* カードは描画時に順に立ち上がる */
@media (prefers-reduced-motion:no-preference){
  .catcard,.spc,.elc,.stg,.dept,.alist li{animation:rise .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 40ms)}
}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

{id:'history-main',cat:'history',title:'世界の歴史',lede:'竜と人の争いは、いま、PHSとデイテッドの争いとして続いている。',
 body:['古い時代、竜は人にとって資源でもあった。鱗も、力も、人の役に立った。人は技術を磨き、竜を狩る者まで現れた。やがて竜は、人に抗えなくなった。','竜たちは人の目を逃れるため、竜の里をつくった。生き残るために人と血を混ぜ、半竜を生み出したと伝えられている。その後、竜は滅び、竜の里もまた行方が知れなくなった。','時は流れ、半竜は人の社会に拒まれた。その憎しみを背に、人類の滅亡を掲げるデイテッドが生まれ、これに対してPHSが結成された。両者の争いは、いまも終わっていない。'],
 spx:['光と闇という属性は、ある実験によって人の手で生み出された。神に近しいとされる属性である。いまではその数も増えたが、その陰に多くの犠牲があったことを知る者は、ほとんどいない。','竜は本当に「滅んだ」のか。その詳細も、表の記録には残されていない。']},

{id:'sp-1',cat:'species',title:'竜化の五段階',lede:'身の内の竜を、どこまで目覚めさせているか。人・不竜・半竜・半完竜・完竜。',
 stages:true,
 body:['人は、竜の力を持たない。不竜は竜の力のおよそ四分の一を宿し、たやすく制御できる。半竜はその半分を宿し、まだ制御の内にある。半完竜は四分の三に達し、制御は難しくなる。完竜はすべての力を解き放つが、もはや制御はきかない。','半竜はふだん人の姿で暮らし、戦いのときに半竜の姿をとる。さらに完全な竜となることもできるが、その身にかかる負担は大きく、寿命を大きく削る。竜となるには、竜の力を込めたアクセサリーがいる。','完全な竜となった者は人の姿に戻れず、知性も、人格も、記憶の多くも失うとされる。それでも人に戻った例外がある。PHSとデイテッド、それぞれの長である。']},

{id:'sp-2',cat:'species',title:'種族一覧',lede:'竜の種と、頭・翼・尾の数による呼び分け。',
 speciesCards:true,
 sections:[
  ['形態',[['多足竜','多くの腕や脚を持つ。'],['双頭竜','頭を二つ持つ。それより多ければ多頭竜と呼ぶ。多重人格の者に多い。'],['双翼竜','翼を二対持つ。それより多ければ多翼と呼ぶ。'],['双尾竜','尾を二本持つ。それより多ければ多尾と呼ぶ。'],['無翼竜','翼を持たず、空を飛べない。片翼の者もいる。'],['混特竜','キメラとも呼ばれる。さまざまな種や生き物の特徴が混ざり合う。命は短い。']]],
  ['種',[['ドラゴン','強靭な脚を持ち、どの種よりも大きく強い。空でも地でも戦える。'],['ワイバーン','どの種よりも大きな翼を持ち、長く滑空する。空中戦を得意とし、陸上型と空中型がいる。'],['獣','獣の爪と牙、ふさふさとした体、そして鳥のような羽を持つ。'],['水竜','水に適応し、水の中でも息ができる。泳ぎに長け、水中戦を得意とする。'],['ワーム','翼を持たず、蛇に近い。地中での戦いを得意とする。'],['アストラ','どの種よりも速く、遠くまで飛ぶ。天空の支配者とも呼ばれる。ただし地に降りれば、雑魚にも等しい。'],['腐食竜','闇属性によって、まれに生まれる。ほぼ不死であり、蘇らせた者が生きているかぎり生き続ける。ただし、蘇らせた者より強くはなれない。'],['骨竜','闇属性によって、まれに生まれる。ほぼ不死であり、蘇らせた者が生きているかぎり生き続ける。ただし、蘇らせた者より強くはなれない。'],['ダイナソー','翼を持たず、恐竜に近い。地上戦を得意とする。'],['フィーシ','限りなく自然に近い性質を持つ。翼のない者もいる。'],['オルニス','鳥に近い性質を持つ。だが、鳥ではない。'],['龍','神格化の実験によって生まれる。もっとも神に近い。']]]
 ]},

{id:'pw-1',cat:'power',title:'8つの属性',lede:'火・水・風・自然・雷・闇・光・歪。',
 elements:true,
 sections:[['属性',[
  ['火','熱に強い。炎を吐く者もいれば、炎を纏う者もいる。溶岩を扱う者は、土と火を併せ持つ。'],
  ['水','水を扱い、水に強い。水を生み出す者もいれば、周りの水を操る者もいる。'],
  ['風','風を自在に操る。攻めにも使え、うまく乗れば高速で滑空できる。'],
  ['自然','岩、草、氷、毒、煙。これらはみなここに含まれる。ほかの属性と併せ持つ者が多い。'],
  ['雷','光属性に近い。雷のように駆ける者、雷を纏う者など、戦い方はさまざまである。'],
  ['闇','実験によって生まれた属性。死体をゾンビやスカルとして起こすなど、多くのことができる。'],
  ['光','実験によって生まれた属性。傷を癒し、光線を放つなど、多くのことができる。'],
  ['歪','あるとき突如として現れた属性。もとの属性を塗り替えてしまう。できないはずのことができてしまうが、ロストする者も多い。']
 ]]],
 body:['闇と光は、ひとつの身に併せ持つことができない。']},

{id:'pw-2',cat:'power',title:'ステータスとアクセサリー',lede:'力の測り方と、竜となるための力。',
 body:['ステータスの数字は、見た目どおりの差を表さない。99と100の間には、0から100にも及ぶ隔たりがあるとされる。99と100が戦えば、必ず100が勝つ。精神力の値は、傷の治りにも関わる。','半竜が竜となるための力は、アクセサリーに込められている。多く持つほど強いとされ、尽きることのない力を引き出せるともいわれる。だが、その多くは謎に包まれたままである。']},

{id:'ch-raiden',cat:'character',side:'light',title:'雷電',lede:'記憶を失った少年。この記録の中心にいる者。',
 body:['得体の知れない組織に追われ、逃げていたところをアスイに救われた。ホムラ、ミナモと出会って家族として暮らしはじめ、ホムラから「雷電」の名をもらう。のちにPHSに加わった。',{sp:'はじめは雷を操る者に見えた。だが実際には、光と闇の両方を扱うことができる。'},'雷電が望むのは、家族と食卓を囲むこと、鍋をつつくこと、友と笑い合うこと。どこにでもある日常である。'],
 spx:['本当の名はエデン・エイコウ。ロアネによって作られた「神の器」であり、光の龍エゼルと闇の龍シアロタスの融合に成功した、ただひとつの存在である。ただし、その融合は不完全で揺らいでいる。','強い精神力と覚悟によって光と闇が完全にひとつになったとき、「覚醒」──神への変化が起こる。世界が崩れたのち、雷電は自らを犠牲にして世界を作り直す。']},

{id:'ch-asui',cat:'character',side:'light',title:'アスイ',lede:'雷電を最初に救った女性。',
 body:['青い髪に、青い和服。氷の翼を生み出し、空を飛ぶ。雷電をホムラとミナモの待つアパートへ連れ帰り、家族として迎え入れた。'],
 spx:['世界が崩れたのち、記録の視点は雷電からアスイへと移る。死者たちに阻まれながらも、アスイは神と接触したエイコウのもとへたどり着く。彼女が告げたのは「世界を救え」ではなかった。「帰ろう」という言葉だった。']},

{id:'ch-homura',cat:'character',side:'light',title:'ホムラ',lede:'大柄で豪快な、赤い髪の男。',
 body:['雷電を家族として迎え、「雷電」の名を与えた。鍋をつくるのが好きで、ほとんど毎日のように鍋を囲む。その食卓こそが、この家族の日常そのものだった。',{sp:'物語の序盤で命を落とす。ホムラの死は、雷電が手にしたばかりの「家族との日常」が失われた、最初の出来事である。'}]},

{id:'ch-minamo',cat:'character',side:'light',title:'ミナモ',lede:'青い髪の、明るく気ままな人物。',
 body:['ホムラほど豪快ではないが、いつも明るく、ホムラのそばにいることが多い。アスイ、ホムラ、雷電と家族として暮らした。',{sp:'物語の中盤で命を落とす。雷電はふたたび、大切な人を失う。'}]},

{id:'ch-eng',cat:'character',side:'light',title:'エング・ジーング',lede:'PHSに属する半竜。八大天皇のひとり。',
 body:['フィピラスとスガルの子であり、ラログの弟。ふだんは口数が少なく、人と話すことも、目を合わせることも好まない。山奥のログハウスで、自給自足に近い暮らしをしている。','兄ラログから虐げられて育ち、その影響で人の肉を口にする習慣がある。それでも兄を愛し、兄に寄りかかって生きている。',{sp:'ラログがデイテッドへ寝返ったことで深く傷つき、生きる気力を失っていく。物語の中盤で命を落とす。'}]},

{id:'ch-ezel',cat:'character',side:'light',title:'エゼル',lede:'光の龍。PHSを率いる者。',
 body:['最強とされる存在であり、その優しさによって組織を束ねている。完全な竜となったのちも人の姿に戻った、数少ない例外のひとり。申し出れば、エゼルと言葉を交わすことができる。'],
 spx:['神の器のひとり。シアロタスとともに光と闇の融合を目指したが、自らの身では果たせなかった。そこでエイコウを覚醒させ、神とすることを望み、世界を幾度も作り直してきた。望みは「三人──エゼル、シアロタス、エイコウ──で幸せになること」。そのためなら、世界を捨てることもいとわない。雷電を手にかけることができないなど、家族には弱い。']},

{id:'ch-shiarotasu',cat:'character',side:'dark',title:'シアロタス',lede:'闇の龍。デイテッドを率いる者。',
 body:['最強とされる存在であり、その強さによって組織を束ねている。完全な竜となったのちも人に戻った、例外のひとり。本拠は荒地にあり、四天王に申し出れば、言葉を交わすことができる。'],
 spx:['神の器のひとり。エゼルとの融合は果たせなかった。はじめはエゼルと同じものを望んでいたが、しだいに「三人でどこか遠くへ行き、静かに暮らしたい」と思うようになる。最後に、エゼルへこう告げる。「馬鹿な弟でごめん」。']},

{id:'ch-roane',cat:'character',spoiler:true,title:'ロアネ',lede:'「神の器」を作った研究者。',
 body:['エゼル、シアロタス、エイコウの三体を生み出し、神をつくる実験を行っていた。それ以上のことは、まだ記録されていない。']},

{id:'org-phs',cat:'org',side:'light',title:'PHS',lede:'人と半竜がともに生きる道を求め、人を守る光の組織。',
 media:()=>`<div class="org-logo light">${PHS_LOGO}</div>`,
 chart:'phs', pyramid:['phs'],
 body:['率いるのは光の龍エゼル。階級は下から、騎、騎竜、騎竜長、竜王、八大天皇、そして神。八大天皇には、光・闇・風・自然・火・水・雷・歪、それぞれの属性を持つ八名が就く。本部は森の平原にある。']},

{id:'org-deitetto',cat:'org',side:'dark',title:'デイテッド',lede:'人類の滅亡を掲げる闇の組織。',
 media:()=>`<div class="org-logo dark">${DT_LOGO}</div>`,
 chart:'dt', pyramid:['dt'],
 body:['その根には、半竜が人の社会に拒まれたことへの憎しみがある。率いるのは闇の龍シアロタス。階級は下から、下位士、中位士、上位士、七つの大罪、四天王、そして神。裏切った者が許されることは、決してない。本部は荒地にある。',{sp:'七つの大罪は、すでに全員が死んでいる。'}]},

{id:'org-rank',cat:'org',title:'階級制度',lede:'光と闇、それぞれの序列。',
 pyramid:['phs','dt'], hideSections:true,
 sections:[['階級（下から）',[
  ['PHS','騎 → 騎竜 → 騎竜長 → 竜王 → 八大天皇 → 神'],
  ['デイテッド','下位士 → 中位士 → 上位士 → 七つの大罪 → 四天王 → 神']
 ]]]},

{id:'fac-life',cat:'faction',title:'生命の樹',lede:'繰り返される悲劇を止めようとする者たち。',
 body:['はじめの構成員は十人。それぞれがセフィロトの樹にちなんだ名を持ち、身体には決まった印が刻まれている。隠されたセフィラ「ダアト」の存在も知られている。知恵の樹とは別の組織であり、互いに対立している。']},

{id:'fac-chie',cat:'faction',title:'知恵の樹',lede:'光にも闇にも属さず、世界の真実を探る者たち。',
 body:['七人からなる組織。「知ろうとする者」を消す一方で、自らも世界の真実に気づき、ひそかに情報を集めている。クロネコはここに属する。'],
 spx:['クロネコは、世界が繰り返されても記憶を失わない、特別な存在である。エゼルの本当の力も、その目的も知っている。','雷電に直に近づけば、エゼルに気づかれ、命が危うい。だからクロネコは、手がかりだけを残し、遠回りに真実へと導く。ただし、雷電が神になることそのものを止めることはできない。それは、雷電自身が選ぶことだからである。']},

{id:'pl-sato',cat:'place',title:'竜の里',lede:'かつて竜たちが身を隠して暮らした集落。いまは行方が知れない。',
 body:['人との争いを逃れ、竜たちが隠れて生きるためにつくった場所。半竜は、ここで人と竜の血を混ぜて生み出されたと伝えられる。いまでは、その在りかもわからなくなっている。']},

{id:'pl-inyo',cat:'place',title:'陰陽の村',lede:'月と太陽を模した二匹の竜が住むという、古い村。',
 body:['陰の剣と陽の剣が伝わるとされ、その姿は書物の中で見ることができるという。いまは、在りかが知れない。',{sp:'第2章で、雷電たちの日常とは別の物語の舞台となる。'}]},

{id:'story-1',cat:'story',ch:'#d1892a',title:'第1章「Revenge」日常',lede:'雷電がアスイに救われ、家族と暮らしはじめる。',
 body:['雷電はアスイと出会い、保護される。ホムラとミナモに迎えられて家族となり、ホムラから「雷電」の名をもらう。',{sp:'PHSに加わり、いくつもの戦いを経たのち、デイテッドの大規模な襲撃が起こる。ホムラが命を落とす。'}]},
{id:'story-2',cat:'story',ch:'#c4582c',spoiler:true,title:'第2章 日常の終焉',lede:'ホムラを失い、日常が崩れはじめる。',
 body:['陰陽の村の物語が差し挟まれ、雷電たちはそれまで知らなかった世界に触れていく。デイテッドによる二度目の、さらに激しい襲撃が起こる。']},
{id:'story-3',cat:'story',ch:'#7a3fa0',spoiler:true,title:'第3章 七つの大罪',lede:'七つの大罪が襲いかかる。',
 body:['戦いは、ひとりの日常から、より大きな脅威へと移っていく。']},
{id:'story-4',cat:'story',ch:'#b51d2c',spoiler:true,title:'第4章 PHSへの侵攻',lede:'デイテッドがPHSへ攻め込み、雷電はまた大切な人を失う。',
 body:['この戦いで、エングとミナモが命を落とす。']},
{id:'story-5',cat:'story',ch:'#3f6fa8',spoiler:true,title:'第5章 最終局面',lede:'光と闇の、最後の戦い。',
 body:['PHSとデイテッドの戦いが、最後の局面を迎える。くわしい記録は、まだない。'],
 spx:['雷電がエイコウであるという真実が明かされる。物語は、光と闇の融合、そして覚醒──神化へと向かっていく。']},
{id:'story-6',cat:'story',ch:'#55606e',spoiler:true,title:'第6章 世界の崩壊',lede:'世界が崩れたあとの記録。',
 body:['世界そのものが崩れ、記録の視点はアスイへと移る。'],
 spx:['死者たちに阻まれながら、アスイは神と接触したエイコウのもとへたどり着く。雷電は自らを犠牲にして世界を作り直し、そのとき、竜のいない世界へと作り替える。竜を憎んだからではない。竜の存在が人を苦しめる、その仕組みそのものを終わらせるためである。それからの雷電は、世界の外側から人々を見守る存在となった。','この物語は、エゼルとシアロタスによって繰り返されてきた世界の、最後の一周にあたる。']},
];

  {n:'雑務部',d:'資料整理や本部清掃の雑用',subs:[['防衛部','本部防衛を行う'],['雑用部','清掃や資料整理']]}

const NOVEL = [
 {id:1,ch:'#d1892a',chName:'第1章「Revenge」日常',title:'REVENGE',date:'2025年11月28日',text:`足音が、濡れた石畳に跳ねた。
街は眠り、光だけが呼吸をしている。
雨上がりの空気が冷たく、湿ったアスファルトの匂いが鼻をくすぐる。
遠くのネオンが滲み、通りを行く人影は水面に映る光のように揺れて散っていった。

息が荒い。
何が追っているのかも分からない。
けれど、止まれば何かを失う――そんな気がして、ただ無我夢中に走っていた。

風が頬を裂く。
胸の奥が焦げつくように熱い。
何かが、消えそうで、消えてほしくなくて。

――そのときだった。

視界の端に、白い光が舞った。
夜の闇の中、ひとりの女性が立っていた。
髪が風に遊ばれ、瞳が夜の星を映している。

「もう、大丈夫。」

その声は静かで、けれど不思議と温かかった。
風の音が遠のき、声だけが耳の奥に残る。
足は自然と止まり、目が離せなかった。

「……ひとりは、寂しいでしょう。行きましょう。」

彼女が手を差し伸べる。
その手は、氷の結晶でできた硝子のよう。
冷たく、けれど痛いほど澄んでいて、美しかった。

触れた瞬間、空気が震えた。
背に風が集まり、白い光が形を成す。

――翼だ。

それは氷の羽。
繊細で、透明で、触れたら壊れてしまいそうなほど儚い。
光がその輪郭を縁取り、夜空に星の粉のように散っていく。

「……不思議？　きっと、あなたもできるようになるわ。」

彼女はそう囁き、そっと抱き寄せた。
冷たさの奥にある確かな温もりが、心の奥に滲む。
氷の羽が震え、鈴のような音を立てながら光を散らした。

やがて、風が二人を包み込む。
白い光の流れが夜を裂き、宙へと舞い上がった。

下に広がる街は、雨に濡れて光を溶かし、水彩画のように揺れる。
ネオンが滲み、濡れた舗道に反射して流れる川のように続く。
遠くの車の音が溶け、世界がひとつの呼吸になっていく。

「……世界って、こんなに広いんだ。」

思わず言葉が零れた。
胸の奥が熱を帯び、風が頬を撫でる。
上昇するたびに、地上の音が薄れていく。
代わりに、夜空の金属の香りと静寂が広がった。

「もうすぐよ。」

その声――アスイの声が耳の奥で柔らかく響いた。
視線の先、雲の切れ間に見えるのは、街の端で小さく光るアパート。
無機質な屋上に雨がまだポツポツと降り注ぎ、白く塗られた壁が濡れた夜気に柔らかく光っていた。

高度が下がるにつれ、風の唸りは消え、雨の滴る音が近づく。
街灯の明かりが二人の輪郭を照らす。
まるで、世界が息を潜めて見守っているかのようだった。

――そして、氷の翼が音もなく畳まれる。
柔らかな風が頬を撫で、二人は静かにアパートの前に降り立った。

濡れた地面が冷たく、湿った土の匂いが鼻をかすめる。
街灯の光が二人の影を長く伸ばしていた。

「ここよ。」

アスイが言い、階段を登りはじめる。
足音だけが夜の静寂を切り裂く。
その音が止まったとき、扉の開く音がそれに重なった。

――そして、熱が溢れた。

「よぉ！！　アスイじゃねぇか！！　どこ行ってたんだァ！！」

思わず体がびくりと跳ねる。
立っていたのは、燃えるような赤髪の男――ホムラだ。
満面の笑みを浮かべ、豪快にこちらを見下ろしている。
その存在だけで、部屋の温度が上がったように感じた。

「なんだ？　そっちは……新顔か？」

声の圧に息を呑む。
背中越しにアスイの手が肩に触れ、その仕草は「大丈夫」と語るようだった。

「ちょ、ちょっと！　そんな大声出さないでよ！　怖がってるでしょ！」

背後から青い髪の少年が顔を出す。
柔らかく落ち着いた声で、興味津々にこちらを見つめる。

「ふぇ〜……誰か連れてくるなんて、アスイにしては珍しいね。」

微笑みながら覗き込む瞳には、純粋な好奇心が光っていた。

「ふふ、相変わらずね、あなたたち。」

アスイが微笑むと、ホムラは豪快に笑い、肩をすくめる。
「そりゃそうだ！　俺たちは変わらねぇさ！」

「ホムラ、もう……」
少年は小さく息をつく。

アスイは静かに微笑み、
「中に入って。冷えてるでしょう」と促した。

靴を脱ぎ、部屋に足を踏み入れる。
畳の香りと、外から持ち込んだ雨の気配が入り混じる。
蛍光灯の柔らかな光が揺れ、心が少しずつほぐれていく。

「まぁまぁ、そんな固くなんなって！」
ホムラが肩を叩く。
大きく温かい手に思わず息をのんだ。

「ほら、座って。驚かせてごめんね。」
少年の声は、水面のように柔らかく、安心感を与えた。

アスイが隣に腰を下ろす。
「……ここが、あなたの家になる場所よ。」

その言葉が、胸の奥にゆっくりと染みていく。
雨の音が遠のき、代わりに部屋の静かな呼吸だけが響いた。

そして...ようやく、心が少しだけ息をついた。

良かった。`}
];

<script>
const store = {get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const strip = s => String(s||'').replace(/<[^>]+>/g,'');
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- ネタバレモード ---------- */
let spoilMode = store.get('eikou-spoiler');          // 'safe' | 'full' | null（未選択）
const full = () => spoilMode==='full';
const visible = a => !a.spoiler || full();
const paras = body => (body||[]).filter(p=>typeof p==='string' || full());
const pWrap = arr => (arr||[]).map(t=>typeof t==='string' ? `<p>${t}</p>` : `<p class="spoilp">${t.sp}</p>`).join('');
const spoilBtn = document.getElementById('spoilBtn');
function paintSpoil(){
  spoilBtn.innerHTML = `<i></i>${full() ? 'ネタバレあり' : 'ネタバレなし'}`;
  spoilBtn.classList.toggle('on', full());
  spoilBtn.setAttribute('aria-label', `表示モード：${full()?'ネタバレあり':'ネタバレなし'}（切り替える）`);
  document.getElementById('spoilbar').hidden = !full();
}

/* ---------- 光／闇（テーマ） ---------- */
const root = document.documentElement;
const themeBtn = document.getElementById('themeBtn');
const isDark = () => root.dataset.theme ? root.dataset.theme==='dark' : matchMedia('(prefers-color-scheme: dark)').matches;
function paintTheme(){
  const d = isDark();
  themeBtn.innerHTML = `<svg viewBox="0 0 20 20" aria-hidden="true" style="transform:rotate(${d?180:0}deg);transition:transform .4s"><circle cx="10" cy="10" r="8.5" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M10 1.5a8.5 8.5 0 0 1 0 17z" fill="currentColor"/></svg><span class="lbl-long">${d?'闇の世界':'光の世界'}</span>`;
  themeBtn.setAttribute('aria-label', d ? '光の世界（ライト表示）へ移る' : '闇の世界（ダーク表示）へ移る');
  themeBtn.title = d ? '光の世界へ' : '闇の世界へ';
}
{ const t = store.get('eikou-theme'); if(t==='dark'||t==='light') root.dataset.theme = t; }
themeBtn.addEventListener('click',()=>{
  const n = isDark()?'light':'dark';
  const go = ()=>{ root.dataset.theme = n; store.set('eikou-theme', n); paintTheme(); };
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){ go(); return; }
  // 光と闇の世界を行き来する：大きな翼が横切るあいだに世界が入れ替わる
  const d = (me && dragonByName(me.sp)?.parts.includes('wr')) ? dragonByName(me.sp) : DRAGONS[0];
  const sw = document.getElementById('sweep');
  sw.innerHTML = `<svg viewBox="${d.x+d.w/2} ${d.y} ${d.w/2} ${d.h}" preserveAspectRatio="xMidYMid meet"><g fill="currentColor"><use href="#dgp-${d.k}-wr"/></g></svg>`;
  sw.className = 'sweep ' + (n==='dark' ? 'to-dark' : 'to-light'); void sw.offsetWidth; sw.classList.add('go');
  setTimeout(()=>{ document.startViewTransition ? document.startViewTransition(go) : go(); }, 380);
  setTimeout(()=>{ sw.className = 'sweep'; }, 1200);
});
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', paintTheme);

/* ---------- ヘッダーのカテゴリー ---------- */
const NAV = ['character','org','species','story','glossary','novel'];
function paintNav(active){
  document.getElementById('catnav').innerHTML =
    NAV.map(k=>{const c=CATS.find(x=>x.key===k);return `<a href="#cat-${k}" class="${k===active?'on':''}">${c.name}</a>`;}).join('')
    + `<a href="#top" class="${active==='all'?'on':''}">すべてのカテゴリー</a>`;
}

/* ---------- 検索 ---------- */
function buildIndex(){
  const idx = [];
  CATS.forEach(c=>idx.push({ty:'カテゴリー',title:c.name,href:`#cat-${c.key}`,text:c.name+' '+c.desc}));
  ARTICLES.filter(visible).forEach(a=>{
    const secs = (a.sections||[]).map(([h,rows])=>h+' '+rows.map(r=>r.join(' ')).join(' ')).join(' ');
    const body = paras(a.body).map(p=>typeof p==='string'?p:p.sp).join(' ');
    const extra = full() ? (a.spx||[]).join(' ') : '';
    idx.push({ty:'記事',title:a.title,href:`#a-${a.id}`,text:[a.title,a.lede,body,secs,extra].join(' ')});
  });
  GLOSSARY.filter(g=>!g.spoiler||full()).forEach(g=>idx.push({ty:'用語',title:g.t,href:'#cat-glossary',text:g.t+' '+g.d+(full()&&g.sp?' '+g.sp:'')}));
  NOVEL.forEach(n=>idx.push({ty:'小説',title:`第${n.id}話 ${n.title}`,href:`#novel-${n.id}`,text:n.title+' '+n.text}));
  CALENDAR.forEach(c=>idx.push({ty:'誕生日',title:c.n,href:'#cat-calendar',text:c.n+' '+c.d}));
  return idx;
}
function search(q){
  q = q.trim(); if(!q) return [];
  const terms = q.toLowerCase().split(/\s+/);
  return buildIndex().map(it=>{
    const title = it.title.toLowerCase(), text = strip(it.text).toLowerCase();
    if(!terms.every(t=>text.includes(t)||title.includes(t))) return null;
    let score = 0;
    terms.forEach(t=>{ if(title===t) score+=100; else if(title.startsWith(t)) score+=50; else if(title.includes(t)) score+=25; });
    if(it.ty==='記事') score+=3;
    return {...it,score};
  }).filter(Boolean).sort((a,b)=>b.score-a.score);
}
function snippet(text,q){
  const t = strip(text); const k = q.trim().split(/\s+/)[0]||'';
  const i = t.toLowerCase().indexOf(k.toLowerCase());
  if(i<0) return esc(t.slice(0,70));
  const s = Math.max(0,i-24);
  return (s>0?'…':'')+esc(t.slice(s,i))+'<mark>'+esc(t.slice(i,i+k.length))+'</mark>'+esc(t.slice(i+k.length,i+k.length+46))+'…';
}
const qEl = document.getElementById('q'), sugEl = document.getElementById('suggest');
let lastQuery = '', act = -1;
function paintSuggest(){
  const q = qEl.value; const res = search(q).slice(0,8); act = -1;
  if(!q.trim()){ sugEl.hidden = true; return; }
  sugEl.innerHTML = res.length
    ? res.map(r=>`<li><a href="${r.href}"><span class="ty">${r.ty}</span><span class="tt">${esc(r.title)}</span></a></li>`).join('')
      + `<li><a href="#search" data-all><span class="ty">検索</span><span class="tt">「${esc(q.trim())}」の検索結果をすべて見る</span></a></li>`
    : `<li class="empty">「${esc(q.trim())}」に一致する項目はありません</li>`;
  sugEl.hidden = false;
}
qEl.addEventListener('input', paintSuggest);
qEl.addEventListener('focus', ()=>{ if(qEl.value.trim()) paintSuggest(); });
qEl.addEventListener('keydown', e=>{
  const links = [...sugEl.querySelectorAll('a')];
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){
    if(!links.length) return; e.preventDefault();
    act = (act + (e.key==='ArrowDown'?1:-1) + links.length) % links.length;
    links.forEach((l,i)=>l.classList.toggle('act',i===act));
  } else if(e.key==='Enter'){
    e.preventDefault();
    if(act>=0 && links[act] && !links[act].hasAttribute('data-all')) location.hash = links[act].getAttribute('href');
    else if(qEl.value.trim()){ lastQuery = qEl.value.trim(); if(location.hash==='#search') router(); else location.hash='search'; }
    closeSuggest();
  } else if(e.key==='Escape') closeSuggest();
});
sugEl.addEventListener('click', e=>{
  const a = e.target.closest('a'); if(!a) return;
  if(a.hasAttribute('data-all')){ lastQuery = qEl.value.trim(); if(location.hash==='#search'){ e.preventDefault(); router(); } }
  closeSuggest();
});
document.addEventListener('click', e=>{ if(!e.target.closest('.search')) sugEl.hidden = true; });
function closeSuggest(){ sugEl.hidden = true; qEl.blur(); }


/* =========================================================
   あなた（属性と竜の種族）
   ========================================================= */
const COMPOUND = {火:'溶岩', 水:'氷', 風:'嵐', 雷:'磁気'};   // 自然＋火／水／風／雷。闇・光・歪とは重ならない
let me = null;            // {el:'水', sp:'ワイバーン'}
try{ me = JSON.parse(store.get('eikou-who')||'null'); }catch(e){ me = null; }
if(me && !ATTRS.find(a=>a.k===me.el)) me = null;
if(me && me.cx && !Object.values(COMPOUND).includes(me.cx)){ delete me.cx; delete me.mix; }
const attrOf = k => ATTRS.find(a=>a.k===k);
const elLabel = m => m.cx || m.el;   // 自然の複合は「溶岩」「氷」「嵐」「磁気」と呼ぶ
const isPlainColor = c => /^#/.test(c);
function applyMe(){
  if(me){ root.style.setProperty('--acc', attrOf(me.el).c.replace('var(--R)','#cc1a31').replace('var(--G)','#e2a90b')); root.dataset.awake=''; }
  else { root.style.removeProperty('--acc'); delete root.dataset.awake; }
  paintWho();
}
const gemIc = el => { const g = GEMS[el]; const fill = g.facets ? `url(#gemIri)` : g.c;
  return `<svg class="gem-ic" viewBox="-40 -52 80 104" aria-hidden="true">${g.facets?`<defs><linearGradient id="gemIri" x1="0" y1="0" x2="1" y2="1">${g.facets.slice(0,4).map((c,i)=>`<stop offset="${i/3}" stop-color="${c}"/>`).join('')}</linearGradient></defs>`:''}<path d="M0-48 26-26 32 2 22 30 0 50-22 30-32 2-26-26z" fill="${fill}" stroke="color-mix(in oklab,var(--ink) 40%,transparent)" stroke-width="3"/><path d="M0-48 26-26 0-14-26-26z" fill="#fff" opacity=".45"/><path d="M-26-26 0-14-12 6-32 2z" fill="#fff" opacity=".2"/></svg>`; };
const whoBtn = document.getElementById('whoBtn');
function paintWho(){
  if(me){
    whoBtn.innerHTML = `${gemIc(me.el)}<span class="lbl-long">${elLabel(me)}・${me.sp}</span>`;
    whoBtn.setAttribute('aria-label', `あなた：${elLabel(me)}属性の${me.sp}（選び直す）`);
  } else {
    whoBtn.innerHTML = `<svg class="gem-ic" viewBox="-40 -52 80 104" aria-hidden="true"><path d="M0-48 26-26 32 2 22 30 0 50-22 30-32 2-26-26z" fill="none" stroke="currentColor" stroke-width="5"/></svg><span class="lbl-long">あなたは何者？</span>`;
    whoBtn.setAttribute('aria-label', 'あなたは何者？（選ぶ・ランダム・診断）');
  }
}

/* =========================================================
   街：人の世界も竜の世界も同じ景色。竜は最初からそこにいる
   ========================================================= */
function rng(seed){ let s = seed>>>0; return ()=>((s = (s*1664525 + 1013904223)>>>0) / 4294967296); }
function dragonUse(k, x, y, h, cls, style){
  const d = DRAGONS.find(v=>v.k===k); const w = h * d.w / d.h;
  return `<g class="drg ${cls||''}" style="${style||''}"><svg x="${(x - w/2).toFixed(1)}" y="${(y - h).toFixed(1)}" width="${w.toFixed(1)}" height="${h}" viewBox="0 0 ${d.w} ${d.h}" overflow="visible"><use href="#dg-${k}" x="0" y="0" width="${d.w}" height="${d.h}"/></svg></g>`;
}
function city(seed){
  const r = rng(seed), W = 1200, H = 300;
  let far = '', near = '', win = '';
  for(let x = -20; x < W; ){ const w = 34 + r()*60, h = 70 + r()*140; far += `<rect class="far" x="${x.toFixed(1)}" y="${(H-h).toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}"/>`; if(r()<.25) far += `<rect class="far" x="${(x+w/2-2).toFixed(1)}" y="${(H-h-18).toFixed(1)}" width="3" height="18"/>`; x += w + r()*6; }
  for(let x = -10; x < W; ){
    const tall = r() < .14, w = 46 + r()*80, h = tall ? 150 + r()*60 : 40 + r()*85, y = H - h;
    near += `<rect class="near" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}"/>`;
    for(let wy = y + 10; wy < H - 12; wy += 14) for(let wx = x + 7; wx < x + w - 10; wx += 12) if(r() < .42) win += `<rect class="win" x="${wx.toFixed(1)}" y="${wy.toFixed(1)}" width="5" height="7"/>`;
    x += w + 2 + r()*10;
  }
  // 竜：空を飛ぶもの、遠くのビルの向こうにいるもの
  const sky = [
    dragonUse('01', 190, 140, 46, 'fly', '--o:.42;--d:.3s;--t:11s;--dx:18px;--dy:-6px'),
    dragonUse('05', 800, 128, 38, 'fly', '--o:.34;--d:.9s;--t:9s;--dx:-16px;--dy:-10px'),
    dragonUse('14', 1060, 150, 30, 'fly', '--o:.3;--d:1.4s;--t:13s;--dx:12px;--dy:-4px'),
  ].join('');
  const part = (k, p, x, y, h, rot, style) => { const d = DRAGONS.find(v=>v.k===k); const w = h*d.w/d.h;
    return `<g class="drg" style="${style}"><g transform="translate(${x} ${y}) rotate(${rot})"><svg x="${(-w/2).toFixed(1)}" y="${-h}" width="${w.toFixed(1)}" height="${h}" viewBox="${d.x} ${d.y} ${d.w} ${d.h}" overflow="visible"><g fill="currentColor"><use href="#dgp-${k}-${p}"/></g></svg></g></g>`; };
  const peek = [
    part('02','wr', 930, 360, 230, -14, '--o:.4;--d:1.6s'),   // ビルの向こうから突き出す翼の先
    part('04','body', 700, 236, 120, 96, '--o:.4;--d:2s'),    // 屋根の間を這うしっぽ
  ].join('');
  const behind = [
    dragonUse('00', 560, 236, 170, '', '--o:.5;--d:.6s'),
    dragonUse('04', 330, 200, 90, '', '--o:.42;--d:1.1s'),
  ].join('');
  return `<svg class="city" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMax slice" aria-hidden="true">${sky}<g>${far}</g>${peek}${behind}<g>${near}${win}</g></svg>`;
}

/* =========================================================
   アクセサリー（宝石）
   ========================================================= */
function gemSVG(el){
  const G = GEMS[el];
  const O = [[0,-62],[34,-38],[44,0],[34,40],[0,70],[-34,40],[-44,0],[-34,-38]];
  const I = O.map(([x,y])=>[x*.48, y*.48 - 2]);
  const mix = ['#fff 38%','#000 10%','#fff 18%','#000 28%','#000 40%','#000 22%','#fff 8%','#fff 28%'];
  let f = '';
  for(let i=0;i<8;i++){ const j=(i+1)%8; const base = G.facets ? G.facets[i] : G.c;
    f += `<path d="M${O[i]} L${O[j]} L${I[j]} L${I[i]}z" style="fill:color-mix(in oklab,${base},${mix[i]})"/>`; }
  const table = `<path d="M${I.map(p=>p.join(',')).join(' L')}z" style="fill:color-mix(in oklab,${G.facets?G.facets[2]:G.c},#fff 24%)"/>`;
  return `<svg viewBox="-60 -100 120 180" aria-hidden="true" class="${G.facets?'iri':''}">
    <path d="M0-98 V-74" stroke="var(--mute)" stroke-width="1.5"/>
    <circle cx="0" cy="-68" r="6" fill="none" stroke="var(--mute)" stroke-width="2.5"/>
    ${f}${table}
    <path d="M-20-26 L-6-30 L-14-12z" fill="#fff" opacity=".75"/>
    <path d="M${O.map(p=>p.join(',')).join(' L')}z" fill="none" stroke="color-mix(in oklab,${G.c},#000 50%)" stroke-width="1.2"/>
  </svg>`;
}

 {q:'争いのなかで、あなたはどう動く？', o:[{t:'熱に任せて、押し切る',a:'火'},{t:'冷静に、相手の動きを止める',a:'水'},{t:'大きくかき乱して、場を荒らす',a:'風'},{t:'相手を引き寄せて、離さない',a:'雷'}]},

const SP = (t, s) => ({t, s});
const Q_SP = [

 {q:'どう戦いたい？', o:[SP('空中から、一気に攻める',{ワイバーン:2,アストラ:1}), SP('場所を選ばず、力で圧倒する',{ドラゴン:3}), SP('地に足をつけて、どっしり構える',{ダイナソー:2,獣:1}), SP('足もとから、不意をつく',{ワーム:2,水竜:1})]},
 {q:'どんな身体がいい？', o:[SP('大きな翼で、長く滑空できる',{ワイバーン:2,ドラゴン:1}), SP('鋭い爪と、ふさふさの毛並み',{獣:3}), SP('羽根をまとった、軽やかな身体',{オルニス:3}), SP('自然に溶けこむ、しなやかな身体',{フィーシ:3})]},
 {q:'どう生きたい？', o:[SP('誰よりも速く、遠くへ',{アストラ:3}), SP('強く、堂々と',{ドラゴン:2,ダイナソー:1}), SP('自然の流れに身をまかせて',{フィーシ:2,水竜:1}), SP('仲間と群れて、本能のままに',{獣:2,オルニス:1})]},
 {q:'倒れたとき、どうなりたい？', o:[SP('何度でも、立ち上がる',{腐食竜:2,骨竜:2,ダイナソー:1}), SP('静かに、土に還る',{ワーム:1,フィーシ:1,獣:1}), SP('空へ、昇っていく',{アストラ:1,ワイバーン:1,オルニス:1}), SP('水へ、溶けていく',{水竜:2,フィーシ:1})]},
];
const topOf = sc => { const m = Math.max(...Object.values(sc)); const t = Object.keys(sc).filter(k=>sc[k]===m); return t[Math.floor(Math.random()*t.length)]; };
const adjustRare = sc => sc;   // 闇・光・歪を通常の質問でどこまで出すかは未決定。決まったらここで調整する
function diagnose(ans, forcedMain){   // ans: {el:[選択index...], mix:[...], sp:[...]}
  const el = Object.fromEntries(ATTRS.map(a=>[a.k,0]));
  ans.el.forEach((i,n)=>{ const o = Q_EL[n].o[i]; el[o.a]+=2; el[o.b]+=1; });
  const main = forcedMain || topOf(adjustRare(el));
  let cx = null, mix = null;
  if(main==='自然'){
    const m = {火:0,水:0,風:0,雷:0};
    ans.mix.forEach((i,n)=>{ m[Q_MIX[n].o[i].a]+=1; });
    mix = topOf(m); cx = COMPOUND[mix];
  }
  const sc = {};
  ans.sp.forEach((i,n)=>{ const s = Q_SP[n].o[i].s; for(const k in s) sc[k]=(sc[k]||0)+s[k]; });
  const pool = pickPool(main);   // 龍は対象外。腐食竜・骨竜は闇のときだけ
  const ps = Object.fromEntries(pool.map(d=>[d.n, sc[d.n]||0]));
  return { el: main, cx, mix, sp: dragonByName(topOf(ps)) };
}

/* 診断：質問を一問ずつ。属性（6問）→ 自然なら追加（2問）→ 種族（5問） */
let dq = null;
function stepQuiz(){
  dq = { n:0, ans:{ el:[], mix:[], sp:[] } };
  quizAsk('el');
}
function quizAsk(phase){
  const list = phase==='el' ? Q_EL : phase==='mix' ? Q_MIX : Q_SP;
  const i = dq.ans[phase].length, item = list[i];
  const total = Q_EL.length + Q_SP.length + (dq.mixed ? Q_MIX.length : 0);
  stage.innerHTML = `<div class="fade-in">
    <p class="qprog latin">${dq.n+1} / ${total}${dq.mixed?'':'＋'}</p>
    <div class="qbar"><i style="width:${(dq.n/total*100).toFixed(0)}%"></i></div>
    <p class="q" style="font-size:clamp(19px,4.4vw,26px);margin-bottom:22px">${item.q}</p>
    <div class="qopts">${item.o.map((o,k)=>`<button class="mode" type="button" data-qa="${phase}" data-i="${k}"><span class="txt" style="color:var(--ink);font-size:14px">${o.t}</span></button>`).join('')}</div></div>`;
  stage.querySelector('[data-qa]').focus();
}
function quizAnswer(phase, k){
  dq.ans[phase].push(k); dq.n++;
  if(phase==='el'){
    if(dq.ans.el.length < Q_EL.length) return quizAsk('el');
    // 属性が自然なら、ここで追加判定を挟む
    const el = Object.fromEntries(ATTRS.map(a=>[a.k,0]));
    dq.ans.el.forEach((i,n)=>{ const o = Q_EL[n].o[i]; el[o.a]+=2; el[o.b]+=1; });
    dq.main = topOf(adjustRare(el));
    dq.mixed = dq.main==='自然';
    return dq.mixed ? quizAsk('mix') : quizAsk('sp');
  }
  if(phase==='mix') return dq.ans.mix.length < Q_MIX.length ? quizAsk('mix') : quizAsk('sp');
  if(dq.ans.sp.length < Q_SP.length) return quizAsk('sp');
  quizResult();
}
function quizResult(){
  // 主属性は属性の質問が終わった時点で確定済み（同点のランダムでぶれないよう、それを使う）
  const r = diagnose(dq.ans, dq.main);
  pend = { el:r.el, cx:r.cx, mix:r.mix, sp:r.sp };
  setAcc(r.el); skipBtn.textContent = 'とばす';
  const elText = r.cx ? `【自然属性】` : `【${r.el}属性】`;
  stage.innerHTML = `<div>
    <p class="rline fade-in" style="letter-spacing:.3em">あなたは――</p>
    <p class="rline fade-in" style="animation-delay:1.1s">${elText}</p>
    ${r.cx?`<p class="rline sm fade-in" style="animation-delay:1.8s">複合：${r.mix}　→　性質：<b>${r.cx}</b></p>`:''}
    <p class="rline fade-in" style="animation-delay:${r.cx?2.6:1.9}s">【${r.sp.n}】</p></div>`;
  later(r.cx?5200:4400, ()=>stepGem(r.el, { sp:r.sp, cx:r.cx, mix:r.mix, fixed:true }));
}
function chooseAttr(el, btn){
  const a = attrOf(el);
  btn.classList.add('chosen'); document.getElementById('attrs').classList.add('locked');
  // UI全体が属性の色に染まる
  pend = { el };

// 自然を選んだら、そのまま（岩・草・氷・毒・煙）か、ほかの属性と重ねるかを選ぶ
const NAT_MIX = [
  {mix:null, label:'自然のまま', t:'岩・草・氷・毒・煙。'},
  {mix:'火', label:'溶岩', t:'自然＋火。熱と大地を併せ持つ。'},
  {mix:'水', label:'氷',   t:'自然＋水。'},
  {mix:'風', label:'嵐',   t:'自然＋風。'},
  {mix:'雷', label:'磁気', t:'自然＋雷。'},
];
function stepNatureMix(){

function chooseNatureMix(mix, btn){

function stepGem(el, opt){
  stage.innerHTML = `<div>
    <div class="gemwrap gem-in" id="gem" style="--gem:${GEMS[el].c};--gemg:${GEMS[el].g}"><div class="rays"></div><div class="halo"></div>${gemSVG(el)}</div>
    <p class="line1" id="l1"></p><p class="line2" id="l2"></p></div>`;
  const l1 = document.getElementById('l1');
  later(900, ()=>{ l1.textContent = 'アクセサリーが現れた'; l1.classList.add('fade-in'); });
  later(2000, ()=>{ document.getElementById('gem').classList.add('glow'); l1.textContent = '──光る。'; });
  later(4300, ()=>stepDragon(el, opt));
}
function pickPool(el){
  // 龍は抽選から外す。腐食竜・骨竜は闇属性によって生まれるため、闇のときだけ候補に入れる
  return DRAGONS.filter(d=>!d.special && (el==='闇' || (d.n!=='腐食竜' && d.n!=='骨竜')));
}
function pickSpecies(el){
  const pool = pickPool(el);
  return pool[Math.floor(Math.random()*pool.length)];
}
function dragonParts(d, cls){
  // 素材を分解して、胴としっぽ → 手足 → 頭 → 翼 の順に組み上げる
  const order = ['body','other','head','wl','wr'].filter(p=>d.parts.includes(p));
  return `<svg class="${cls||''}" viewBox="${d.x} ${d.y} ${d.w} ${d.h}" aria-hidden="true"><g fill="currentColor">${order.map(p=>`<g class="pt pt-${p}"><use href="#dgp-${d.k}-${p}"/></g>`).join('')}</g></svg>`;
}
function stepDragon(el, opt){
  const sp = (opt && opt.sp) || pickSpecies(el);
  const cx = opt && opt.cx, mix = opt && opt.mix;
  const fixed = !!(opt && opt.fixed);   // 診断：種族はもう決まっているので、切り替わる演出なしで組み上げる
  const pool = DRAGONS.filter(d=>!d.special);
  stage.innerHTML = `<div>
    <div class="dragon-stage${fixed?'':' rolling'}" id="ds" style="--gem:${GEMS[el].c};--gemg:${GEMS[el].g}"><div class="halo"></div>${fixed?'':'<svg class="roll" viewBox="0 0 10 10" aria-hidden="true"><use id="dsUse" href="#dg-00"/></svg>'}</div>
    <p class="line1" id="l1">竜化</p><p class="line2" id="l2">あなたの中の竜が、目を覚ます</p></div>`;
  const ds = document.getElementById('ds'), roll = ds.querySelector('svg.roll'), use = document.getElementById('dsUse');
  const show = d => { roll.setAttribute('viewBox', `0 0 ${d.w} ${d.h}`); use.setAttribute('href', `#dg-${d.k}`); };
  let t = 0, i = 0;
  const steps = (reduce() || fixed) ? 0 : 12;
  for(let s=0; s<steps; s++){ t += 70 + s*s*2.6; later(t, ()=>show(pool[(i++)%pool.length])); }
  later(t + (fixed ? 600 : 200), ()=>{
    // 決まった種族を、パーツから組み上げる
    if(roll) roll.remove(); ds.classList.remove('rolling'); ds.insertAdjacentHTML('beforeend', dragonParts(sp, 'build'));
    me = cx ? { el, cx, mix, sp: sp.n } : { el, sp: sp.n }; store.set('eikou-who', JSON.stringify(me)); store.set('eikou-skip', '');
  });
  later(t + (fixed ? 600 : 200) + 1900, ()=>{
    ds.classList.add('done');
    flash.classList.remove('on'); void flash.offsetWidth; if(!reduce()) flash.classList.add('on');
    document.getElementById('l1').textContent = sp.n;
    document.getElementById('l2').textContent = `${cx||el}属性の${sp.n}として、竜の世界へ`;
  });
  later(t + (fixed ? 600 : 200) + 4100, stepReveal);
}
function stepReveal(){
  skipBtn.hidden = true;
  applyMe();             // ここで街の竜が見えるようになる
  stage.innerHTML = `<div class="reveal" style="padding-bottom:min(20vh,140px)">
    <p class="q fade-in">見えるようになった。</p>
    <p class="sub fade-in" style="animation-delay:.8s">竜は、最初からそこにいた。</p>
    <div class="fade-in" style="animation-delay:1.6s"><span class="idcard">${gemIc(me.el)}${elLabel(me)}属性 ／ ${me.sp}</span><br>
    <button class="cta" type="button" id="enter">資料集へ進む</button></div></div>`;
  later(1700, ()=>document.getElementById('enter')?.focus());
}
function finishNow(){
  // とばす：その時点で決まっていない部分はその場で決めて、見えるようになった画面へ
  clearTimers();
  const p = pend || (me ? { el:me.el, cx:me.cx, mix:me.mix, sp:me.sp } : null);
  if(!p){ store.set('eikou-skip','1'); closeIntro(); return; }
  me = { el:p.el, sp: p.sp ? (p.sp.n||p.sp) : pickSpecies(p.el).n };
  if(p.cx){ me.cx = p.cx; me.mix = p.mix; }
  store.set('eikou-who', JSON.stringify(me)); setAcc(me.el);
  stepReveal();
}

intro.addEventListener('click', e=>{
  const m = e.target.closest('[data-mode]');
  if(m){ spoilMode = m.dataset.mode; store.set('eikou-spoiler', spoilMode); paintSpoil();
    if(afterSpoiler==='who'){ afterSpoiler = null; stepWho(); } else closeIntro(); return; }
  const h = e.target.closest('[data-how]');
  if(h){ const v = h.dataset.how; if(v==='pick') stepPick(); else if(v==='random') stepRandom(); else if(v==='quiz') stepQuiz(); else stepWho(); return; }
  const qa = e.target.closest('[data-qa]');
  if(qa){ quizAnswer(qa.dataset.qa, +qa.dataset.i); return; }
  const nm = e.target.closest('[data-nmix]');
  if(nm && !nm.closest('.locked')){ chooseNatureMix(nm.dataset.nmix, nm); return; }
  const a = e.target.closest('.attr');
  if(a && !a.closest('.locked') && a.dataset.el){ chooseAttr(a.dataset.el, a); return; }
  if(e.target.id === 'enter'){ closeIntro(); location.hash = ''; return; }
});
skipBtn.addEventListener('click', ()=>{
  if(skipBtn.textContent === '閉じる'){ applyMe(); closeIntro(); return; }

});
