<head>

<meta name="twitter:title" content="人外レストラン｜設定・資料集">
<meta name="twitter:description" content="サタンが作り出した、人外たちのためのレストラン。深夜営業の資料集へようこそ。">

<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700;800&family=Zen+Old+Mincho:wght@400;600&family=Klee+One:wght@400;600&family=Cormorant+SC:wght@500;600&display=swap">
<style>
/* Layout: 上に真鍮の伝票レール（カテゴリ）。下は2画面：左＝記事の伝票一覧、右＝本文が常に開いている。背景には記事に関係する店内の場面が暗く沈む */
:root{
  color-scheme: dark;
  --ink:#0b0708;
  --ink-2:#161011;
  --crimson:#9b1a29;
  --stamp:#b3202f;
  --gold:#bf9a5e;
  --gold-dim:#7d6440;
  --brass-hi:#e0c48d;
  --ivory:#ece2cd;
  --slip:#efe7d6;
  --slip-ink:#2b1d19;
  --slip-sub:#7a6658;
  --smoke:#a39385;
  --f-display:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"Zen Old Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-hand:"Klee One","Zen Old Mincho","Hiragino Mincho ProN",serif;
  --f-label:"Cormorant SC","Cormorant Garamond",Georgia,serif;
  --ease:cubic-bezier(.22,.7,.2,1);
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0}
mark{background:rgba(179,32,47,.16);color:inherit;border-bottom:1px solid var(--stamp);padding:0 1px}
body{background:var(--ink);color:var(--ivory);font-family:var(--f-body);font-size:15px;line-height:1.85;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:1px solid var(--gold);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.label{font-family:var(--f-label);letter-spacing:.18em;text-transform:uppercase;font-size:12px;color:var(--gold)}
.link-quiet{color:var(--smoke);font-size:13px;letter-spacing:.1em;border-bottom:1px solid transparent;transition:color .3s,border-color .3s}
.link-quiet:hover{color:var(--ivory);border-color:var(--gold-dim)}

/* ---------- 背景の場面（暗く沈める） ---------- */
.scenes{position:fixed;inset:0;z-index:0}
.scene{position:absolute;inset:0;opacity:0;transition:opacity 1.4s ease}
.scene.on{opacity:1}
.scene svg{width:100%;height:100%;display:block}
.scenes::after{content:"";position:absolute;inset:0;pointer-events:none;background:
  linear-gradient(180deg,rgba(11,7,8,.92) 0%,rgba(11,7,8,.6) 30%,rgba(11,7,8,.62) 70%,rgba(11,7,8,.92) 100%),
  radial-gradient(ellipse 80% 70% at 50% 55%,transparent 40%,rgba(0,0,0,.7))}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flick 2.4s ease-in-out infinite}
.flame.b{animation-duration:3.1s;animation-delay:-1.1s}
.flame.c{animation-duration:2.7s;animation-delay:-.4s}
.glow{animation:breathe 5s ease-in-out infinite}
.glow.b{animation-duration:6.4s;animation-delay:-2s}
@keyframes flick{0%,100%{transform:scale(1,1) skewX(0)}30%{transform:scale(.92,1.08) skewX(2deg)}55%{transform:scale(1.05,.94) skewX(-2deg)}80%{transform:scale(.97,1.04) skewX(1deg)}}
@keyframes breathe{0%,100%{opacity:.85}40%{opacity:1}70%{opacity:.76}}
.hook{transform-box:view-box;animation:hook 7s ease-in-out infinite}
@keyframes hook{0%,100%{transform:rotate(0)}50%{transform:rotate(1.2deg)}}
.bulb{transform-origin:800px 0;animation:bulb 9s ease-in-out infinite}
@keyframes bulb{0%,100%{transform:rotate(-1.4deg)}50%{transform:rotate(1.4deg)}}
.bulb-light{animation:bulbflick 13s steps(1) infinite}
@keyframes bulbflick{0%,61%,63%,100%{opacity:1}62%{opacity:.35}}
.burner{transform-box:fill-box;transform-origin:50% 100%;animation:burn 1.2s ease-in-out infinite}
.burner:nth-of-type(2n){animation-duration:1.5s;animation-delay:-.6s}
@keyframes burn{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.18)}}

/* ---------- 画面の骨組み ---------- */
.app{position:relative;z-index:1;height:100%;display:grid;grid-template-rows:auto auto 1fr;grid-template-columns:minmax(0,1fr);max-width:1240px;margin:0 auto;padding-inline:16px;box-sizing:border-box}

/* 上部 */
.topbar{display:flex;align-items:center;gap:14px;padding-block:12px 10px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:14px;margin-right:auto;min-width:0}
.brand b{font-family:var(--f-display);font-weight:800;letter-spacing:.3em;font-size:16px;white-space:nowrap}
.clock{font-family:var(--f-label);letter-spacing:.14em;font-size:13px;color:var(--gold);font-variant-numeric:tabular-nums;white-space:nowrap}
.search-wrap{position:relative;flex:0 1 260px;min-width:0}
.search{width:100%;box-sizing:border-box;padding:7px 12px 7px 32px;background:rgba(11,7,8,.7);border:1px solid rgba(191,154,94,.28);color:var(--ivory);font:inherit;font-size:13px}
.search::placeholder{color:#7d6e63}
.search-wrap svg{position:absolute;left:10px;top:50%;width:14px;height:14px;margin-top:-7px;fill:none;stroke:var(--gold-dim);stroke-width:1.5}
.tools{display:flex;gap:6px}
.tool{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid rgba(191,154,94,.25);background:rgba(11,7,8,.55);font-size:12px;letter-spacing:.1em;color:var(--smoke);transition:color .3s,border-color .3s}
.tool:hover,.tool[aria-pressed="true"]{color:var(--ivory);border-color:var(--gold-dim)}
.tool svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.4}

/* 音のつまみ */
.sound-wrap{position:relative}
.mixer{position:absolute;right:0;top:calc(100% + 8px);z-index:50;width:260px;box-sizing:border-box;padding:16px;background:var(--ink-2);border:1px solid rgba(191,154,94,.3);box-shadow:0 16px 40px rgba(0,0,0,.6);display:grid;gap:12px}
.mixer label{display:grid;gap:2px;font-size:12px;letter-spacing:.1em;color:var(--smoke)}
.mixer input[type=range]{width:100%;accent-color:var(--crimson)}
.mix-on{justify-self:start;padding:6px 14px;border:1px solid var(--gold-dim);font-size:13px;letter-spacing:.12em}
.mix-on[aria-pressed="true"]{background:rgba(155,26,41,.25);border-color:var(--crimson)}
.mixer .hint{margin:0;font-size:11px;color:#8a7a6d;line-height:1.6}

/* 伝票レール＝カテゴリ */
.rail-wrap{position:relative;padding-top:4px;margin-bottom:6px}
.rail{height:10px;border-radius:5px;background:linear-gradient(180deg,var(--brass-hi),var(--gold) 40%,#5d4a2c);box-shadow:0 6px 14px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.35)}
.stops{list-style:none;margin:-14px 0 0;padding:0;display:grid;grid-template-columns:repeat(5,1fr)}
.stop button{display:grid;justify-items:center;width:100%;padding-bottom:6px;color:var(--smoke);transition:color .3s}
.stop .pin{width:14px;height:22px;border-radius:3px;background:linear-gradient(90deg,#4b3a22,var(--gold-dim),#4b3a22);box-shadow:0 2px 4px rgba(0,0,0,.6);transition:background .3s,transform .4s var(--ease)}
.stop .nm{font-family:var(--f-display);font-weight:700;letter-spacing:.18em;font-size:14px;margin-top:4px;white-space:nowrap}
.stop .en{font-family:var(--f-label);letter-spacing:.2em;font-size:10px;opacity:.7}
.stop .ct{font-family:var(--f-label);font-size:11px;color:var(--gold-dim);margin-left:4px}
.stop button:hover{color:var(--ivory)}
.stop button[aria-current="true"]{color:var(--ivory)}
.stop button[aria-current="true"] .pin{background:linear-gradient(90deg,#7a5c2c,var(--brass-hi),#7a5c2c);transform:translateY(2px)}
.stop button[aria-current="true"] .nm{border-bottom:1px solid var(--gold)}

/* 2画面 */
.panes{display:grid;grid-template-columns:300px minmax(0,1fr);gap:28px;min-height:0;padding-bottom:16px}

/* 左：伝票の一覧 */
.list{min-height:0;overflow:auto;padding:10px 6px 20px 2px;display:grid;gap:12px;align-content:start;overscroll-behavior:contain}
.list-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding-inline:2px}
.list-head .label{font-size:11px}
.list-head span{font-size:12px;color:var(--smoke)}
.slip{position:relative;display:block;width:100%;text-align:left;color:var(--slip-ink);background:repeating-linear-gradient(transparent 0 23px,rgba(43,29,25,.06) 23px 24px),var(--slip);padding:14px 16px 16px;box-shadow:0 8px 20px rgba(0,0,0,.45);transform-origin:50% 0;transition:transform .45s var(--ease),box-shadow .45s;animation:drop .55s var(--ease) both;
  -webkit-mask:radial-gradient(circle 4px at 50% 100%,transparent 98%,#000) 0 100%/11px 8px repeat-x,linear-gradient(#000,#000) 0 0/100% calc(100% - 7px) no-repeat;
          mask:radial-gradient(circle 4px at 50% 100%,transparent 98%,#000) 0 100%/11px 8px repeat-x,linear-gradient(#000,#000) 0 0/100% calc(100% - 7px) no-repeat}
.slip{transform:rotate(var(--r,0deg))}
@keyframes drop{from{opacity:0;transform:translateY(-14px) rotate(-1.5deg)}to{opacity:1;transform:rotate(var(--r,0deg))}}
.slip:hover{transform:translateX(4px) rotate(calc(var(--r,0deg) - .4deg));box-shadow:0 12px 26px rgba(0,0,0,.55)}
.slip[aria-current="true"]{transform:translateX(12px) rotate(var(--r,0deg));box-shadow:0 14px 30px rgba(0,0,0,.6),-4px 0 0 var(--stamp)}
/* 伝票の紙：繊維・ムラ・縁の焼け・ピン穴 */
.slip::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:2;background-image:var(--grain),var(--mottle);background-size:220px,520px;mix-blend-mode:multiply;opacity:.8}
.slip::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:2;box-shadow:inset 0 0 26px rgba(110,70,30,.32);background:radial-gradient(circle 3px at 50% 8px,#3a2219 55%,rgba(58,34,25,.3) 70%,transparent 80%)}
.slip-top{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid rgba(179,32,47,.5);padding-bottom:4px;margin-bottom:6px}
.slip-top small{font-family:var(--f-label);letter-spacing:.2em;font-size:11px;color:var(--stamp)}
.slip-top b{font-family:var(--f-label);font-size:15px;letter-spacing:.06em;font-variant-numeric:tabular-nums}
.slip-title{display:block;font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:.08em;line-height:1.4}
.slip-sum{display:block;font-size:12.5px;color:var(--slip-sub);line-height:1.6;margin-top:3px}
.slip-tags{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.tag{font-size:10.5px;letter-spacing:.1em;padding:0 6px;border:1px solid currentColor;color:#8a7868}
.tag.cat{color:var(--stamp)}
.slip .seal{position:absolute;right:12px;bottom:14px;width:30px;height:30px;border:2px solid var(--stamp);border-radius:50%;color:var(--stamp);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:12px;transform:rotate(-12deg) scale(1.8);opacity:0;mix-blend-mode:multiply;transition:transform .25s cubic-bezier(.3,1.6,.5,1),opacity .15s}
.slip[aria-current="true"] .seal{transform:rotate(-12deg) scale(1);opacity:.85}
.list .empty{color:var(--smoke);font-size:13px;padding:8px 4px}

/* 右：本文 */
.reader{min-height:0;overflow:auto;padding:10px 4px 24px;overscroll-behavior:contain;scroll-behavior:smooth}
.mobile-back{display:none}
.doc{position:relative;max-width:760px;transform-origin:50% 0}
.doc.flip{animation:flip .6s var(--ease)}
@keyframes flip{from{opacity:0;transform:perspective(1200px) rotateX(-12deg) translateY(-8px)}to{opacity:1;transform:none}}
.doc-inner{padding:clamp(22px,4.5vw,46px)}
.doc .crumb{display:flex;gap:8px;flex-wrap:wrap;align-items:baseline;font-size:12px;letter-spacing:.12em}
.doc h1{margin:.25em 0 .2em;font-family:var(--f-display);font-weight:800;font-size:clamp(28px,4.5vw,40px);letter-spacing:.12em;line-height:1.3;text-wrap:balance}
.doc .meta{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;letter-spacing:.12em;margin-bottom:20px}
.doc p{margin:0 0 1em;max-width:36em}
.doc .sec{margin:24px 0 8px;font-family:var(--f-display);font-weight:700;letter-spacing:.2em;font-size:15px}
.badge{display:inline-block;font-size:11px;letter-spacing:.15em;padding:0 8px;border:1px solid currentColor;vertical-align:middle;margin-left:8px;font-family:var(--f-body)}
.doc .unset-p{opacity:.65}
.doc ul.open{margin:0 0 1em;padding-left:1.2em;opacity:.7}
.fields{display:grid;grid-template-columns:max-content 1fr;gap:6px 22px;margin:4px 0 20px;font-size:14px}
.fields dt{letter-spacing:.15em;opacity:.7}
.fields dd{margin:0;min-width:0}
.fields .unset-v{opacity:.55;text-decoration:underline dotted;text-underline-offset:5px}
.rel{margin-top:28px;padding-top:14px;border-top:1px solid currentColor;border-color:rgba(127,100,64,.35)}
.rel-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;margin-top:8px}
.rel-btn{display:grid;gap:0;text-align:left;padding:8px 12px;border:1px solid currentColor;opacity:.85;transition:opacity .3s,transform .3s var(--ease)}
.rel-btn:hover{opacity:1;transform:translateY(-2px)}
.rel-btn small{font-family:var(--f-label);letter-spacing:.15em;font-size:10.5px;opacity:.75}
.rel-btn b{font-weight:600;font-size:14px}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:16px;font-size:13px;max-width:760px}
.pager button{color:var(--smoke);letter-spacing:.08em}
.pager button:hover{color:var(--ivory)}

/* 紙の質感：繊維・染み・縁の焼け・折り目 */
.doc::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:2;background-image:var(--grain),var(--mottle),var(--foxing);background-size:220px,640px,820px;mix-blend-mode:multiply;opacity:.85}
.doc::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:2;box-shadow:inset 0 0 90px rgba(96,56,24,.45),inset 0 0 10px rgba(96,56,24,.4);background:linear-gradient(180deg,transparent 41.4%,rgba(70,40,20,.13) 41.85%,rgba(255,250,235,.28) 42.05%,transparent 42.6%),linear-gradient(90deg,transparent 63.6%,rgba(70,40,20,.07) 63.9%,rgba(255,250,235,.16) 64.05%,transparent 64.5%)}
.doc.facility::before,.doc.menu::before{mix-blend-mode:screen;opacity:.16}
.doc.facility::after,.doc.menu::after{box-shadow:inset 0 0 100px rgba(0,0,0,.75);background:linear-gradient(180deg,transparent 41.6%,rgba(0,0,0,.35) 42%,rgba(191,154,94,.08) 42.15%,transparent 42.6%)}

/* 血のにじみ */
.stains{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:3}
.stain{position:absolute;background-size:100% 100%;background-repeat:no-repeat;mix-blend-mode:multiply;opacity:0;transform:scale(.8);transition:opacity 3.2s ease .25s,transform 4.5s var(--ease) .25s}
.ready .stain,.slip .stain{opacity:var(--o,.8);transform:none}
.slip .stain{transition:none}
.doc.facility .stain,.doc.menu .stain{mix-blend-mode:normal;filter:brightness(.62) saturate(1.3)}
.drip{position:absolute;width:5px;height:0;border-radius:0 0 3px 3px;background:linear-gradient(rgba(108,8,16,.05),rgba(108,8,16,.5));mix-blend-mode:multiply;transition:height 9s cubic-bezier(.45,0,.2,1) 2.8s}
.drip::after{content:"";position:absolute;left:-2.5px;bottom:-7px;width:10px;height:12px;border-radius:50% 50% 50% 50%/62% 62% 40% 40%;background:rgba(108,8,16,.55)}
.ready .drip{height:var(--h,70px)}
.doc.facility .drip,.doc.menu .drip{mix-blend-mode:normal;filter:brightness(.7)}

/* 記事の見せ方（カテゴリ別） */
.doc.world{background:linear-gradient(90deg,rgba(80,40,20,.12),transparent 8%,transparent 92%,rgba(80,40,20,.12)),#e6dac0;color:#2a1a16}
.doc.world .doc-inner{background:repeating-linear-gradient(transparent 0 29px,rgba(42,26,22,.07) 29px 30px);border-left:2px double rgba(155,26,41,.45);margin-left:clamp(10px,3vw,28px)}
.doc.world .meta,.doc.world .label,.doc.world .crumb{color:#7a2a24}
.doc.creature{background:#efe6d2;color:#2a1a16;border:1px solid #c9b48c}
.doc.creature .doc-inner{border:1px solid rgba(42,26,22,.25);margin:10px}
.doc.creature .label,.doc.creature .meta,.doc.creature .crumb{color:#6e5530}
.doc.creature .fields{border-block:1px solid rgba(42,26,22,.2);padding-block:12px}
.doc.facility{background:linear-gradient(rgba(191,154,94,.07) 1px,transparent 1px) 0 0/24px 24px,linear-gradient(90deg,rgba(191,154,94,.07) 1px,transparent 1px) 0 0/24px 24px,#141012;color:var(--ivory);border:1px solid var(--gold-dim)}
.doc.facility .label,.doc.facility .meta,.doc.facility .crumb{color:var(--gold)}
.doc.menu{background:radial-gradient(ellipse at 50% 0,#2a0c11,#120708 70%);color:var(--ivory);border:1px solid var(--gold-dim);text-align:center}
.doc.menu .doc-inner{border:1px solid rgba(191,154,94,.35);margin:12px;outline:1px solid rgba(191,154,94,.15);outline-offset:-8px}
.doc.menu p{margin-inline:auto}
.doc.menu .label,.doc.menu .meta,.doc.menu .crumb{color:var(--gold);justify-content:center}
.doc.menu .fields{text-align:left;max-width:30em;margin-inline:auto}
.doc.menu ul.open{display:inline-block;text-align:left}
.orn{display:block;margin:6px auto 4px;width:120px;height:10px;fill:none;stroke:var(--gold);stroke-width:1}
.doc.guide{background:#e9e4da;color:#211a18;border-top:6px solid var(--crimson)}
.doc.guide .label,.doc.guide .meta,.doc.guide .crumb{color:#7d1a24}
.doc.guide .gstamp{position:absolute;right:28px;top:40px;transform:rotate(8deg);border:2px solid rgba(155,26,41,.55);color:rgba(155,26,41,.7);padding:2px 10px;font-family:var(--f-display);font-weight:800;letter-spacing:.2em;font-size:13px}
.doc.guide ol{padding-left:1.4em;margin:0 0 1em}

/* ---------- 開始画面：伝票が出てくる ---------- */
#start{position:fixed;inset:0;z-index:80;display:grid;place-items:center;align-content:center;gap:22px;text-align:center;padding-inline:16px;background:radial-gradient(ellipse 60% 55% at 50% 45%,#2a0d12,var(--ink) 72%);transition:opacity .9s}
#start.gone{opacity:0;pointer-events:none}
#start h2{margin:0;font-family:var(--f-display);font-weight:800;font-size:clamp(34px,7vw,62px);letter-spacing:.32em;padding-left:.32em;line-height:1.2}
#start .sub{color:var(--smoke);letter-spacing:.25em;font-size:13px;margin:-10px 0 0}
.printer{position:relative;width:min(260px,70vw);height:170px}
.slot{position:absolute;left:0;right:0;top:0;height:16px;border-radius:3px;background:linear-gradient(180deg,#000,#1d1414);border:1px solid var(--gold-dim);box-shadow:inset 0 3px 6px #000}
.feed{position:absolute;left:14%;right:14%;top:9px;height:155px;overflow:hidden}
.feed-slip{background:var(--slip);color:var(--slip-ink);padding:14px 16px;text-align:left;transform:translateY(-100%);animation:feed 2.4s steps(22,end) .4s forwards}
.feed-slip p{margin:0;font-size:12px;letter-spacing:.1em}
.feed-slip b{font-family:var(--f-label);font-size:18px;letter-spacing:.08em;color:var(--stamp)}
@keyframes feed{to{transform:translateY(0)}}

/* ---------- 動きを減らす ---------- */

/* ---------- 狭い画面：一覧 → 本文を切り替える ---------- */

  .clock{display:none}

}

<script>
(()=>{
const $=s=>document.querySelector(s);
const root=document.documentElement;
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const reduced=()=>root.dataset.motion==="reduced"||(matchMedia("(prefers-reduced-motion: reduce)").matches&&root.dataset.motion!=="full");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- 紙と血の質感（その場で生成） ---------- */
function rng(seed){let a=seed>>>0;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hash(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
const uri=svg=>`url('data:image/svg+xml,${encodeURIComponent(svg).replace(/'/g,"%27")}')`;
(function textures(){
  const grain=`<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .42 0 0 0 0 .3 0 0 0 0 .2 1.5 0 0 0 -.55'/></filter><rect width='100%' height='100%' filter='url(#n)'/></svg>`;
  const mottle=`<svg xmlns='http://www.w3.org/2000/svg' width='640' height='640'><filter id='m'><feTurbulence type='fractalNoise' baseFrequency='.008 .014' numOctaves='4' seed='7' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5 0 0 0 0 .34 0 0 0 0 .18 1.1 0 0 0 -.42'/></filter><rect width='100%' height='100%' filter='url(#m)'/></svg>`;
  const r=rng(42);let spots="";
  for(let i=0;i<9;i++){spots+=`<circle cx='${r()*820}' cy='${r()*820}' r='${1.5+r()*7}' fill='#8a5a2a' fill-opacity='${.12+r()*.2}'/>`}
  const foxing=`<svg xmlns='http://www.w3.org/2000/svg' width='820' height='820'><filter id='b'><feGaussianBlur stdDeviation='1.6'/></filter><g filter='url(#b)'>${spots}</g></svg>`;
  root.style.setProperty("--grain",uri(grain));
  root.style.setProperty("--mottle",uri(mottle));
  root.style.setProperty("--foxing",uri(foxing));
})();
function stainSVG(kind,seed){
  const r=rng(seed);let body="",disp=50,freq=.022;const C="#6e0a12",D="#470509";
  if(kind==="blot"){
    const R=58+r()*30;let sat="";
    for(let i=0,n=5+(r()*6|0);i<n;i++){const a=r()*6.283,d=R+16+r()*72,s=3+r()*12;sat+=`<circle cx='${200+Math.cos(a)*d}' cy='${200+Math.sin(a)*d}' r='${s}'/>`}

const SPOTS=[

function stainsFor(id,cat){
  const r=rng(hash(id));

  const n=cat==="facility"?1:cat==="guide"?2:2+(r()<.55?1:0);

function torn(seed){
  const r=rng(seed),top=[],bot=[];

  for(let x=100;x>=0;x-=2)bot.push(`${x}% ${(100-r()*.7).toFixed(2)}%`);

/* ---------- 音（既定は切。すべてその場で合成） ----------
   店内の音楽：蓄音機で流れているような、ゆったりした三拍子のピアノ（イ短調）
   店内の物音：部屋の空気、食器、厨房の火
   奥から聞こえる音：壁越しにこもった、包丁・骨・のこぎりの音 */
const sound=(()=>{
  let ctx=null,out,rev,musicBus,musicLP,roomBus,backBus,backLP,sizzle,hum;
  let on=false,where="reception",musicTimer=null,roomTimer=null,backTimer=null;
  const vol={music:.6,room:.5,back:.45};
  const mtof=m=>440*Math.pow(2,(m-69)/12);
  const R=()=>Math.random();
  const noiseBuf=sec=>{const b=ctx.createBuffer(1,Math.ceil(ctx.sampleRate*sec),ctx.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=R()*2-1;return b};
  let nb=null;
  function impulse(sec,decay){const n=Math.ceil(ctx.sampleRate*sec),b=ctx.createBuffer(2,n,ctx.sampleRate);for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<n;i++)d[i]=(R()*2-1)*Math.pow(1-i/n,decay)}return b}
  function filt(type,f,q=.7){const x=ctx.createBiquadFilter();x.type=type;x.frequency.value=f;x.Q.value=q;return x}
  function gain(v){const g=ctx.createGain();g.gain.value=v;return g}

  function init(){
    ctx=new (window.AudioContext||window.webkitAudioContext)();nb=noiseBuf(3);
    out=gain(0);out.connect(ctx.destination);
    rev=ctx.createConvolver();rev.buffer=impulse(2.8,2.4);const rg=gain(.32);rev.connect(rg).connect(out);
    // 音楽：蓄音機らしく帯域を狭め、残響を足す
    musicBus=gain(vol.music*.55);const mhp=filt("highpass",150);musicLP=filt("lowpass",3600);
    musicBus.connect(mhp).connect(musicLP);musicLP.connect(out);const ms=gain(.6);musicLP.connect(ms).connect(rev);
    // 針のノイズ
    const ck=ctx.createBuffer(1,ctx.sampleRate*4,ctx.sampleRate),cd=ck.getChannelData(0);
    for(let i=0;i<cd.length;i++)cd[i]=(R()<.0007?(R()*2-1)*.9:0)+(R()*2-1)*.012;
    const crackle=ctx.createBufferSource();crackle.buffer=ck;crackle.loop=true;const cg=gain(.35);crackle.connect(filt("bandpass",2400,.5)).connect(cg).connect(musicBus);crackle.start();
    // 店内の物音
    roomBus=gain(vol.room);roomBus.connect(out);const rs=gain(.25);roomBus.connect(rs).connect(rev);
    const air=ctx.createBufferSource();air.buffer=nb;air.loop=true;air.connect(filt("lowpass",240)).connect(gain(.32)).connect(roomBus);air.start();
    const sz=ctx.createBufferSource();sz.buffer=nb;sz.loop=true;sizzle=gain(0);sz.connect(filt("highpass",3800)).connect(sizzle).connect(roomBus);sz.start();
    const ho=ctx.createOscillator();ho.frequency.value=56;hum=gain(0);ho.connect(hum).connect(roomBus);ho.start();
    // 奥から聞こえる音：壁越し
    backBus=gain(vol.back);backLP=filt("lowpass",380);backBus.connect(backLP).connect(out);const bs=gain(.5);backLP.connect(bs).connect(rev);
  }

  /* --- 楽器 --- */
  let wowT=0;
  function piano(bus,t,m,v,dur,bright=2800,detune=0){
    const f=mtof(m),g=ctx.createGain(),lp=filt("lowpass",bright);
    const wow=Math.sin(wowT+t*.55)*7;   // ゆっくりした回転ムラ
    [[ "triangle",1,1],["sine",2.002,.28],["sine",3.01,.08]].forEach(([type,mul,a])=>{
      const o=ctx.createOscillator(),og=gain(a);o.type=type;o.frequency.value=f*mul;o.detune.value=wow+detune;o.connect(og).connect(lp);o.start(t);o.stop(t+dur+.1)});
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.008);g.gain.exponentialRampToValueAtTime(v*.35,t+.35);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    lp.connect(g).connect(bus);
  }
  function burst(bus,t,dur,type,f,q,v,attack=.002){
    const s=ctx.createBufferSource();s.buffer=nb;const fl=filt(type,f,q),g=ctx.createGain();
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+attack);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    s.connect(fl).connect(g).connect(bus);s.start(t,R()*2);s.stop(t+dur+.05);return fl;
  }
  function thump(bus,t,f0,f1,v,dur){const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur*.6);
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(bus);o.start(t);o.stop(t+dur+.05)}

  /* --- 店内の音楽 --- */
  const CH=[ // [ベース, 和音]
    [45,[57,60,64]],[41,[57,60,65]],[38,[57,62,65]],[40,[56,59,64]],
    [45,[57,60,64]],[41,[57,60,65]],[38,[57,62,65]],[40,[56,59,62]]];
  const SCALE=[69,71,72,74,76,77,80,81,83,84,86,88];
  const tones=c=>c[1].map(n=>n+12).concat(c[1].map(n=>n+24)).filter(n=>n>=69&&n<=88);
  function phrase(lift){
    const bars=[];let cur=SCALE.indexOf(76);
    CH.forEach((c,bi)=>{
      const tt=tones(c),notes=[];
      const near=tt.reduce((a,b)=>Math.abs(b-SCALE[cur]-lift)<Math.abs(a-SCALE[cur]-lift)?b:a);
      notes.push(near);cur=Math.max(0,SCALE.indexOf(SCALE.find(s=>s>=near))||0);
      for(let k=0;k<2;k++){
        if(R()<.22){notes.push(null);continue}
        cur=Math.min(SCALE.length-1,Math.max(0,cur+[-2,-1,-1,1,1,2][Math.floor(R()*6)]));notes.push(SCALE[cur]);
      }
      if(bi===7){notes[1]=null;notes[2]=null}
      bars.push(notes);
    });
    return bars;
  }
  let form=[],formIdx=0,beat=0,nextT=0,A=null,B=null,cycle=0;
  function newForm(){A=phrase(0);B=phrase(5);form=[A,A,B,A];formIdx=0;cycle++}
  function scheduleMusic(){
    const spb=60/(62+Math.sin(cycle)*2);
    while(nextT<ctx.currentTime+.4){
      const bar=Math.floor(beat/3)%8,b=beat%3,ph=form[formIdx],c=CH[bar];
      const swing=(R()-.5)*.03;const t=nextT+swing;
      if(b===0)piano(musicBus,t,c[0],.22,2.6,900);
      else c[1].forEach((n,i)=>piano(musicBus,t+i*.012,n,.055,1.1,1600));
      const m=ph[bar][b];
      if(m){const odd=R()<.035?-38:0;   // ごくまれに、レコードが歪んだように音程が沈む
        piano(musicBus,t+.02,m,.13+R()*.04,2.4,3000,odd);}
      beat++;nextT+=spb;
      if(beat%24===0){formIdx++;if(formIdx>=form.length)newForm();}
    }
  }

  /* --- 店内の物音 --- */
  function clink(t,far){const v=far?.05:.12;[2630,3940,5210].forEach((f,i)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=f*(far?.93:1)*(1+(R()-.5)*.03);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v/(i+1.4),t+.004);g.gain.exponentialRampToValueAtTime(.0001,t+(far?1.4:.9));o.connect(g).connect(roomBus);o.start(t);o.stop(t+1.5)})}
  function bell(v=.2){if(!on)return;const t=ctx.currentTime;[1760,2640,4180].forEach((f,i)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=f;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v/(i+1.4),t+.005);g.gain.exponentialRampToValueAtTime(.0001,t+1.8);o.connect(g).connect(roomBus);o.start(t);o.stop(t+1.9)})}
  function roomLoop(){roomTimer=setTimeout(()=>{if(!on)return;const t=ctx.currentTime+.05;
    if(where==="reception"&&R()<.3)bell(.06);
    else{clink(t,where!=="dining"||R()<.4);if(R()<.4)clink(t+.15+R()*.3,true)}
    roomLoop()},6000+R()*11000)}

  /* --- 奥から聞こえる音（解体） --- */
  function chop(t,v){thump(backBus,t,130,48,.9*v,.28);burst(backBus,t,.07,"bandpass",1300,.9,.55*v);burst(backBus,t+.012,.16,"lowpass",650,.7,.28*v,.01)}
  function crack(t,v){for(let i=0;i<3;i++)burst(backBus,t+i*.013+R()*.01,.04,"highpass",2200,.6,.45*v);burst(backBus,t,.09,"bandpass",3200,3,.2*v)}
  function saw(t,strokes,v){for(let i=0;i<strokes;i++){const st=t+i*.48;const f=burst(backBus,st,.42,"bandpass",800,2.2,.32*v,.18);
    f.frequency.setValueAtTime(i%2?1100:720,st);f.frequency.linearRampToValueAtTime(i%2?720:1100,st+.4)}return t+strokes*.48}
  function drip(t){const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.setValueAtTime(1300,t);o.frequency.exponentialRampToValueAtTime(520,t+.08);
    g.gain.setValueAtTime(.08,t);g.gain.exponentialRampToValueAtTime(.0001,t+.12);o.connect(g).connect(backBus);o.start(t);o.stop(t+.15)}
  function backEvent(){
    let t=ctx.currentTime+.1;const v=.6+R()*.4;
    const r=R();
    if(r<.55){const n=2+Math.floor(R()*4);for(let i=0;i<n;i++){chop(t,v*(.8+R()*.3));if(R()<.25)crack(t+.05,v);t+=.55+R()*.35}}
    else if(r<.85){t=saw(t,3+Math.floor(R()*4),v);crack(t+.1,v)}
    else{chop(t,v);t+=1.4;chop(t,v*.7)}
    if(where==="butchery")for(let i=0;i<3;i++)drip(t+1+i*(.9+R()*.6));
  }
  function backLoop(){const near=where==="butchery";backTimer=setTimeout(()=>{if(!on)return;backEvent();backLoop()},(near?7000:20000)+R()*(near?8000:26000))}

  /* --- 場所ごとの聞こえ方 --- */
  function place(s){
    where=s||"reception";if(!ctx)return;const t=ctx.currentTime;
    const mLP={reception:3400,dining:3800,kitchen:1500,butchery:520}[where];
    const bLP={reception:340,dining:380,kitchen:900,butchery:2600}[where];
    musicLP.frequency.setTargetAtTime(mLP,t,.8);backLP.frequency.setTargetAtTime(bLP,t,.8);
    musicBus.gain.setTargetAtTime(vol.music*.55*(where==="butchery"?.55:1),t,.8);
    sizzle.gain.setTargetAtTime(where==="kitchen"?.035:0,t,.6);hum.gain.setTargetAtTime(where==="butchery"?.045:0,t,.6);
  }
  function setVol(k,v){vol[k]=v;if(!ctx)return;const t=ctx.currentTime;
    if(k==="music")place(where);if(k==="room")roomBus.gain.setTargetAtTime(v,t,.2);if(k==="back")backBus.gain.setTargetAtTime(v,t,.2)}
  function page(){if(!on)return;burst(roomBus,ctx.currentTime,.22,"bandpass",2300,.8,.12,.01)}
  function start(){
    if(!ctx)init();on=true;ctx.resume();
    out.gain.setTargetAtTime(.8,ctx.currentTime,.8);place(where);
    if(!form.length)newForm();nextT=ctx.currentTime+.3;
    clearInterval(musicTimer);musicTimer=setInterval(scheduleMusic,120);
    clearTimeout(roomTimer);roomLoop();clearTimeout(backTimer);backTimer=setTimeout(()=>{if(on){backEvent();backLoop()}},9000+R()*6000);
  }
  function stop(){on=false;if(!ctx)return;out.gain.setTargetAtTime(0,ctx.currentTime,.3);clearInterval(musicTimer);clearTimeout(roomTimer);clearTimeout(backTimer)}
  return {start,stop,get on(){return on},bell,page,place,setVol,vol};
})();

/* ---------- 音のつまみ ---------- */
const tsnd=$("#t-sound"),mixer=$("#mixer"),mixOn=$("#mix-on");
function syncSound(){const v=sound.on;mixOn.setAttribute("aria-pressed",String(v));mixOn.textContent=v?"音を止める":"音を出す";$("#snd-label").textContent=v?"音：入":"音：切";$("#snd-wave").setAttribute("opacity",v?"1":".35")}
function openMixer(o){mixer.hidden=!o;tsnd.setAttribute("aria-expanded",String(o))}
tsnd.onclick=e=>{e.stopPropagation();if(!sound.on){sound.start();syncSound();openMixer(true)}else openMixer(mixer.hidden)};
mixOn.onclick=()=>{sound.on?sound.stop():sound.start();syncSound()};
mixer.addEventListener("click",e=>e.stopPropagation());
document.addEventListener("click",()=>openMixer(false));
document.addEventListener("keydown",e=>{if(e.key==="Escape")openMixer(false)});
["music","room","back"].forEach(k=>{const el=$("#v-"+k);const sv=store.get("jr-v-"+k);if(sv!==null)el.value=sv;sound.setVol(k,el.value/100);
  el.oninput=()=>{sound.setVol(k,el.value/100);store.set("jr-v-"+k,el.value)}});

/* ---------- 初期表示 ---------- */
const h=location.hash.slice(1);
const first=byId[h]?h:"origin";
cat=byId[first].cat;cur=first;
drawStops();drawList(true);show(first,{anim:false});
if(byId[h]&&innerWidth<=820)app.classList.add("reading");
})();
</script>
