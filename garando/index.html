<title>伽藍堂 妖怪資料</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&family=Shippori+Mincho:wght@400;600;800&family=Klee+One:wght@400;600&display=swap">
<style>
/* がらんとした暗い堂の床に、破れた古紙が一枚ずつ置かれている。灯りは一つ。紙の外から瘴気が蠢き寄る。 */
/* 堂の闇に固定した単一テーマ */
:root{
  --yuka:#1b1410;
  --yami:#070504;
  --ink:#1f1813;
  --ink-soft:#57483a;
  --ink-faint:rgba(31,24,19,.22);
  --shu:#a52a20;
  --sun:#d39718;
  --note:#34425a;
  --sumi:#120c09;
  --f-brush:"Yuji Syuku","Shippori Mincho","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP","Noto Serif CJK JP",serif;
  --f-body:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP","Noto Serif CJK JP",serif;
  --f-hand:"Klee One","Hiragino Maru Gothic ProN","Yu Gothic","Noto Sans JP","Noto Sans CJK JP",sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html{background:var(--yami);overflow-x:hidden;overflow-y:scroll;scrollbar-gutter:stable}
body{
  margin:0;color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.95;
  background-color:var(--yuka);background-size:420px 420px;
  min-height:100vh;padding-inline:16px;padding-block:34px 70px;overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}

/* ── 堂の空気（すべて静止画か、transform/opacityだけで動く） ── */
.yami{position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(70% 60% at 50% 38%, transparent 0%, rgba(7,5,4,.55) 55%, rgba(7,5,4,.96) 100%)}
.kiri{position:fixed;left:0;top:0;width:100%;height:100%;z-index:5;pointer-events:none}
.hikari{position:fixed;inset:0;z-index:6;pointer-events:none;opacity:0;
  background:
    linear-gradient(115deg, transparent 22%, rgba(255,214,140,.07) 32%, rgba(255,226,160,.26) 42%, rgba(255,238,196,.2) 51%, rgba(255,214,140,.06) 61%, transparent 70%),
    radial-gradient(45% 32% at 18% 6%, rgba(255,232,180,.3), transparent 70%)}
.kakera{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:0;transition:opacity 3s ease}
.kakera.on{opacity:1}
.kakera span{position:absolute;padding:6px 12px 8px;background:#8e7f63;color:#241a12;font:15px var(--f-brush);letter-spacing:.2em;
  box-shadow:0 8px 16px rgba(0,0,0,.6);
  clip-path:polygon(3% 8%,22% 0,48% 6%,74% 1%,97% 9%,100% 52%,95% 94%,63% 100%,36% 93%,8% 100%,0 60%);
  animation:tadayou var(--d) ease-in-out var(--dl) infinite alternate;will-change:transform}
@keyframes tadayou{from{transform:translate3d(0,0,0) rotate(var(--r0))}to{transform:translate3d(var(--dx),var(--dy),0) rotate(var(--r1))}}

/* ── 紙 ── */
.stage{position:relative;z-index:3;max-width:780px;margin:0 auto}
.kasane{position:absolute;left:0;right:0;top:0;height:min(960px,calc(100vh - 110px));pointer-events:none}
.kasane i{position:absolute;inset:0;background:#4a3c2b;
  clip-path:polygon(1% 0,30% .4%,62% 0,99% .6%,100% 30%,99.4% 70%,100% 99%,64% 100%,33% 99.5%,0 100%,.5% 60%,0 22%)}
.kasane i:nth-child(1){transform:rotate(-2.2deg) translate(-14px,14px);background:#3b3024}
.kasane i:nth-child(2){transform:rotate(1.6deg) translate(16px,22px);background:#2c241b}
.sheet{position:relative;transform:translate3d(var(--sx,0),0,0) rotate(var(--tilt,0deg));transform-origin:50% 100%;
  padding:clamp(34px,6vw,70px) clamp(24px,6vw,76px) 92px;min-height:min(960px,calc(100vh - 110px))}
.sheet > .kage{position:absolute;inset:14px -6px -18px 10px;background:rgba(0,0,0,.75);filter:blur(16px);z-index:-1;border-radius:6px}
.sheet > canvas{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
.sheet > canvas.kami{z-index:0}
.sheet > canvas.urami{z-index:1;opacity:0;transform:scaleX(-1);transition:opacity 10s ease 20s}
.sheet > canvas.s1{z-index:2;opacity:0;transition:opacity 5s ease 3s}
.sheet > canvas.s2{z-index:2;opacity:0;transition:opacity 9s ease 11s}
.sheet > canvas.shiro{z-index:2;opacity:0;transition:opacity 8s ease 6s}
.sheet.ikiru > canvas.urami{opacity:var(--ura,0)}
.sheet.ikiru > canvas.s1{opacity:var(--o1,0)}
.sheet.ikiru > canvas.s2{opacity:var(--o2,0)}
.sheet.ikiru > canvas.shiro{opacity:1}
.sheet.zawameku > canvas.s1,.sheet.zawameku > canvas.s2{opacity:1;transition:opacity 3s ease 0s}
.sheet.zawameku > canvas.urami{opacity:.3;transition:opacity 4s ease 1s}
.sheet.hareru > canvas.s1,.sheet.hareru > canvas.s2,.sheet.hareru > canvas.urami{opacity:.12;transition:opacity 2s ease 0s}
.sheet.rinne.ikiru > canvas.s2{animation:iki 6.5s ease-in-out 12s infinite alternate}
@keyframes iki{from{opacity:var(--o2)}to{opacity:calc(var(--o2) * .25)}}
.leaf{position:relative;z-index:3}
.sheet.rinne .leaf{animation:zure 7s steps(1) infinite}
@keyframes zure{0%{transform:none}47%{transform:translate3d(1px,-.5px,0)}48%{transform:translate3d(-1.5px,.5px,0)}49%{transform:none}81%{transform:translate3d(.8px,0,0)}82%{transform:none}}
.sheet.yuku{position:fixed;z-index:4;pointer-events:none;will-change:transform;margin:0;box-sizing:border-box;transform-origin:50% 100%}
.sheet.yuku.fwd{animation:hiku .78s cubic-bezier(.5,0,.25,1) forwards}
.sheet.yuku.nokoru{z-index:1}
.sheet.kaeru{z-index:5;transform-origin:50% 100%;will-change:transform;animation:kaeru .78s cubic-bezier(.3,0,.2,1) both}
.sheet.yuku > .kage,.sheet.kaeru > .kage{inset:22px -14px -30px 18px;background:rgba(0,0,0,.85)}
@keyframes hiku{
  0%{transform:translate3d(var(--sx),0,0) rotate(var(--tilt)) scale(1)}
  18%{transform:translate3d(calc(var(--sx) - 1.5%),-6px,0) rotate(calc(var(--tilt) - 1deg)) scale(1.015)}
  100%{transform:translate3d(calc(var(--sx) - 120%),20px,0) rotate(calc(var(--tilt) - 7deg)) scale(1.015)}}
@keyframes kaeru{
  0%{transform:translate3d(calc(var(--sx) - 120%),20px,0) rotate(calc(var(--tilt) - 7deg)) scale(1.015)}
  82%{transform:translate3d(calc(var(--sx) + .4%),-4px,0) rotate(calc(var(--tilt) + .3deg)) scale(1.01)}
  100%{transform:translate3d(var(--sx),0,0) rotate(var(--tilt)) scale(1)}}
.sheet.matsu{visibility:hidden}
.sheet.kuru .leaf{animation:sumiiri 1s ease both}
@keyframes sumiiri{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){
  .sheet.yuku{display:none}
  .sheet.kaeru{animation:none}
  .sheet.kuru .leaf,.sheet.rinne .leaf,.kakera span{animation:none}
}

/* ── 操作部 ── */
.corner{position:absolute;bottom:6px;width:62px;height:62px;border:0;padding:0;cursor:pointer;background:none;z-index:4}
.corner span{position:absolute;inset:0;transition:transform .25s ease}
.corner.next{right:6px}
.corner.next span{background:linear-gradient(135deg,transparent 50%,#bba87f 50%,#d8c8a3 70%,#a8915f 100%);clip-path:polygon(100% 0,100% 100%,0 100%);transform-origin:100% 100%}
.corner.prev{left:6px}
.corner.prev span{background:linear-gradient(225deg,transparent 50%,#bba87f 50%,#d8c8a3 70%,#a8915f 100%);clip-path:polygon(0 0,100% 100%,0 100%);transform-origin:0 100%}
.corner:hover span,.corner:focus-visible span{transform:scale(1.2)}
.corner em{position:absolute;bottom:9px;font:600 12px var(--f-hand);color:var(--ink-soft);font-style:normal;letter-spacing:.1em;white-space:nowrap}
.corner.next em{right:66px}
.corner.prev em{left:66px}
.folio{position:absolute;left:0;right:0;bottom:28px;text-align:center;font:14px var(--f-brush);color:var(--ink-soft);letter-spacing:.3em;z-index:3}
.idx{position:absolute;top:22px;right:24px;z-index:4;width:40px;height:40px;border:2px solid var(--shu);border-radius:4px;color:var(--shu);font:20px var(--f-brush);display:grid;place-items:center;background:transparent;cursor:pointer;transform:rotate(4deg);opacity:.85;transition:opacity .2s,transform .2s}
.idx:hover,.idx:focus-visible{opacity:1;transform:rotate(-2deg) scale(1.06)}
.ensyutsu{all:unset;position:absolute;top:28px;right:78px;z-index:4;cursor:pointer;border:2px solid var(--sun);color:#7a5408;padding:1px 9px;border-radius:2px;font:13px var(--f-brush);letter-spacing:.12em;transform:rotate(-3deg);opacity:.85;line-height:1.7}
.ensyutsu:hover,.ensyutsu:focus-visible{opacity:1;background:rgba(211,151,24,.12)}
body.akarui .kiri,body.akarui .kakera{display:none}
body.akarui .hikari{opacity:.28!important}
body.akarui .sheet > canvas.s1,body.akarui .sheet > canvas.s2,body.akarui .sheet > canvas.urami,body.akarui .sheet > canvas.shiro{display:none}
body.akarui .sheet.rinne .leaf{animation:none}
.erabu-dan{display:grid;gap:12px;justify-items:center}
.erabu.chiisai button{padding:6px 14px;border-color:var(--sun);color:#7a5408}
.erabu.chiisai button b{font-size:17px}
.erabu.chiisai button[aria-pressed="true"]{background:var(--sun);color:#2a1d08}
button:focus-visible{outline:2px dashed var(--shu);outline-offset:4px}
.hint{position:relative;z-index:3;max-width:780px;margin:30px auto 0;text-align:center;color:#7d6c57;font:12px var(--f-hand);letter-spacing:.12em}

/* ── 紙面の書式 ── */
h1,h2,h3{font-family:var(--f-brush);font-weight:400;margin:0;color:var(--ink)}
h3{text-wrap:balance}
.midashi{display:flex;gap:28px;align-items:flex-start;margin-bottom:26px}
.midashi h2{writing-mode:vertical-rl;font-size:clamp(42px,7vw,66px);line-height:1.05;letter-spacing:.14em;flex:none;text-shadow:0 0 1px rgba(31,24,19,.7),1px 1px 0 rgba(31,24,19,.12)}
.midashi .lede-box{min-width:0;padding-top:6px}
.yomi{font:600 12px var(--f-hand);letter-spacing:.35em;color:var(--ink-soft);margin:0 0 6px}
p{margin:0 0 1em;max-width:34em}
.lede{font-size:17px}
h3{font-size:24px;margin:32px 0 10px;letter-spacing:.06em}
h3::before{content:"一";display:inline-block;margin-right:.4em;color:var(--shu);font-size:.8em;transform:translateY(-.1em)}
b,strong{font-weight:800}
.sen{height:10px;margin:26px 0;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 10' preserveAspectRatio='none'><path d='M2 6 C80 3 160 7 240 4.5 S360 5 398 4' stroke='%231f1813' stroke-width='1.6' fill='none' stroke-linecap='round' opacity='.55'/></svg>") center/100% 100% no-repeat}
.chuki{font-family:var(--f-hand);color:var(--note);font-size:15px;line-height:1.6;transform:rotate(-1.2deg);transform-origin:left}
.yohaku{position:absolute;right:-10px;font-family:var(--f-hand);color:var(--note);font-size:14px;line-height:1.5;transform:rotate(-4deg);max-width:8.5em;opacity:.92}
del{text-decoration:none;background:linear-gradient(transparent 46%,var(--ink) 46%,var(--ink) 54%,transparent 54%);opacity:.6}
.shuin{display:inline-grid;place-items:center;border:2.5px solid var(--shu);color:var(--shu);font-family:var(--f-brush);padding:2px 8px;border-radius:3px;letter-spacing:.15em;opacity:.85;transform:rotate(var(--r,-6deg));font-size:15px;line-height:1.4;
  -webkit-mask-image:radial-gradient(circle at 30% 40%,#000 55%,rgba(0,0,0,.55) 75%,#000 90%);mask-image:radial-gradient(circle at 30% 40%,#000 55%,rgba(0,0,0,.55) 75%,#000 90%)}
.shuin.maru{border-radius:50%;width:62px;height:62px;padding:0;font-size:22px;letter-spacing:0}
.shuin.oki{position:absolute;z-index:4}
.tobu{all:unset;cursor:pointer;font:18px var(--f-brush);letter-spacing:.15em;border-bottom:1px solid var(--shu);line-height:1.8}
.tobu:hover{color:var(--shu)}
.mikisai{color:var(--ink-soft);letter-spacing:.4em}

/* 墨塗り（ネタバレなし） */
body.fuseru [data-netabare]{background:var(--sumi);color:transparent!important;border-radius:2px 1px 3px 1px;box-decoration-break:clone;-webkit-box-decoration-break:clone;
  box-shadow:0 0 0 2px var(--sumi);user-select:none;text-shadow:none!important}
body.fuseru [data-netabare] *{visibility:hidden}
body.fuseru div[data-netabare],body.fuseru ol[data-netabare],body.fuseru ul[data-netabare],body.fuseru p[data-netabare]{display:block;margin-block:6px 16px;
  background:repeating-linear-gradient(180deg,var(--sumi) 0 1.35em,transparent 1.35em 1.95em)}
.fuuin{margin:40px auto;text-align:center;max-width:none}
.fuuin .shuin{font-size:40px;width:96px;height:96px;padding:0;border-width:4px;border-radius:50%}

/* 表紙 */
.hyoushi-men{min-height:min(820px,calc(100vh - 200px));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;position:relative}
.hyoushi-men .daisen{border:1.5px solid rgba(31,24,19,.6);padding:30px 24px;background:rgba(255,248,230,.18);box-shadow:inset 0 0 0 7px rgba(31,24,19,0),inset 0 0 0 8px rgba(31,24,19,.3)}
.hyoushi-men h1{writing-mode:vertical-rl;font-size:clamp(74px,15vw,128px);letter-spacing:.2em;line-height:1;text-shadow:0 0 2px rgba(31,24,19,.55)}
.hyoushi-men .fuku{position:absolute;left:clamp(0px,3vw,30px);top:10px;writing-mode:vertical-rl;font:15px var(--f-brush);letter-spacing:.5em;color:var(--ink-soft)}
.erabu{display:flex;flex-wrap:wrap;justify-content:center;gap:18px 26px}
.erabu button{all:unset;cursor:pointer;display:grid;justify-items:center;gap:2px;padding:10px 18px;border:2.5px solid var(--shu);color:var(--shu);border-radius:3px;transition:background .2s}
.erabu button b{font:400 21px var(--f-brush);letter-spacing:.22em}
.erabu button small{font:12px var(--f-hand);letter-spacing:.1em}
.erabu button:nth-child(1){transform:rotate(-2.5deg)}
.erabu button:nth-child(2){transform:rotate(2deg)}
.erabu button:hover,.erabu button:focus-visible{background:rgba(165,42,32,.08)}
.erabu button[aria-pressed="true"]{background:var(--shu);color:#efe3c8}
.erabu-chu{font:13px var(--f-hand);color:var(--ink-soft);letter-spacing:.1em;margin:0;text-align:center;max-width:none}

/* 目次 */
.mokuji{list-style:none;margin:0;padding:0;max-width:30em}
.mokuji li{break-inside:avoid}
.mokuji button{all:unset;cursor:pointer;display:flex;align-items:baseline;gap:10px;padding:7px 2px;width:100%;box-sizing:border-box;border-bottom:1px dotted rgba(31,24,19,.38);font:21px var(--f-brush);letter-spacing:.12em}
.mokuji .ko button{font-size:17px;padding-left:1.1em}
.mokuji .ko button::before{content:"└";font:13px var(--f-body);color:var(--ink-soft);margin-right:2px}
.mokuji button small{margin-left:auto;font:13px var(--f-body);color:var(--ink-soft);letter-spacing:.05em}
.mokuji button.yonda span::after{content:"・";color:var(--shu)}
.mokuji button:hover span{color:var(--shu)}
.kumi{font:600 12px var(--f-hand);letter-spacing:.35em;color:var(--ink-soft);margin:20px 0 0}
.mokuji-shita{display:flex;flex-wrap:wrap;gap:12px 28px;align-items:center;margin-top:30px}
.kirikae{all:unset;cursor:pointer;border:2px solid var(--shu);color:var(--shu);padding:3px 12px;font:15px var(--f-brush);letter-spacing:.15em;border-radius:2px}
.arata{all:unset;cursor:pointer;font:13px var(--f-hand);color:var(--note);border-bottom:1px dashed var(--note)}

/* 流れ */
.nagare{list-style:none;margin:10px 0 0;padding:0;counter-reset:n}
.nagare li{counter-increment:n;display:grid;grid-template-columns:44px 1fr;gap:14px;align-items:baseline;position:relative;padding:8px 0;font-size:18px}
.nagare li::before{content:counter(n,cjk-ideographic);font:22px var(--f-brush);text-align:center;color:var(--ink-soft)}
.nagare li::after{content:"";position:absolute;left:21px;top:44px;bottom:-6px;width:1.5px;background:var(--ink-faint)}
.nagare li:last-child::after{display:none}
.nagare li.shu::before{color:var(--shu)}
.nagare small{display:block;font-size:14px;color:var(--ink-soft);line-height:1.7}
.nagare .t{min-width:0}
.modoru{margin:6px 0 0 58px;font:15px var(--f-hand);color:var(--note)}
.kusari{margin:0 0 1em;padding:0;list-style:none;font-size:16px}
.kusari li+li::before{content:"↓";display:block;color:var(--ink-soft);line-height:1.2;margin:2px 0}

/* 図録 */
.zuroku{border:1.5px solid rgba(31,24,19,.62);margin:8px 0 22px;background:rgba(255,248,230,.12)}
.zuroku .zu{position:relative;aspect-ratio:16/10;max-width:100%;border-bottom:1.5px solid rgba(31,24,19,.62);overflow:hidden}
.zuroku .zu canvas{position:absolute;inset:0;width:100%;height:100%;will-change:opacity}
.zuroku .zu .na{position:absolute;top:10px;left:12px;font:14px var(--f-brush);letter-spacing:.3em;color:var(--ink-soft);z-index:1}
.zuroku dl{margin:0;display:grid;grid-template-columns:6em 1fr}
.zuroku dt,.zuroku dd{margin:0;padding:10px 14px;border-bottom:1px solid rgba(31,24,19,.22)}
.zuroku dt{font:16px var(--f-brush);letter-spacing:.2em;border-right:1px solid rgba(31,24,19,.22)}
.zuroku dd{min-width:0}
.zuroku dt:last-of-type,.zuroku dd:last-of-type{border-bottom:0}
.ichiran{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:24px}
.ichiran button{all:unset;cursor:pointer;display:grid;gap:6px}
.ichiran .chiisa{position:relative;aspect-ratio:4/3;border:1.2px solid rgba(31,24,19,.5);background:rgba(255,248,230,.1)}
.ichiran canvas{position:absolute;inset:0;width:100%;height:100%}
.ichiran .nm{font:26px var(--f-brush);letter-spacing:.2em;display:flex;align-items:baseline;gap:10px}
.ichiran .nm small{font:13px var(--f-hand);color:var(--ink-soft);letter-spacing:.08em}
.ichiran button:hover .nm{color:var(--shu)}

/* 対照・問い */
.tsui{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:14px 0 20px}
.tsui > div{padding:12px 14px;min-width:0}
.tsui .kuro{border-left:3px solid var(--ink)}
.tsui .hi{border-left:3px solid var(--sun)}
.tsui .shiro{border-left:3px solid #f6f1e4;background:rgba(255,253,246,.42)}
.tsui b{display:block;font:20px var(--f-brush);font-weight:400;letter-spacing:.15em}
.toi{margin:34px auto 10px;text-align:center;font:clamp(24px,4.6vw,36px)/1.5 var(--f-brush);letter-spacing:.1em;max-width:none}
.toi .h{color:#fffaf0;text-shadow:0 0 1px var(--ink),0 0 2px var(--ink),0 0 14px rgba(255,255,255,.9)}
.toi .y{text-shadow:0 0 8px rgba(0,0,0,.5)}
.cap{text-align:center;font:13px var(--f-hand);color:var(--ink-soft);letter-spacing:.15em}

/* 光・選択 */
.hikari-ire{all:unset;cursor:pointer;border:2px solid var(--sun);color:#7a5408;padding:4px 14px;border-radius:2px;font:16px var(--f-brush);letter-spacing:.2em;transform:rotate(-2deg);display:inline-block}
.hikari-ire[aria-pressed="true"]{background:rgba(211,151,24,.18)}
.sentaku{display:flex;flex-wrap:wrap;gap:22px;justify-content:center;margin:20px 0 6px}
.sentaku button{all:unset;cursor:pointer;border:2.5px solid var(--shu);color:var(--shu);padding:10px 20px;font:21px var(--f-brush);letter-spacing:.2em;border-radius:3px;transition:background .2s}
.sentaku button:nth-child(1){transform:rotate(-3deg)}
.sentaku button:nth-child(2){transform:rotate(2deg)}
.sentaku button:hover,.sentaku button:focus-visible{background:rgba(165,42,32,.08)}
.sentaku button[aria-pressed="true"]{background:var(--shu);color:#efe3c8}
.ketsumatsu li,.ketsumatsu .ato{opacity:0}
.ketsumatsu.mieru li{animation:arawa .9s ease forwards}
.ketsumatsu.mieru li:nth-child(2){animation-delay:1.2s}
.ketsumatsu.mieru li:nth-child(3){animation-delay:2.6s}
.ketsumatsu.mieru li:nth-child(4){animation-delay:3.8s}
.ketsumatsu.mieru .ato{animation:arawa 1s ease 5s forwards}
@keyframes arawa{to{opacity:1}}
.himawari-zu{max-width:460px;margin:6px auto 4px}
.himawari-zu svg{width:100%;height:auto;display:block}

@media (max-width:560px){
  .midashi{gap:16px}
  .midashi h2{font-size:42px}
  .tsui{grid-template-columns:1fr}
  .yohaku{position:static;transform:rotate(-2deg);display:block;margin:6px 0 14px;max-width:none}
  .corner em{display:none}

<!-- ════════════════════════════════════════════════════════════
     記　事
     ────────────────────────────────────────────────────────────
     足し方：似ている <template> をひとつコピーして、題と中身を書き換える。
     並び順＝頁の順。目次・妖怪一覧・頁番号・前後の頁は自動でできる。

     data-id        頁の名前（英数字。URLの #〇〇 になる）
     data-title     縦書きの大見出し
     data-yomi      見出し横の小さな添え書き
     data-group     目次での組（記録／妖怪／物語。新しい名前で新しい組）
     data-parent    親の頁の data-id（目次で子として並ぶ）
     data-shouki    瘴気の濃さ 0〜5
     data-boro      紙の傷み 0〜1（省略すると瘴気の濃さから決まる）
     data-hikari    差し込む陽の光 0〜1
     data-style     紙の性質（空白区切り）kigen=古い起源の紙 onnen=黒と白
                    rinne=不安定 kiyome=整った神聖な紙 kurai=暗い紙
     data-tag       妖怪一覧で名前の横に出る札
     data-netabare  頁ごと伏せる（ネタバレなしのとき封印される）

     ネタバレ：伏せたい所に data-netabare をつける。
       <span data-netabare>文字</span>   → ネタバレなしのとき墨で塗りつぶす
       <div data-netabare>…</div>        → まとまりごと塗りつぶす

     中で使える書き方：
     <p class="lede">導入文　<h3>小見出し
     <ol class="nagare"><li>番号つきの記録（li class="shu" で朱の番号、<small>で補足）
     <ul class="kusari"><li>↓でつながる流れ
     <div class="zuroku" data-zu="名之図"><dl><dt>項目</dt><dd>内容</dd></dl></div> 妖怪図＋項目
     <div class="tsui"><div class="kuro">…</div><div class="hi">…</div></div> 対照（kuro/hi/shiro）
     <p class="chuki">手書きの注釈　<span class="yohaku" style="top:300px">余白の書き込み
     <span class="shuin">印</span>（class="shuin oki" style="right:8%;top:120px" で紙の上に置く）
     <del>二重線　<div class="sen"></div>墨の区切り線
     <button class="tobu" data-go="頁のid">→ …</button> 別の頁へ
     <p class="mikisai">未記</p> まだ書かれていない欄
     ════════════════════════════════════════════════════════════ -->

/* ════ 古紙を描く（頁ごとに一度だけ） ════ */
function katachi(w,h,r,boro,koma){
  const m=5*koma, jag=(1.2+boro*3.2)*koma, step=7*koma, pts=[];
  const corner=r()<.35+boro*.55 ? (20+r()*50*boro+20)*koma : 0;
  const edge=(x0,y0,x1,y1,nx,ny)=>{
    const L=Math.hypot(x1-x0,y1-y0), n=Math.max(2,Math.round(L/step)); let bite=0,bl=0,bd=0;
    for(let i=0;i<=n;i++){
      const t=i/n; let d=m+r()*jag;
      if(bite<=0 && r()<.02*boro && i>2 && i<n-2){ bl=3+(r()*7|0); bite=bl; bd=(6+r()*18*boro)*koma; }
      if(bite>0){ d+=Math.sin(Math.PI*(1-bite/bl))*bd; bite--; }
      pts.push([x0+(x1-x0)*t+nx*d, y0+(y1-y0)*t+ny*d]);
    }
  };
  edge(corner,0,w,0,0,1); edge(w,0,w,h,-1,0); edge(w,h,0,h,0,-1); edge(0,h,0,corner,1,0);
  if(corner){ const n=8; for(let i=1;i<n;i++){ const t=i/n; pts.push([corner*t+(r()-.5)*7*koma+m, corner*(1-t)+(r()-.5)*7*koma+m]); } }
  return pts;
}
const pathOf=(x,pts)=>{ x.beginPath(); pts.forEach(([a,b],i)=>i?x.lineTo(a,b):x.moveTo(a,b)); x.closePath(); };

    g.addColorStop(0,"rgba(140,100,50,0)"); g.addColorStop(.86,`rgba(130,90,40,${.05+boro*.06})`); g.addColorStop(.93,`rgba(110,75,30,${.12+boro*.12})`); g.addColorStop(1,"rgba(110,75,30,0)");

      const R=md*(.08+rr()*.2)*reach;
      for(let j=0;j<5;j++){ const bx=px+(rr()-.5)*R, by=py+(rr()-.5)*R, br=R*(.5+rr()*.8), a=.35+rr()*.35, g=s.createRadialGradient(bx,by,0,bx,by,br);
        g.addColorStop(0,`rgba(16,9,6,${a})`); g.addColorStop(.55,`rgba(24,13,7,${a*.55})`); g.addColorStop(.85,`rgba(40,22,10,${a*.15})`); g.addColorStop(1,"rgba(40,22,10,0)");
        s.fillStyle=g; s.beginPath(); s.arc(bx,by,br,0,Math.PI*2); s.fill(); }

  shimi(sh.querySelector("canvas.s1"),.7+lv*.5,Math.round(5+lv*8),seed+1);
  shimi(sh.querySelector("canvas.s2"),1+lv*.8,Math.round(6+lv*12),seed+2);
  const sc=sh.querySelector("canvas.shiro"); sc.width=hw; sc.height=hh;
  if(k.style.includes("onnen")){ const s=sc.getContext("2d"), rr=rng(seed+3); s.save(); pathOf(s,hp); s.clip();
    for(let i=0;i<5;i++){ const px=hw*(.15+rr()*.7), py=hh*(.1+rr()*.8), R=md*(.12+rr()*.14), g=s.createRadialGradient(px,py,0,px,py,R);
      g.addColorStop(0,"rgba(253,250,242,.85)"); g.addColorStop(.6,"rgba(250,246,236,.45)"); g.addColorStop(1,"rgba(250,246,236,0)"); s.fillStyle=g; s.beginPath(); s.arc(px,py,R,0,Math.PI*2); s.fill(); }
    s.restore(); }
  const uc=sh.querySelector("canvas.urami"); uc.width=hw; uc.height=hh;
  if(k.shouki>=3){ const t=mk(hw,hh), tx=t.getContext("2d"), s=Math.min(hw*.85,hh*.6); Sumi.zu(tx,(hw-s)/2,hh*.12,s,s*.75,seed,true);
    const u=uc.getContext("2d"); u.filter="blur(3px)"; u.drawImage(t,0,0); }
}

/* ════ 堂の空気：灯りと瘴気を、粗いキャンバス1枚に少ない回数で描く ════ */
const Kuuki=(()=>{
  const c=$("kiri"), x=c.getContext("2d"), D=6; let W=0,H=0;
  const size=()=>{ W=Math.ceil(innerWidth/D); H=Math.ceil(innerHeight/D); c.width=W; c.height=H; };
  size(); addEventListener("resize",size);
  const r=rng(3), puffs=[];
  const spots=[[0,.1],[0,.5],[0,.9],[1,.15],[1,.55],[1,.92],[.5,0],[.5,1],[.2,1],[.8,0],[.12,.3],[.88,.72],[.05,.7],[.95,.35],[.3,0],[.7,1]];
  spots.forEach(([u,v],i)=>puffs.push({u:u+(r()-.5)*.1,v:v+(r()-.5)*.1,s:.45+r()*.4,a:.6+r()*.4,ph:r()*6.28,sp:.05+r()*.06,ax:.06+r()*.08,ay:.05+r()*.07,w:i%3===1,dep:.6+r()*.8}));
  const st={lv:0,lvT:0,light:0,lightT:0,pulse:0,mode:"",glow:1};
  let px=0,py=0,tx=0,ty=0; const hk={el:$("hikari"),o:""};
  if(!reduce) addEventListener("pointermove",e=>{ tx=(e.clientX/innerWidth-.5); ty=(e.clientY/innerHeight-.5); },{passive:true});
  let last=0,T=0;
  function frame(now){
    requestAnimationFrame(frame);
    const every=reduce?500:55; if(now-last<every) return;
    if(!ensyutsu){ last=now; return; }
    const dt=Math.min(.2,(now-last)/1000); last=now; T+=dt*(st.mode==="rinne"?2.6:1);
    st.lv+=(st.lvT-st.lv)*Math.min(1,dt*.9); st.light+=(st.lightT-st.light)*Math.min(1,dt*1.3); st.pulse*=Math.pow(.5,dt/.5);
    px+=(tx-px)*.15; py+=(ty-py)*.15;
    const ho=st.light.toFixed(2); if(ho!==hk.o){ hk.o=ho; hk.el.style.opacity=ho; }
    x.clearRect(0,0,W,H);
    // 灯り（ゆらぐ）
    let fl=.86+.08*Math.sin(T*3.1)+.05*Math.sin(T*7.3+1)+(Math.sin(T*1.3)>.97?-.15:0);
    const gx=W*.5,gy=H*.3,gr=Math.max(W,H)*.55, g=x.createRadialGradient(gx,gy,0,gx,gy,gr);
    const ga=.2*fl*st.glow; g.addColorStop(0,`rgba(255,170,85,${ga})`); g.addColorStop(.5,`rgba(255,140,60,${ga*.3})`); g.addColorStop(1,"rgba(255,140,60,0)");
    x.fillStyle=g; x.fillRect(0,0,W,H);
    // 瘴気
    let m=clamp(st.lv+st.pulse)*(1-st.light*.8);
    if(st.mode==="rinne"){ m*=.75+.3*Math.sin(T*1.7); if(r()<.06) m*=.4; }
    if(m>.01){
      const big=Math.max(W,H), flee=st.light*.25;
      for(const p of puffs){
        const sp=reduce?0:1;
        const X=(p.u+Math.sin(T*p.sp+p.ph)*p.ax*sp-px*.05*p.dep - flee*(.6-p.u))*W, Y=(p.v+Math.cos(T*p.sp*.8+p.ph)*p.ay*sp-py*.05*p.dep + flee*(p.v-.2))*H;
        const S=big*p.s*(1+.15*Math.sin(T*.4+p.ph))*(.8+m*.5);
        x.globalAlpha=clamp(p.a*m*(p.w&&st.mode==="onnen"?1.2:1));
        x.drawImage(p.w&&st.mode==="onnen"?SHIRO:KURO,X-S/2,Y-S/2,S,S);
        if(m>.5){ x.globalAlpha=clamp(p.a*(m-.5)); x.drawImage(KURO,X-S*.35,Y-S*.35,S*.7,S*.7); }
      }
      x.globalAlpha=1;
      // 紙の読む場所は空ける
      x.save(); x.globalCompositeOperation="destination-out"; x.translate(W/2,H*.5); x.scale(W*.34,H*.52);
      const h=x.createRadialGradient(0,0,0,0,0,1); h.addColorStop(0,"rgba(0,0,0,.92)"); h.addColorStop(.6,"rgba(0,0,0,.7)"); h.addColorStop(1,"rgba(0,0,0,0)");
      x.fillStyle=h; x.fillRect(-1,-1,2,2); x.restore();
    }
  }
  requestAnimationFrame(frame);
  return {
    get lv(){return st.lvT},
    set(lv,light){ if(lv!=null) st.lvT=lv; if(light!=null){ st.lightT=light; const cur=document.querySelector(".sheet:not(.yuku)"); if(cur) cur.classList.toggle("hareru",light>.6); } },
    jump(lv){ st.lv=st.lvT=lv; },
    uzuku(){ st.pulse=.35; },
    mode(m){ st.mode=m; },
    glow(v){ st.glow=v; }
  };
})();

/* ════ 頁 ════ */
const stage=$("stage"), kakera=$("kakera");
let cur=-1, zuList=[], opened=0;
const taintOf=()=>clamp((yonda.size-2)/Math.max(1,N-2));
const levelFor=k=>k.style.includes("hyoushi")?.3:clamp(.12+k.shouki/5*.62+taintOf()*.3);

function midashi(k,frag){
  const h=document.createElement("header"); h.className="midashi";
  const h2=document.createElement("h2"); h2.textContent=k.title; h.appendChild(h2);
  const box=document.createElement("div"); box.className="lede-box";
  if(k.yomi){ const p=document.createElement("p"); p.className="yomi"; p.textContent=k.yomi; box.appendChild(p); }
  frag.querySelectorAll(":scope > .lede").forEach(l=>box.appendChild(l)); h.appendChild(box); return h;
}

function makeSheet(i){
  const k=kiji[i], sh=document.createElement("article");
  sh.className="sheet "+k.style.join(" ");
  const r=rng(hash(k.id)); sh.style.setProperty("--tilt",((r()-.5)*1.4).toFixed(2)+"deg"); sh.style.setProperty("--sx",((r()-.5)*14).toFixed(1)+"px");
  const lv=k.shouki/5;
  sh.style.setProperty("--o1",clamp(.35+lv*.6).toFixed(2)); sh.style.setProperty("--o2",clamp(lv*.95-.1).toFixed(2)); sh.style.setProperty("--ura",k.shouki>=3?(.05+lv*.13).toFixed(2):"0");
  sh.innerHTML=`<div class="kage"></div><canvas class="kami"></canvas><canvas class="urami"></canvas><canvas class="s1"></canvas><canvas class="s2"></canvas><canvas class="shiro"></canvas><div class="leaf"></div>
    <button class="idx" data-nav="mokuji" aria-label="目次へ" title="目次">目</button>
    <button class="ensyutsu" data-nav="ensyutsu"></button>
    <button class="corner prev" data-nav="prev" aria-label="前の頁"><span></span><em></em></button>
    <button class="corner next" data-nav="next" aria-label="次の頁"><span></span><em></em></button><div class="folio"></div>`;
  const leaf=sh.querySelector(".leaf"), frag=k.tpl.content.cloneNode(true);
  if(k.fuuin && netabare!=="ari"){
    leaf.appendChild(midashi(k,document.createDocumentFragment()));
    leaf.insertAdjacentHTML("beforeend",`<p class="fuuin"><span class="shuin">封</span></p><p class="cap">この頁は伏せられている。目次で「すべて読む」にすると開く。</p>`);
  } else {
    if(!k.style.includes("hyoushi")) leaf.appendChild(midashi(k,frag));
    leaf.appendChild(frag);
  }
  leaf.querySelectorAll('[data-auto="mokuji"]').forEach(el=>el.replaceWith(mokuji()));
  leaf.querySelectorAll('[data-auto="ichiran"]').forEach(el=>el.replaceWith(ichiran()));
  leaf.querySelectorAll(".shuin:not([style*='--r'])").forEach(s=>s.style.setProperty("--r",((r()-.5)*16).toFixed(1)+"deg"));
  leaf.querySelectorAll(".himawari-zu").forEach(el=>Sumi.himawari(el));
  leaf.querySelectorAll("[data-netabare]").forEach(e=>e.setAttribute("aria-hidden",netabare!=="ari"));
  leaf.querySelectorAll("[data-netabare-sentaku]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.netabareSentaku===netabare));
  leaf.querySelectorAll("[data-hikari]").forEach(b=>b.addEventListener("click",()=>{
    const on=b.getAttribute("aria-pressed")!=="true"; b.setAttribute("aria-pressed",on); b.textContent=on?"光を遮る":"光を当てる"; Kuuki.set(null,on?+b.dataset.hikari:k.hikari);
  }));
  leaf.querySelectorAll(".sentaku").forEach(b=>sentaku(b,sh));
  const pv=sh.querySelector(".prev"), nx=sh.querySelector(".next");
  pv.hidden=i===0; nx.hidden=i===N-1||i===0;
  pv.querySelector("em").textContent=i>0?kiji[i-1].title:""; nx.querySelector("em").textContent=i<N-1?kiji[i+1].title:"";
  sh.querySelector(".folio").textContent=i===0?"":`— ${K(i)} —`;
  sh.querySelector(".idx").hidden=i<=1;
  const eb=sh.querySelector(".ensyutsu"); eb.hidden=i===0; eb.textContent=ensyutsu?"光を当てる":"光を遮る"; eb.setAttribute("aria-label",ensLabel()); eb.title=ensLabel();
  leaf.querySelectorAll("[data-ensyutsu-sentaku]").forEach(b=>b.setAttribute("aria-pressed",(b.dataset.ensyutsuSentaku==="on")===ensyutsu));
  return sh;
}

function mokuji(){
  const wrap=document.createElement("div");
  const groups=[]; kiji.forEach(k=>{ if(k.group && !groups.includes(k.group)) groups.push(k.group); });
  let html="";
  for(const g of groups){ html+=`<p class="kumi">${g}</p><ul class="mokuji">`;
    kiji.forEach((k,i)=>{ if(k.group!==g) return; html+=`<li class="${k.parent?"ko":""}"><button data-go="${k.id}" class="${yonda.has(k.id)?"yonda":""}"><span>${k.title}</span><small>${K(i)}</small></button></li>`; });
    html+=`</ul>`; }
  wrap.innerHTML=html; const ul=wrap;
  const sita=document.createElement("div"); sita.className="mokuji-shita";
  const kr=document.createElement("button"); kr.className="kirikae";
  const label=()=>kr.textContent=netabare==="ari"?"いま：すべて読む（ネタバレあり）":"いま：伏せて読む（ネタバレなし）";
  label(); kr.addEventListener("click",()=>{ setNetabare(netabare==="ari"?"nashi":"ari"); label(); });
  const re=document.createElement("button"); re.className="arata"; re.textContent="紙を新しくする（読んだ記録を消す）";
  re.addEventListener("click",()=>{ yonda=new Set(["hyoushi","mokuji"]); store.set("garando.yonda",[...yonda]); ul.querySelectorAll(".yonda").forEach(b=>b.classList.remove("yonda")); Kuuki.set(levelFor(kiji[cur])); akari(); });
  const ke=document.createElement("button"); ke.className="kirikae kirikae-ens"; ke.style.borderColor="var(--sun)"; ke.style.color="#7a5408";
  ke.textContent="いま："+(ensyutsu?"光を遮っている（演出あり）":"光を当てている（演出オフ）"); ke.addEventListener("click",()=>setEnsyutsu(!ensyutsu));
  sita.append(kr,ke,re); wrap.appendChild(sita); return wrap;
}

function ichiran(){
  const d=document.createElement("div"); d.className="ichiran";
  kiji.forEach(k=>{ if(k.group!=="妖怪"||!k.tpl.content.querySelector(".zuroku")) return;
    const b=document.createElement("button"); b.dataset.go=k.id; b.innerHTML=`<div class="chiisa"></div><span class="nm"></span>`;
    b.querySelector(".nm").textContent=k.title; if(k.tag){ const s=document.createElement("small"); s.textContent=k.tag; b.querySelector(".nm").appendChild(s); }
    d.appendChild(b);
    requestAnimationFrame(()=>{ const box=b.querySelector(".chiisa"), bw=box.clientWidth||200, bh=box.clientHeight||150, dpr=Math.min(devicePixelRatio||1,2), c=mk(bw*dpr,bh*dpr), x=c.getContext("2d"); x.scale(dpr,dpr); Sumi.zu(x,0,0,bw,bh,hash(k.id),k.shouki>=5); box.appendChild(c); });
  });
  return d;
}

function sentaku(box,sh){
  const out=box.parentElement.querySelector(".ketsumatsu"); if(!out) return; const erabi=out.querySelector("[data-erabi]");
  box.querySelectorAll("[data-sentaku]").forEach(b=>b.addEventListener("click",()=>{
    box.querySelectorAll("[data-sentaku]").forEach(x=>x.setAttribute("aria-pressed","false")); b.setAttribute("aria-pressed","true");
    const iku=b.dataset.sentaku==="iku";
    erabi.innerHTML=iku?"ひまわり畑に行く<small>陽の光のもとへ。</small>":"ひまわり畑に行かない<small>陽の光から遠ざかる。</small>";
    out.hidden=false; out.classList.remove("mieru"); void out.offsetWidth; out.classList.add("mieru");
    sh.classList.remove("zawameku");
    if(iku){ Kuuki.set(null,1); setTimeout(()=>{ Kuuki.set(Math.min(1,Kuuki.lv+.35),0); Kuuki.uzuku(); sh.classList.add("zawameku"); },2400); }
    else { Kuuki.set(Math.min(1,Kuuki.lv+.3),0); Kuuki.uzuku(); setTimeout(()=>sh.classList.add("zawameku"),700); }
  }));
}

function kakeraOn(on){
  if(on && !kakera.childElementCount){
    const words=kiji.filter(k=>k.group).map(k=>k.title).concat(["寄生","陽の光","太刀","負の感情"]), r=rng(77);
    [[3,8],[80,6],[89,33],[2,42],[85,63],[5,76],[72,88],[28,91],[13,22],[91,86]].forEach(([l,t],i)=>{
      const s=document.createElement("span"); s.textContent=words[(i*3)%words.length]; s.style.left=l+"%"; s.style.top=t+"%";
      const v={d:(18+r()*20)+"s",dl:(-r()*20)+"s",dx:((r()-.5)*60)+"px",dy:((r()-.5)*60)+"px",r0:((r()-.5)*24)+"deg",r1:((r()-.5)*24)+"deg"};
      for(const k in v) s.style.setProperty("--"+k,v[k]); kakera.appendChild(s); });
  }
  clearTimeout(kakeraOn.t); if(on) kakeraOn.t=setTimeout(()=>kakera.classList.add("on"),2200); else kakera.classList.remove("on");
}
const akari=()=>Kuuki.glow(1-taintOf()*.6);

let nobori=0;
function go(i,opt={}){
  if(i<0||i>=N||i===cur) return;
  // 紙の途中を読んでいたら、まず紙の頭まで目を戻してからめくる
  if(!reduce && scrollY>4){
    const id=++nobori, t0=performance.now();
    scrollTo({top:0,behavior:"smooth"});
    const wait=()=>{ if(id!==nobori) return; if(scrollY<2||performance.now()-t0>700){ scrollTo(0,0); mekuru(i,opt); } else requestAnimationFrame(wait); };
    requestAnimationFrame(wait); return;
  }
  nobori++; mekuru(i,opt);
}
function mekuru(i,{push=true}={}){
  if(i<0||i>=N||i===cur) return;
  const fwd=i>cur, old=stage.querySelector(".sheet:not(.yuku)");
  stage.querySelectorAll(".sheet.yuku").forEach(e=>e.remove());
  if(old){
    old.classList.remove("kaeru","kuru","matsu");
    if(reduce) old.remove();
    else {
      // 今の紙を画面に留める（スクロールしても動かない）
      const sr=stage.getBoundingClientRect(), w=old.offsetWidth, h=old.offsetHeight;
      old.style.left=(sr.left+old.offsetLeft)+"px"; old.style.top=(sr.top+old.offsetTop)+"px";
      old.style.width=w+"px"; old.style.height=h+"px";
      old.classList.add("yuku",fwd?"fwd":"nokoru");
      setTimeout(()=>old.remove(),fwd?820:840);
    }
  }
  cur=i; const k=kiji[i]; yonda.add(k.id); store.set("garando.yonda",[...yonda]);
  const sh=makeSheet(i); stage.appendChild(sh); scrollTo(0,0);
  Kuuki.mode(k.style.includes("onnen")?"onnen":k.style.includes("rinne")?"rinne":"");
  Kuuki.set(levelFor(k),k.hikari);
  if(k.style.includes("hyoushi")){ Kuuki.jump(0); setTimeout(()=>{ if(kiji[cur]===k) Kuuki.set(.4); },1500); } else Kuuki.uzuku();
  kakeraOn(k.style.includes("hyoushi")); akari();
  if(push){ try{ history.replaceState(null,"","#"+k.id); }catch(e){} }
  const draw=()=>{
    zuList=[...sh.querySelectorAll(".zuroku[data-zu]")].map(z=>{
      const f=document.createElement("div"); f.className="zu"; f.innerHTML=`<span class="na"></span>`; f.querySelector(".na").textContent=z.dataset.zu; z.prepend(f);
      return Sumi.futae(f,hash(k.id),k.shouki>=5);
    });
    kamiwoKaku(sh,k);
    requestAnimationFrame(()=>requestAnimationFrame(()=>sh.classList.add("ikiru")));
    opened=performance.now(); nozoku();
  };
  if(old && !reduce && !fwd){
    // 戻る：前の紙が左から重なってくる（描いてから動かす）
    sh.classList.add("matsu"); draw();
    requestAnimationFrame(()=>{ sh.classList.remove("matsu"); sh.classList.add("kaeru"); setTimeout(()=>sh.classList.remove("kaeru"),820); });
  } else if(old && !reduce){
    // 進む：上の紙が持ち上がって左へ退く。下の紙はその間に描く
    sh.classList.add("matsu");
    requestAnimationFrame(()=>requestAnimationFrame(()=>{ draw(); sh.classList.remove("matsu"); }));
  } else draw();
}

/* 覗き込む：スクロールしたときだけ計算 */
let nzPending=false;
function nozoku(){
  nzPending=false; if(!zuList.length) return;
  const vh=innerHeight, tm=clamp((performance.now()-opened)/1000/24)*.5;
  for(const c of zuList){ const rc=c.getBoundingClientRect(); const p=Math.max(tm,clamp((vh*.6-rc.top)/(vh*.45))); c.style.opacity=p.toFixed(2); }
}
addEventListener("scroll",()=>{ if(!nzPending){ nzPending=true; requestAnimationFrame(nozoku); } },{passive:true});
setInterval(()=>{ if(zuList.length && performance.now()-opened<26000) nozoku(); },1000);

/* 大きさが変わったら紙を描き直す（間引く） */
let rsT=0; new ResizeObserver(()=>{ clearTimeout(rsT); rsT=setTimeout(()=>{ const sh=stage.querySelector(".sheet:not(.yuku)"); if(sh && sh.dataset.size!==sh.offsetWidth+"x"+sh.offsetHeight) kamiwoKaku(sh,kiji[cur]); },180); }).observe(stage);
document.fonts && document.fonts.ready.then(()=>{ const sh=stage.querySelector(".sheet:not(.yuku)"); if(sh && sh.dataset.size!==sh.offsetWidth+"x"+sh.offsetHeight) kamiwoKaku(sh,kiji[cur]); });

/* 操作 */
document.addEventListener("click",e=>{
  const g=e.target.closest("[data-go]"); if(g && byId[g.dataset.go]!=null) return go(byId[g.dataset.go]);
  const n=e.target.closest("[data-nav]"); if(n){ const v=n.dataset.nav; if(v==="ensyutsu") return setEnsyutsu(!ensyutsu); return go(v==="prev"?cur-1:v==="next"?cur+1:byId.mokuji); }
  const es=e.target.closest("[data-ensyutsu-sentaku]"); if(es) return setEnsyutsu(es.dataset.ensyutsuSentaku==="on");
  const s=e.target.closest("[data-netabare-sentaku]"); if(s){ setNetabare(s.dataset.netabareSentaku); s.parentElement.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b===s)); setTimeout(()=>go(byId.mokuji),450); }
});
document.addEventListener("keydown",e=>{ if(e.key==="ArrowRight"&&cur>0) go(cur+1); if(e.key==="ArrowLeft") go(cur-1); });
let sx=null,sy=null;
stage.addEventListener("touchstart",e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
stage.addEventListener("touchend",e=>{ if(sx===null) return; const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy; if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.6&&cur>0) go(cur+(dx<0?1:-1)); sx=null; },{passive:true});

const start=byId[(location.hash||"").slice(1)];
go(netabare && start!=null ? start : 0,{push:false});
})();
</script>
