<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>血と肉 事件資料</title>
<meta name="description" content="御身神山における行方不明事案の記録。">
  <link rel="icon" href="img/titoniku.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Shippori+Mincho:wght@500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: ①署の机（卓上ランプに照らされた木の机）に捜査資料のフォルダ → 開くと事件概要の紙 → 人物資料の紙が並ぶ
   ②「御身神山」の資料の中のボタンで山へ → 一人称の山道（左右に木、中央に道、奥は霧）を「進む」で下から進む
   ③「気になる点……」に触れると紙の報告書。読んだ資料は資料一覧に綴じられる。
   単一の世界観（夜の署・霧の山）なので、配色は明示指定。 */
:root{
  --night:#141311; --ink:#1d1f22; --sub:#5d6268; --paper:#f7f5ef; --paper2:#f3ede6; --rule:#c9c6bd;
  --stamp:#a8302b; --navy:#1f3a64; --lamp:#f3d9a4; --hud:#ece6dc; --hud-sub:#b7afa3;
  --f-body:"BIZ UDPGothic","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  --f-disp:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--night)}
body{color:var(--hud);font-family:var(--f-body);font-size:15px;line-height:1.8;margin:0;padding-inline:0;padding-block:0}
button{font-family:inherit}
:focus-visible{outline:2px solid #e0a46a;outline-offset:3px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:rgba(20,19,17,.92);border-bottom:1px solid #2c2925;
  padding:9px 16px;display:flex;gap:8px 14px;align-items:center;flex-wrap:wrap}
.top .name{font-family:var(--f-disp);font-weight:700;font-size:17px;letter-spacing:.16em;display:flex;align-items:center}
.logo-s{height:30px;width:auto;display:block;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}
.logo-h{margin:6px 0 10px!important}
.logo-h img{height:96px;width:auto;max-width:100%;display:block}
.top .case{font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;color:var(--hud-sub)}
.top .sp{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{font-family:var(--f-mono);font-size:11px;letter-spacing:.04em;border:1px solid #3d3832;padding:3px 9px;color:var(--hud-sub);background:transparent;cursor:pointer;border-radius:2px}
.chip:hover{color:var(--hud);border-color:#6a6157}
.chip b{color:var(--hud);font-weight:500}
.retreat{font-size:12px;color:#d9c39a;background:none;border:0;cursor:pointer;padding:2px 0;text-decoration:underline;text-underline-offset:3px}
.retreat:disabled{color:#c25a4f;text-decoration:line-through;cursor:not-allowed}

/* ===================== 机 ===================== */
.desk{position:relative;min-height:calc(100vh - 46px);padding:28px 16px 60px;overflow:hidden;
  background-color:#3a2a1e;background-size:520px 520px}
.desk::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 70% 60% at 50% 30%,rgba(255,214,150,.20),transparent 60%),radial-gradient(ellipse 120% 90% at 50% 40%,transparent 50%,rgba(0,0,0,.6))}
.desk-inner{position:relative;max-width:980px;margin:0 auto}

.folder{display:block;margin:7vh auto 0;width:min(420px,100%);aspect-ratio:1.38;position:relative;border:0;padding:0;cursor:pointer;background:none}
.folder .back{position:absolute;inset:0;background:#c9a467;border-radius:3px 10px 3px 3px;box-shadow:0 18px 30px rgba(0,0,0,.5)}
.folder .tab{position:absolute;left:0;top:-18px;width:38%;height:22px;background:#c9a467;border-radius:6px 6px 0 0}
.folder .front{position:absolute;inset:6px 0 0 0;background:linear-gradient(180deg,#d8b778,#cfae6e);border-radius:2px 8px 3px 3px;
  display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px;color:#3b2a14;transition:transform .9s ease;transform-origin:bottom}
.folder .lbl{background:#f4efe2;padding:10px 22px;box-shadow:0 1px 2px rgba(0,0,0,.2);text-align:center}
.folder .lbl small{display:block;font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;color:#6b5a3f}
.folder .lbl b{font-family:var(--f-disp);font-size:22px;letter-spacing:.14em}
.folder .secret{font-family:var(--f-disp);font-weight:700;color:var(--stamp);border:2px solid var(--stamp);padding:0 8px;letter-spacing:.3em;transform:rotate(-6deg);opacity:.8;margin-top:6px}
.folder:hover .front{transform:perspective(900px) rotateX(8deg)}
.folder.opening .front{transform:perspective(900px) rotateX(78deg);opacity:.0;transition:transform .9s ease,opacity .9s ease .3s}
.desk-hint{text-align:center;color:var(--lamp);opacity:.75;font-size:13px;margin-top:22px;letter-spacing:.1em}

/* 机の上の紙 */
.paper{background:var(--paper);color:var(--ink);position:relative;
  background-image:radial-gradient(rgba(120,110,90,.06) 1px,transparent 1px);background-size:3px 3px;
  box-shadow:0 1px 1px rgba(0,0,0,.2),0 10px 22px rgba(0,0,0,.45)}
.lead{width:min(620px,100%);margin:2vh auto 0;padding:34px 34px 30px;animation:rise .9s ease both}
.lead.small{animation:none}
@keyframes rise{from{opacity:0;transform:translateY(40px) rotate(-1deg)}to{opacity:1;transform:none}}
@keyframes drop{from{opacity:0;transform:translateY(-30px) scale(1.04) rotate(var(--r,0deg))}to{opacity:1;transform:rotate(var(--r,0deg))}}

.zone{margin-top:30px}
.zone-label{display:inline-block;font-family:var(--f-mono);font-size:11px;letter-spacing:.16em;color:#2b2416;background:#e9dfc4;padding:2px 10px;transform:rotate(-1deg);box-shadow:0 2px 6px rgba(0,0,0,.4)}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:22px 18px;margin-top:16px}
.person{border:0;text-align:left;cursor:pointer;padding:14px 14px 16px;background:var(--paper2);transform:rotate(var(--r,0deg));
  animation:drop .7s ease both;transition:transform .2s,box-shadow .2s;min-width:0;display:flex;flex-direction:column;gap:8px}
.person:hover{transform:rotate(0deg) translateY(-4px);box-shadow:0 1px 1px rgba(0,0,0,.2),0 16px 26px rgba(0,0,0,.5)}
.photo{aspect-ratio:3/4;background:#d9d6cf;border:1px solid #bdb8ae;position:relative;overflow:hidden}
.photo::before{content:"";position:absolute;left:50%;top:22%;width:38%;aspect-ratio:1;border-radius:50%;background:#b1aca2;transform:translateX(-50%)}
.photo::after{content:"";position:absolute;left:50%;bottom:-18%;width:80%;height:46%;border-radius:50% 50% 0 0;background:#b1aca2;transform:translateX(-50%)}
.photo span{position:absolute;left:6px;top:4px;font-family:var(--f-mono);font-size:9px;color:#7d786e;letter-spacing:.1em;z-index:1}
.clip{position:absolute;top:-10px;left:22px;width:14px;height:34px;border:2px solid #9aa1a6;border-radius:8px;border-bottom-color:transparent;z-index:2}
.person .nm{font-family:var(--f-disp);font-weight:700;font-size:19px;letter-spacing:.06em;line-height:1.3}
.person .rb{font-size:11px;color:var(--sub);letter-spacing:.1em}
.person .ln{font-size:12px;color:#3b3f44;line-height:1.6}
.person .age{font-family:var(--f-mono);font-size:11px;color:var(--sub)}

.docs{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:24px 18px;margin-top:16px}
.sheet{border:0;text-align:left;cursor:pointer;padding:16px 16px 18px;min-height:170px;transform:rotate(var(--r,0deg));animation:drop .7s ease both;
  transition:transform .2s;min-width:0;display:flex;flex-direction:column;gap:6px}
.sheet:hover{transform:rotate(0deg) translateY(-4px)}
.sheet .no{font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;color:#6a6f76}
.sheet .t{font-family:var(--f-disp);font-weight:700;font-size:18px;line-height:1.4}
.sheet .x{font-size:12px;color:#4a4f55;line-height:1.6}
.sheet .k{font-size:11px;color:#6a6f76;margin-top:auto;border-top:1px solid #dcd8cf;padding-top:6px}
.tag{position:absolute;right:-6px;top:18px;background:#e8c75b;color:#3b2f0a;font-size:11px;padding:3px 10px 3px 12px;transform:rotate(4deg);box-shadow:0 2px 4px rgba(0,0,0,.3);letter-spacing:.08em}
.done::after{content:"済";position:absolute;right:10px;bottom:10px;font-family:var(--f-disp);font-size:12px;color:var(--stamp);border:1.5px solid var(--stamp);border-radius:50%;width:24px;height:24px;display:grid;place-items:center;opacity:.75}

/* ===================== 山 ===================== */
.forest{position:relative;height:calc(100vh - 46px);min-height:460px;overflow:hidden;background:#59625a}
.forest canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud-tl{position:absolute;left:16px;top:14px;z-index:3;text-shadow:0 1px 4px rgba(0,0,0,.7)}
.hud-tl .lb{font-family:var(--f-mono);font-size:10px;letter-spacing:.2em;color:var(--hud-sub)}
.hud-tl .pl{font-family:var(--f-disp);font-size:clamp(22px,4vw,32px);letter-spacing:.14em;line-height:1.3}
.hud-tr{position:absolute;right:16px;top:14px;z-index:3;background:rgba(14,13,12,.55);border:1px solid rgba(255,255,255,.08);padding:9px 12px;font-size:12px;min-width:150px;backdrop-filter:blur(2px)}
.hud-tr .row{display:flex;justify-content:space-between;gap:12px}
.hud-tr .ng{color:#e0665a;font-weight:700}
.hud-tr .sep{border-top:1px solid rgba(255,255,255,.1);margin:6px 0}
.hud-tr .ppl{font-size:12px;line-height:1.6}
.hud-tr .ppl span{margin-right:8px;display:inline-block}
.hud-tr .ppl s{color:#e0665a}
.hud-tr .ppl .gone{animation:fade 1.8s ease forwards}
@keyframes fade{to{opacity:0}}
.caption{position:absolute;left:50%;bottom:96px;transform:translateX(-50%);z-index:3;width:min(560px,calc(100% - 32px));text-align:center;
  font-size:15px;letter-spacing:.06em;text-shadow:0 1px 6px rgba(0,0,0,.9);line-height:1.9}
.caption p{margin:0;animation:fadein 1.4s ease both}
.caption p:nth-child(2){animation-delay:.7s}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.walk{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);z-index:4;background:rgba(14,13,12,.6);color:var(--hud);
  border:1px solid rgba(255,255,255,.18);padding:10px 30px 12px;letter-spacing:.3em;font-size:14px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:0}
.walk::after{content:"";width:9px;height:9px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg);margin-top:2px}
.walk:hover{background:rgba(30,28,25,.75)}
.walk:disabled{opacity:.3;cursor:default}
.spot{position:absolute;z-index:3;transform:translate(-50%,-50%);background:none;border:0;cursor:pointer;color:#f1e7d6;display:flex;align-items:center;gap:8px;padding:6px;animation:fadein 1.2s ease both}
.spot i{width:16px;height:16px;border-radius:50%;border:1.5px solid #f1e7d6;position:relative;flex:none}
.spot i::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:1px solid rgba(241,231,214,.5);animation:ping 2.4s ease-out infinite}
@keyframes ping{from{transform:scale(.6);opacity:1}to{transform:scale(1.5);opacity:0}}
.spot span{font-size:12px;letter-spacing:.12em;text-shadow:0 1px 4px rgba(0,0,0,.9);white-space:nowrap}
.spot.seen{opacity:.45}
.spot.seen i::after{display:none}
.blackout{position:absolute;inset:0;z-index:6;background:#050404;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:24px;animation:fadein 2.4s ease both}
.blackout .last{font-family:var(--f-disp);font-size:clamp(20px,4.4vw,28px);letter-spacing:.12em;margin:0;color:#e4dad2;animation:fadein 2s ease 2s both}
.blackout .fin{font-family:var(--f-mono);font-size:11px;letter-spacing:.26em;color:#7d726c;animation:fadein 2s ease 4s both}
.blackout .again{animation:fadein 1s ease 7s both}

/* ===================== 報告書 ===================== */
.reader{position:fixed;inset:0;z-index:30;background:rgba(6,6,5,.7);display:flex;justify-content:center;align-items:flex-start;
  padding:calc(env(safe-area-inset-top,0px) + 28px) 16px 40px;overflow-y:auto}
.report{width:100%;max-width:640px;padding:32px 34px 36px;animation:rise .45s ease both}
.report.person-doc{background-color:var(--paper2)}
.report .close{position:absolute;right:10px;top:8px;background:none;border:0;font-size:12px;color:var(--sub);cursor:pointer;padding:6px}
.report .backlist{background:none;border:0;font-size:12px;color:var(--navy);cursor:pointer;padding:0;margin-bottom:10px;text-decoration:underline}
.rhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;color:var(--sub);border-bottom:2px solid var(--ink);padding-bottom:6px;margin-bottom:14px}
.report h3{font-family:var(--f-disp);font-weight:700;font-size:24px;letter-spacing:.08em;margin:0 0 4px;text-wrap:balance}
.report .ruby{font-size:12px;color:var(--sub);letter-spacing:.12em;margin:0 0 14px}
.rbody{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.rbody.with-photo{grid-template-columns:112px minmax(0,1fr)}
.report table{width:100%;border-collapse:collapse;font-size:14px;margin:0}
.report th,.report td{border:1px solid #bdb9b0;padding:6px 10px;vertical-align:top;text-align:left}
.report th{width:7em;background:#ebe8e0;font-weight:400;color:#4a4f55;white-space:nowrap}
.report td{color:var(--ink)}
.report td.ng{color:var(--stamp);font-weight:700}
.report p{margin:.5em 0;max-width:36em}
.report .sec{font-family:var(--f-disp);font-size:16px;font-weight:700;margin:20px 0 4px;letter-spacing:.06em;border-left:3px solid var(--ink);padding-left:8px}
.report .sp{font-size:10px;letter-spacing:.1em;color:var(--stamp);border:1px solid var(--stamp);padding:0 5px;margin-left:8px;vertical-align:2px;font-weight:400}
.report .note{font-size:12px;color:var(--sub)}
.fig{margin:0 0 16px;background:#e4e1da;border:1px solid #bdb9b0;padding:12px;display:flex;flex-direction:column;align-items:center;gap:6px}
.fig img{height:220px;width:auto;max-width:100%;object-fit:contain}
.fig figcaption{font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;color:var(--sub)}
/* ---- 汚染・二周目 ---- */
.stain{position:absolute;inset:0;pointer-events:none;background-size:100% 100%;background-repeat:no-repeat;mix-blend-mode:multiply;z-index:2}
.report.jolt{animation:jolt .38s steps(2) both;opacity:1}
@keyframes jolt{0%{transform:translate(6px,-3px) skewX(-4deg);filter:contrast(1.8) hue-rotate(-20deg)}35%{transform:translate(-8px,2px);filter:invert(.85)}70%{transform:translate(3px,0) skewX(3deg);filter:none}100%{transform:none}}
body.ruin .top{border-bottom-color:#4a1512;background:rgba(14,6,6,.94)}
body.ruin .top .name{color:#c98f86}
.desk.ruin{background-color:#1d130d}
.desk.ruin::before{background:radial-gradient(ellipse 60% 50% at 45% 28%,rgba(255,190,140,.13),transparent 60%),radial-gradient(ellipse 110% 90% at 50% 40%,transparent 35%,rgba(0,0,0,.82));animation:flicker 7s infinite}
@keyframes flicker{0%,100%{opacity:1}41%{opacity:1}42%{opacity:.25}43%{opacity:.9}44%{opacity:.3}46%{opacity:1}78%{opacity:1}79%{opacity:.55}80%{opacity:1}}
.desk-blood{position:absolute;inset:0;pointer-events:none;background-size:cover;background-position:center;mix-blend-mode:multiply;opacity:.95}
.desk.ruin .desk-inner{z-index:1}
.desk.ruin .person,.desk.ruin .sheet{transform:translate(var(--dx,0),var(--dy,0)) rotate(var(--r,0deg))}
.desk.ruin .person:hover,.desk.ruin .sheet:hover{transform:translate(var(--dx,0),var(--dy,0)) rotate(0deg) translateY(-4px)}
.desk.ruin .paper{background-color:#ece6dc;filter:sepia(.25) brightness(.92)}
.torn1{clip-path:polygon(0 0,100% 0,100% 82%,93% 86%,88% 83%,80% 90%,71% 86%,64% 93%,55% 89%,47% 96%,38% 91%,30% 97%,21% 92%,12% 98%,5% 94%,0 97%)}
.torn2{clip-path:polygon(0 3%,8% 0,100% 0,100% 100%,0 100%,3% 74%,0 62%,4% 50%,1% 38%,5% 22%)}
.torn3{clip-path:polygon(0 0,62% 0,70% 6%,78% 2%,88% 9%,100% 5%,100% 100%,0 100%)}
.photo.void{background:#0b0909}
.photo.void::before,.photo.void::after{background:#1a1414}
.nm s{text-decoration-color:#8a1010;text-decoration-thickness:3px}
.go.broken{letter-spacing:.5em;transform:skewX(-8deg) rotate(-1.5deg);background:#3a1210;color:#e6c7c0;animation:jitter 2.6s infinite}
.go.broken span{display:inline-block}
@keyframes jitter{0%,92%,100%{transform:skewX(-8deg) rotate(-1.5deg)}93%{transform:skewX(14deg) translateX(6px)}95%{transform:skewX(-20deg) translateX(-8px)}97%{transform:skewX(4deg)}}
.files.pile li{border:0;margin:-3px 0;background:#f2ede5;box-shadow:0 2px 5px rgba(0,0,0,.25);transform:rotate(var(--r,0deg)) translateX(var(--dx,0));position:relative}
.files.pile button{padding:9px 10px}
.flash{position:fixed;inset:0;background:#000;z-index:60;pointer-events:none;animation:flash .5s steps(3) both}
@keyframes flash{0%{opacity:1}60%{opacity:1}100%{opacity:0}}
.forest canvas.nz{pointer-events:none;z-index:2}
.reset{background:none;border:0;color:var(--sub);font-size:11px;text-decoration:underline;cursor:pointer;padding:0;margin-top:10px}
.hanko{position:absolute;right:30px;top:124px;font-family:var(--f-disp);font-weight:700;color:var(--stamp);border:2px solid var(--stamp);padding:2px 9px;font-size:13px;letter-spacing:.2em;transform:rotate(-6deg);opacity:.8}
.report .foot{margin-top:26px;padding-top:8px;border-top:1px solid var(--rule);font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;color:#80858b}
.go{display:block;margin:26px auto 0;background:#2c3a30;color:#ecefe6;border:0;padding:13px 30px;font-family:var(--f-disp);font-size:17px;letter-spacing:.22em;cursor:pointer;box-shadow:0 6px 14px rgba(0,0,0,.3)}
.go:hover{background:#3a4c3f}
.drop{color:transparent!important;user-select:all}
.files{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.files li{border-bottom:1px solid var(--rule)}
.files button{background:none;border:0;padding:8px 2px;color:var(--ink);cursor:pointer;text-align:left;width:100%;display:flex;gap:12px;font-size:15px}
.files button:hover{color:var(--navy)}
.files .n{font-family:var(--f-mono);font-size:11px;color:var(--sub);width:5.2em;flex:none;padding-top:3px}
.files .lock{color:#8c9096;font-size:13px;padding:8px 2px}
.files-h{font-family:var(--f-mono);font-size:10px;letter-spacing:.18em;color:var(--sub);margin:18px 0 2px}

/* 開始・感染 */
.veil{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:var(--night)}
.choice{max-width:520px;width:100%;padding:30px 28px}
.choice .no{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;color:var(--sub)}
.choice h1{font-family:var(--f-disp);font-size:30px;letter-spacing:.22em;margin:4px 0 6px}
.choice p{font-size:14px;color:var(--sub);margin:0 0 18px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts button{text-align:left;background:transparent;border:1px solid var(--rule);color:var(--ink);padding:12px 14px;cursor:pointer}
.opts button:hover{border-color:var(--navy)}
.opts b{display:block;font-size:15px}
.opts span{display:block;font-size:12px;color:var(--sub);line-height:1.6}
.infect{background:#0b0707;flex-direction:column;gap:36px}
.infect p{font-family:var(--f-disp);font-size:clamp(22px,5vw,34px);letter-spacing:.18em;margin:0;color:#e4d3cd;opacity:0;animation:fadein 3.2s ease .6s forwards}
.infect button{opacity:0;animation:fadein 1.2s ease 3.8s forwards;background:transparent;color:#c9a49c;border:1px solid #5a3a36;padding:8px 18px;letter-spacing:.12em;cursor:pointer}

@media (max-width:640px){
  .lead{padding:26px 20px 24px}
  .report{padding:28px 18px 30px}
  .rbody.with-photo{grid-template-columns:minmax(0,1fr)}
  .rbody.with-photo .photo{width:110px}
  .hanko{position:static;display:inline-block;margin:0 0 10px}
  .opts{grid-template-columns:1fr}

  const i=S.step;
  $('place').textContent=garble(PLACES2[i%PLACES2.length]);
  const rows=[['通信','接続不能'],['車両','使用不能'],['帰路','通行不能']];
  $('hud').innerHTML=rows.map(([a,b])=>`<div class="row"><span>${esc(garble(a))}</span><span class="ng">${esc(garble(b))}</span></div>`).join('')
    +`<div class="sep"></div><div class="ppl"><span style="color:#e0665a">${esc(garble('飯田'))}</span></div><div class="ppl" style="margin-top:4px;color:#e0665a">あなた　血と肉</div>`;
  const echo=STEPS[(i*3+1)%STEPS.length].text;
  $('cap').innerHTML=echo.map(t=>`<p>${esc(garble(t.replace(/[{}]/g,'')))}</p>`).join('');
  const w=$('walk'); w.hidden=false; w.innerHTML=esc(garble('進む')); w.setAttribute('aria-label','進む');
  refreshSpots(); updateTop();
}
function arrive(fresh){
  if(F&&F.lap2) return arrive2();
  const st=STEPS[S.step];
  document.body.dataset.phase=phaseOf(S.step);
  $('place').innerHTML=g(st.place);
  hud(); updateTop();
  $('cap').innerHTML=st.text.map(t=>`<p>${g(decay(t,S.cleared?.12:0,5))}</p>`).join('');
  refreshSpots();
  const w=$('walk'); w.hidden=!!st.end; w.textContent=st.back?'引き返す':'進む'; w.setAttribute('aria-label',w.textContent);
  if(st.end){
    setTimeout(()=>{ if(!F) return;
      const b=document.createElement('div'); b.className='blackout';
      b.innerHTML='<p class="last">飯田は崖から落ちた。</p><div class="fin">— 記録終了 —</div><div class="again"><button class="retreat" type="button" id="restart">署へ戻る</button></div>';
      $('forest').appendChild(b);
      S.cleared=true; save(); updateTop();
      $('restart').onclick=()=>{ S={mode:S.mode, view:'desk', desk:2, step:-1, read:S.read, found:[], cleared:true, max:S.max}; save(); flash(); document.body.dataset.phase=''; renderDesk(); updateTop(); };
    }, fresh?3200:600);
  }
}
function turnBack(){
  if(!F||$('forest').querySelector('.blackout')) return;
  const b=document.createElement('div'); b.className='blackout';
  b.innerHTML='<p class="last">飯田と神田は、引き返した。</p><div class="fin">— 調査中断 —</div><p class="fin" style="letter-spacing:.12em;font-size:12px;animation-delay:5.2s">ネタバレありに切り替えると、最初から続きを読めます。</p><div class="again"><button class="retreat" type="button" id="restart">署へ戻る</button></div>';
  $('forest').appendChild(b);
  $('restart').onclick=()=>{ S.view='desk'; S.step=-1; S.max=-1; save(); flash(); document.body.dataset.phase=''; renderDesk(); updateTop(); };
}
function advance(){
  if(F&&F.lap2){ if(!F.anim) walk(); return; }
  if(F&&!F.anim&&STEPS[S.step]&&STEPS[S.step].back){ turnBack(); return; }
  if(!F||F.anim||S.step>=STEPS.length-1) return;
  if(STEPS[S.step+1].infect){ $('infect').hidden=false; $('infectGo').focus(); return; }
  walk();
}
function walk(){
  if(F.lap2 && S.step+1>=STEPS2.length){ // さまよい続ける：村の入口へ戻る
    flash(); glitch(.9,500); S.step=0; F.cam=0; save(); draw(); arrive(true); return; }
  const from=S.step*STEP_LEN; S.step++; if(!F.lap2) S.max=Math.max(S.max??-1,S.step); save();
  const tt=S.step/END_I; if(S.cleared||S.step>=2) glitch(S.cleared?.6:.12+.5*tt, S.cleared?260:50+260*tt);
  const to=S.step*STEP_LEN, dur=matchMedia('(prefers-reduced-motion: reduce)').matches?10:2200, t0=performance.now();
  F.anim=true; $('spots').innerHTML=''; $('cap').innerHTML=''; $('walk').disabled=true;
  const oldPal=F.lap2?RUIN:palAt(S.step-1), newPal=F.lap2?RUIN:palAt(S.step);
  const tick=now=>{ if(!F) return;
    const p=Math.min(1,(now-t0)/dur), e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
    F.cam=from+(to-from)*e; F.bob=Math.sin(p*Math.PI*8)*2.2;
    if((S.cleared||S.step>=5) && Math.random()<(S.cleared?.03:.012)) glitch(.4,70);
    F.pal=lerpPal(oldPal,newPal,e);
    draw();
    if(p<1) requestAnimationFrame(tick); else { F.bob=0; F.anim=false; draw(); $('walk').disabled=false; arrive(true); }
  };
  requestAnimationFrame(tick);
}
$('infectGo').onclick=()=>{ $('infect').hidden=true; walk(); };
$('retreat').onclick=()=>{
  if(S.cleared && S.view==='forest'){ if(F && ++F.tries<3){ flash(); glitch(.8,400); return; } flash(); S.view='desk'; save(); renderDesk(); updateTop(); return; }
  if(sum('ret')) return; S.view='desk'; save(); document.body.dataset.phase=''; renderDesk(); updateTop(); };
$('filesBtn').onclick=openFiles;
/* ネタバレの切り替えは、最初からやり直し（山道もルートごと変わる） */
function setMode(m){
  if(S.mode===m) return;
  const started=S.step>=0||S.read.length||S.found.length||S.cleared;
  if(S.mode && started && !confirm('ネタバレの切り替えをすると、最初からになります。よろしいですか？')) return;
  S={mode:m, view:'desk', desk:0, step:-1, read:[], found:[], cleared:false, max:-1};
  save(); stopForest(); $('reader').hidden=true; document.body.classList.remove('ruin'); document.body.dataset.phase='';
  setRoute(); renderDesk(); updateTop();
}
$('spoilBtn').onclick=()=>setMode(on()?'off':'on');
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{ setMode(b.dataset.mode); $('start').hidden=true; updateTop(); });

/* 起動 */
setRoute();
if(!S.cleared && S.step>=STEPS.length){ S.step=-1; S.max=-1; S.view='desk'; }
if(S.view==='forest' && S.step>=0) renderForest(); else { S.view='desk'; renderDesk(); }
updateTop();
if(!S.mode) $('start').hidden=false;
</script>
