<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ORIGIN ARCHIVE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Shippori+Mincho+B1:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ===== ヘッダー ===== -->
<header class="topbar" id="topbar">
  <button class="brand" id="brand" type="button" aria-label="世界地図に戻る">
    <img src="assets/images/logo.svg" alt="" class="brand-mark">
    <span class="brand-text"><span class="brand-en">ORIGIN</span><span class="brand-sub">ARCHIVE</span></span>
  </button>
  <nav class="topnav">
    <button type="button" class="tbtn" id="btn-cities"><span class="tbtn-ico">◇</span><span class="tbtn-label">都市一覧</span></button>
    <button type="button" class="tbtn" id="btn-archive"><img src="assets/images/book.svg" alt="" class="tbtn-book"><span class="tbtn-label">資料室</span></button>
    <button type="button" class="tbtn tbtn-icon" id="btn-theme" aria-label="表示の明るさを切り替え">◐</button>
  </nav>
</header>

<!-- ===== 世界地図 ===== -->
<section class="view world-view" id="world-view" aria-label="オリジン 3D世界地図">
  <canvas id="world-canvas"></canvas>
  <div class="labels" id="labels"></div>

  <div class="layer-chips" id="layer-chips" role="group" aria-label="階層"></div>

  <p class="hint" id="world-hint">ドラッグで回転・ホイールで拡大・都市の名前を選ぶと近づきます</p>

  <aside class="focus-card" id="focus-card" hidden>
    <button type="button" class="x" id="focus-close" aria-label="閉じる">×</button>
    <p class="eyebrow" id="focus-type"></p>
    <h2 class="focus-name" id="focus-name"></h2>
    <p class="focus-en" id="focus-en"></p>
    <p class="focus-summary" id="focus-summary"></p>
    <dl class="focus-facts" id="focus-facts"></dl>
    <div class="focus-actions">
      <button type="button" class="btn btn-primary" id="focus-enter">街へ入る</button>
      <button type="button" class="btn" id="focus-read">資料を読む</button>
    </div>
  </aside>
</section>

<!-- ===== 都市の中 ===== -->
<section class="view city-view" id="city-view" hidden aria-label="都市の中">
  <canvas id="city-canvas"></canvas>
  <div class="city-stage" id="city-stage"></div>
  <div class="city-fx" id="city-fx"></div>

  <div class="city-top">
    <button type="button" class="btn btn-ghost" id="city-back">← 世界地図へ</button>
    <div class="city-title">
      <p class="eyebrow" id="city-type"></p>
      <h2 id="city-name"></h2>
    </div>
    <button type="button" class="btn btn-ghost" id="city-info-btn">都市の資料</button>
  </div>

  <div class="city-nav">
    <button type="button" class="pan" id="pan-left" aria-label="左へ">‹</button>
    <div class="minimap" id="minimap"><div class="minimap-view" id="minimap-view"></div></div>
    <button type="button" class="pan" id="pan-right" aria-label="右へ">›</button>
  </div>

  <aside class="side-panel" id="city-info" hidden>
    <button type="button" class="x" id="city-info-close" aria-label="閉じる">×</button>
    <div id="city-info-body"></div>
  </aside>

  <div class="spot-card" id="spot-card" hidden>
    <button type="button" class="x" id="spot-close" aria-label="閉じる">×</button>
    <p class="eyebrow">調べる</p>
    <h3 id="spot-name"></h3>
    <p id="spot-text"></p>
  </div>

  <div class="dialog" id="dialog" hidden>
    <div class="dialog-portrait" id="dialog-portrait"></div>
    <div class="dialog-main">
      <p class="dialog-name" id="dialog-name"></p>
      <p class="dialog-text" id="dialog-text"></p>
      <div class="dialog-actions" id="dialog-actions"></div>
    </div>
  </div>

  <div class="city-enter-title" id="city-enter-title"><span class="cet-en"></span><span class="cet-jp"></span></div>
</section>

<!-- ===== 入場・遷移の演出 ===== -->
<div class="veil" id="veil"></div>

<!-- ===== タイトル ===== -->
<div class="intro" id="intro">
  <div class="intro-inner">
    <img src="assets/images/logo.svg" alt="オリジンのマーク" class="intro-mark">
    <h1 class="intro-title">ORIGIN</h1>
    <p class="intro-sub">数多の世界の中心にある、原点の世界</p>
    <button type="button" class="btn btn-primary btn-lg" id="intro-go">世界へ入る</button>
  </div>
</div>

<!-- ===== 都市一覧 ===== -->
<aside class="side-panel side-left" id="city-list" hidden>
  <button type="button" class="x" id="city-list-close" aria-label="閉じる">×</button>
  <p class="eyebrow">CITIES</p>
  <h2 class="panel-title">都市一覧</h2>
  <div id="city-list-body"></div>
</aside>

<!-- ===== 資料室 ===== -->
<div class="archive" id="archive" hidden role="dialog" aria-label="資料室">
  <div class="archive-head">
    <img src="assets/images/book.svg" alt="" class="archive-book">
    <div class="archive-title"><span class="eyebrow">ARCHIVE</span><span class="archive-h">資料室</span></div>
    <label class="search"><span class="sr">資料を検索</span><input type="search" id="search" placeholder="資料を検索" autocomplete="off"></label>
    <button type="button" class="x x-static" id="archive-close" aria-label="資料室を閉じる">×</button>
  </div>
  <div class="archive-body">
    <nav class="archive-nav" id="archive-nav"></nav>
    <div class="archive-main" id="archive-main"></div>
  </div>
</div>

<!-- ===== データ（ここに足していけば反映されます） ===== -->
<script src="data/categories.js"></script>
<script src="data/world.js"></script>
<script src="data/cities.js"></script>
<script src="data/characters.js"></script>
<script src="data/articles/world.js"></script>
<script src="data/articles/contract.js"></script>

<!-- ===== 本体 ===== -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="js/util.js"></script>
<script src="js/world-map.js"></script>
<script src="js/city-scene.js"></script>
<script src="js/archive.js"></script>
<script src="js/app.js"></script>
</body>
</html>
