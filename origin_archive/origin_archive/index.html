<!DOCTYPE html>

    </svg>

    <div id="bg-icon" class="bg-icon"></div>
    <div id="bg-particles" class="bg-particles" aria-hidden="true"></div>

<header class="site-header">
    <div class="header-inner">

        <a class="brand" href="#/">
            <img class="brand-mark" src="assets/images/logo.svg" alt="ORIGIN" onerror="this.outerHTML='<div class=&quot;brand-mark brand-mark-fallback&quot;>✦</div>';">
            <div class="brand-text">
                <span class="brand-eyebrow">ORIGIN ARCHIVE</span>
                <span class="brand-title">ORIGIN</span>
            </div>
        </a>

        <nav class="main-nav" id="main-nav"></nav>

        <div class="header-actions">
            <button class="icon-btn" aria-label="検索" onclick="openSearch()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                    <circle cx="11" cy="11" r="7"/>
                    <line x1="21" y1="21" x2="16.4" y2="16.4"/>
                </svg>
            </button>

            <div class="mode-switch" role="group" aria-label="表示モード切替">
                <button class="mode-btn" data-mode="tech" onclick="setMode('tech')">⚙ <span class="mode-btn-label">TECH</span></button>
                <button class="mode-btn" data-mode="magic" onclick="setMode('magic')">✦ <span class="mode-btn-label">MAGIC</span></button>
            </div>
        </div>

    </div>
</header>

<div class="search-overlay" id="search-overlay" onclick="if(event.target===this)closeSearch()">
    <div class="search-panel">
        <div class="search-input-row">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <circle cx="11" cy="11" r="7"/>
                <line x1="21" y1="21" x2="16.4" y2="16.4"/>
            </svg>
            <input id="search-input" type="text" placeholder="世界・都市・契約・用語を検索…" autocomplete="off" oninput="runSearch(this.value)">
            <span class="esc" onclick="closeSearch()">ESC</span>
        </div>
        <div id="search-results" class="search-results"></div>
    </div>
</div>

<div id="toast" class="toast"></div>

<div id="home-hero">
    <section class="hero">

        <svg class="hero-rings" viewBox="0 0 400 400">
            <circle cx="200" cy="200" r="190"/>

            <circle cx="200" cy="200" r="70"/>
        </svg>

        <div class="hero-inner fade-seq">

            <img class="hero-mark" src="assets/images/logo.svg" alt="ORIGIN" onerror="this.outerHTML='<div class=&quot;hero-mark hero-mark-fallback&quot;>✦</div>';">

            <div class="hero-eyebrow">
                <span class="dot"></span>
                公式設定資料集・全文検索可能
            </div>

            <h1>ORIGIN</h1>

            <p class="hero-quote">
                数多く存在する世界の中心に位置する「原点の世界」。<br>
                異なる文化、技術、思想が交差する、広大な世界。
            </p>

            <p class="hero-desc">
                本資料集はオリジンの世界・都市・契約・人物などをまとめた公式設定資料集です。
            </p>

            <div class="hero-cta">
                <a class="btn btn-primary" href="#/article/origin-overview">
                    「オリジン」とはを読む
                </a>
                <a class="btn btn-ghost" href="#" onclick="event.preventDefault();openSearch();">
                    資料集を検索する
                </a>
                <a class="btn btn-ghost" href="#/articles">
                    全記事一覧
                </a>
            </div>

        </div>

    </section>
